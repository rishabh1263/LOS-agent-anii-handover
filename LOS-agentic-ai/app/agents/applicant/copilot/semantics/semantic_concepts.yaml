# ---------------------------------------------------------------------------
# CONVERSATION -- how a turn relates to the conversation (conversation_state).
# Concept classes: whole-message phrases (AFFIRM, NEGATE, ordinals) or
# leading phrases (CANCEL, CORRECTION, AGAIN) followed by the real question.
# ---------------------------------------------------------------------------
conversation:
  AFFIRM: ['yes', yeah, yep, yup, ya, yess, haan, haa, ha, han, ji, ji haan, haan ji, hoy, ho,
           हाँ, हां, जी, हो, होय, correct, right, exactly, sure, of course, please do,
           go ahead, yes please, do it, kar do, karo, bilkul, zaroor, theek hai, thik hai, ok yes]
