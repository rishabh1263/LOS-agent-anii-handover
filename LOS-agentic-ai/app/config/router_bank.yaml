# THE ROUTER EXAMPLE BANK (Phase 3 step 6b-tune-2).
#
# Labelled questions per router tool, in English, Hindi, Hinglish and Marathi, with
# typos. The embedding router (copilot/semantics/embedding_router.py) answers a
# question by its nearest examples; only a question no example is close to goes to
# Qwen. Adding a phrasing = one line here. Real misses go to evals/router_misses.yaml
# (the learning loop), which is merged into this bank at load.
#
# KEPT APART FROM THE EVALUATION SET (evals/perf/router_tune2.py): no sentence below
# is one of the 27 measured messages, so the accuracy measured is on unseen wording.
#
# Each example: text, and optionally args (party / document / field) and state
# (the previous turn's intent label, for follow-ups such as "kyu?").

