# ---- GENERAL QUESTIONS WITH NO CASE (owner 2026-10-08: "outside a case bhi") ------------------------------------
# A question SHAPED like general knowledge ("what is / how to / is X mandatory / kya hai / kaise") that points at NO
# case is answered from the knowledge base (+ the configured facts) -- never "which case?". The coverage bank:
# evals/general_questions.yaml (tests/integration/test_general_coverage.py).
general_question:
  # the message must START with one of these (regex, lower case, after punctuation is dropped) ...
  shapes: ['^(what|whats|what s) (is|are|does|do|happens)\b', '^(define|explain|meaning of|difference between)\b',
           '^how (to|do|does|can|many|much|long|is|are)\b', '^(can|could|should|may) \w+',
           '\b(mandatory|zaroori|zaruri|required|compulsory|chahiye|jaruri) (hai|he|h)( kya)?$', '^kya .+ (chalega|zaroori hai|mandatory hai)$',
           '^(is|are|does|do) .*\b(mandatory|required|needed|compulsory|accepted|allowed|valid|necessary)\b',
           '^(which|what) (documents?|income|proof|products?)\b', '^who (approves|decides|checks|verifies)\b',
           '^why (is|are|do|does) (a|an|the)\b', '^(tell me about|batao|samjhao)\b',
           '\b(kya hai|kya hota hai|kya hoti hai|kya hote hai|ka matlab|kaise|kaise kare|kaise hota hai|kya kare|kya karna hai)$',
           '\bkaun (karta|karti|deta|deti|karte) (hai|hain)$', '\b(kya|kya kya) (chalega|chalta hai|chalti hai|lagega|lagta hai)$',
           '\b(kya )?(fark|farak|difference) (hai|kya hai)$', '\b(kitna|kitni|kitne) (hai|hota hai|hoti hai|lagta hai|lagti hai)$']
  # ... and name NO case: these words mean "this case / this customer" (the case logic answers those)
  case_referents: [this case, is case, iss case, the case, my case, mera case, meri case, this customer, is customer,
                   this loan, is loan, iska, iski, iske, uska, uski, uske, inka, unka, his, her, their, this file,
                   is applicant, this applicant, customer ka, applicant ka]
  # questions about a case's own data even without "this": the ordinary pipeline asks which case
  case_only: ['^(what is|whats) (pending|missing|the status|status|the stage|my status|left|baaki)\b',
              '\b(status|pending|baaki|baki) (kya|hai|batao)', '^(loan amount|kyc status|stage|status)\b',
              '\b(my|mera|meri|mere) (\w+ )?(status|eligibility|documents?|docs|kyc|loan|application|pending|emi)\b',
              '\b(docs|documents?) (are|is) (pending|missing|baaki|rejected|uploaded)\b',
              '^(what|which|show|list|kaunse|konse)\b.*\b(pending|missing|rejected) (docs|documents?)\b']
  # the words a question is NOT about -- what is left must appear in the answer, or it is not shown (relevance guard)
  filler: [what, whats, is, are, the, a, an, of, for, to, does, do, did, how, mean, means, meaning, define, explain,
           difference, between, and, or, kya, hai, hain, hota, hoti, hote, ka, ki, ke, matlab, me, mein, can, could,
           should, which, who, why, tell, about, batao, samjhao, loan, loans, document, documents, customer, process,
           kaise, kare, karna, karte, with, in, on, use, used, need, needed, required, mandatory, happens, after,
           work, works, does, get, give, stand, full, form, please, plz, any, this, that, there]
  # HINGLISH QUESTION SHAPES -> the handbook's English, for the knowledge SEARCH only (the reply stays in the user's
  # language; the original wording is searched first). [pattern, replacement], applied in order, lower case.
  retrieval_rewrites:
    - ['^(.+?) (fail|reject)(?:ed)? (?:ho gaya|ho gya|ho gayi|ho gyi|hua|hui)(?: to| toh)? (?:kya kare|kya karu|kya karein|kya karna hai|ab kya)$', 'what to do if \1 \2s']
    - ['^(.+?) kaise (?:hota|hoti|hote|chalta|chalti|kaam karta|kaam karti) (?:hai|hain)$', 'how does \1 work']
    - ['^(.+?) kaise (.+?)(?: kare| karu| karein| karte hai| karte hain| hota hai| hote hai| hote hain| hoga)?$', 'how to \2 \1']
    - ['^(.+?) (?:mandatory|zaroori|zaruri|required|compulsory|jaruri) (?:hai|he|h)(?: kya)?$', 'is \1 mandatory']
    - ['^(.+?) (?:kya hai|kya hota hai|kya hoti hai|kya hote hai|kya hote hain|ka matlab|matlab)$', 'what is \1']
    - ['^(.+?) kaun (?:karta|karti|deta|deti|decide karta|decide karti) hai$', 'who \1']
    - ['^(.+?) aur (.+?) (?:mein|me|main) (?:kya )?(?:fark|farak|difference)(?: hai| kya hai)?$', 'difference between \1 and \2']
    - ['^(.+?) (?:mein|me|ke liye|ke liy) (?:kya|kya kya|kaunsa|kaunse|konsa|konse) (?:chalega|chalta hai|chalti hai|de sakte hai|de sakte hain|de sakta hai|de sakte|dena hai|dena hota hai|dein|lagta hai|accept hota hai)$', 'which documents are accepted as \1']
    - ['^(?:loan )?(approve|reject|sanction|decide) kaun (?:karta|karti|karte) (?:hai|hain)$', 'who \1s the loan']
    - ['\bloan (?:ka )?process\b', 'stages of a loan']
  # the knowledge pipeline may phrase with the model (grounded + checked, agent._knowledge_reply)
  allow_model: false        # handbook text as written: no model call (fast; owner 2026-10-08 "make it faster")

# ---- CREDIT DECISIONS: never made in chat, said with who decides (no case needed) ---------------------------------
decisions:
  phrases: [will this loan get approved, will the loan get approved, will it get approved, will it be approved,
            loan approve hoga, approve hoga kya, approval milega, chance of approval, approval chances,
            can you approve, approve kar do, approve karo, should i reject, should i approve, reject kar du,
            can you reject, can you sanction, sanction kar do, is this customer eligible, kya loan milega]
  text:
    en: "I don't make credit decisions. After CPA, the credit team assesses the case (credit, then RCU) and decides. I can show what is still pending so the case is ready for them."
    hi-Latn: "Main credit decision nahi leta. CPA ke baad credit team case check karti hai (credit, phir RCU) aur decide karti hai. Main bata sakta hoon ki kya baaki hai taaki case unke liye ready ho."
    hi: "मैं क्रेडिट निर्णय नहीं लेता। CPA के बाद क्रेडिट टीम केस की जाँच करती है (क्रेडिट, फिर RCU) और निर्णय लेती है। मैं बता सकता हूँ कि क्या बाकी है ताकि केस उनके लिए तैयार हो।"
    mr: "मी क्रेडिट निर्णय घेत नाही. CPA नंतर क्रेडिट टीम केस तपासते (क्रेडिट, मग RCU) आणि निर्णय घेते. केस त्यांच्यासाठी तयार व्हावी म्हणून काय बाकी आहे ते मी सांगू शकतो."
  suggestions: { en: ["What is pending?", "Show my cases"], hi-Latn: ["Kya baaki hai?", "Mere cases dikhao"] }

# ---- POLICY NUMBERS: read from the eligibility policy NOW (eligibility_policy.yaml via policy.get_policy) ----------
# Never a typed number. A demo policy is SAID to be demo; a criterion the policy does not set is said "not set".
policy:
  # once ONE policy topic is named, these bare words name more topics in the same question ("tenure and interest rate")
  bare_words:
    tenure: [tenure, tenor, kitne saal, kitne mahine]
    interest: [interest, rate, roi, byaj]
    loan_amount: [loan amount, amount]
    age: [age, umar]
    ltv: [ltv]
    foir: [foir]
  # a long message reaches a policy number only with one of these (a value is asked)
  value_words: [how much, how many, how long, kitna, kitni, kitne, maximum, minimum, max, min, limit, range, allowed,
                required, what is the, kya hai, criteria, eligible, up to, upto]
  # the AMOUNT of any fee / charge / penalty (regex on the plain message): not configured here, said so
  fee_amount: ['\b(how much|kitna|kitni|kitne|amount of|what is the|what are the)\b.*\b(fee|fees|charge|charges|penalty|penalties)\b',
               '\b(fee|fees|charge|charges|penalty)\b.*\b(kitna|kitni|kitne|how much|amount)\b']
  subjects:
    loan_amount: [maximum loan, max loan, minimum loan, min loan, loan amount limit, kitna loan, how much loan,
                  loan limit, loan range]
    tenure: [maximum tenure, max tenure, minimum tenure, tenure limit, tenure kitna, tenure range, kitne saal ka loan,
             kitne mahine ka loan]
    interest: [interest rate, rate of interest, roi, byaj, interest kitna]
    age: [age limit, minimum age, maximum age, umar, age criteria]
    ltv: [maximum ltv, max ltv, ltv limit, ltv kitna]
    foir: [maximum foir, max foir, foir limit]
    income: [minimum income, min income, minimum salary, min salary, income required, salary required,
             which income, income is used, kitni salary]
    employment: [salaried or self employed, self employed allowed, employment type, who can apply, self employed apply,
                 salaried apply, can self employed, can salaried, self employed eligible, business owner apply]
    cibil: [minimum cibil, min cibil, cibil score required, cibil cutoff, cibil cut off, required cibil,
            credit score required, minimum credit score, kitna cibil]
    signature: [is signature mandatory, is signature required, signature mandatory, signature required,
                signature zaroori, signature compulsory, signature chahiye, signature needed]
    fees: [processing fee kitni, processing fee kitna, how much is the processing fee, processing fee amount,
           foreclosure charges, prepayment charges, charges kitne, fees kitni, how much are the charges]
    turnaround: [how long does approval take, approval time, how many days, kitne din, turnaround time, tat]
  texts:
    loan_amount: "{product}: loan amount {minimum} to {maximum}."
    tenure: "{product}: tenure {minimum} to {maximum} months."
    interest: "{product}: {rate}% a year (the rate used for the EMI estimate)."
    age: "{product}: age {minimum} to {maximum} years."
    ltv: "{product}: LTV up to {maximum}% of the property value."
    ltv_off: "{product}: LTV does not apply (no property is taken as security)."
    foir: "{product}: FOIR up to {maximum}% (above it the case goes to a reviewer)."
    income: "{product}: minimum monthly income {minimum}, taken from the verified {basis}."
    employment: "{product}: {allowed}."
    not_set: "{product}: not set in the eligibility policy."
    demo: "These are DEMO policy values ({policy_ids}), not the company's lending policy -- the credit team confirms the real limits."
    cibil: "No CIBIL score cut-off is configured in this system. The credit check happens at the Credit stage, after CPA; the credit team decides."
    signature_on: "Yes. A signature is mandatory for every case created on or after {date}; a case without it is not ready for CPA."
    signature_on_undated: "Yes. The mandatory-signature rule is on, but its start date is not configured ({problem}), so the rule cannot be applied yet."
    signature_off: "No. The mandatory-signature rule is off, so a signature is not required to move a case to CPA."
    fees: "No fee or charge amount (processing fee, prepayment or foreclosure charges) is configured in this system. The amounts are stated in the customer's sanction letter."
    turnaround: "No approval time (TAT) is configured in this system. After CPA the case goes through Credit, RCU, BOPS and HOPS before disbursement; your branch can tell you the usual time."
    unavailable: "The eligibility policy is not available right now; the credit team confirms the limits."
  source: "the eligibility policy"

# ---- CALCULATORS: exact arithmetic on the numbers typed (indicative; the eligibility check uses verified figures) --
calculators:
  emi_words: [emi, installment, instalment, kist, kisht]
  foir_words: [foir]
  ltv_words: [ltv, loan to value]
  texts:
    emi: "EMI for {principal} at {rate}% a year for {months} months: **{emi}** a month (total interest {interest}, total paid {total})."
    emi_formula: "Formula: EMI = P × r × (1+r)^n ÷ ((1+r)^n − 1), r = monthly rate, n = months."
    foir: "FOIR = {obligations} ÷ {income} × 100 = **{foir}%**."
    foir_limit: "The configured maximum is {limit}% ({policy_id}, demo values)."
    ltv: "LTV = {loan} ÷ {property_value} × 100 = **{ltv}%**."
    ltv_limit: "The configured maximum for {product} is {limit}% ({policy_id}, demo values)."
    missing: "To calculate {what} I need {needs}. Example: \"{example}\""
    note: "Indicative only -- the system's eligibility check uses the verified figures."
  examples:
    emi: "EMI for 5 lakh at 12% for 3 years"
    foir: "FOIR income 50000 emi 15000"
    ltv: "LTV for 40 lakh loan on 60 lakh property"

# ---- A GENERAL QUESTION THE KNOWLEDGE BASE CANNOT ANSWER: said plainly, logged for the owner ------------------------
general_unknown:
  en: "That isn't in the knowledge base yet, so I won't guess. I've noted the question for the team."
  hi-Latn: "Yeh abhi knowledge base mein nahi hai, isliye main andaza nahi lagaunga. Maine sawal team ke liye note kar liya hai."
  hi: "यह अभी ज्ञान-आधार में नहीं है, इसलिए मैं अनुमान नहीं लगाऊँगा। मैंने सवाल टीम के लिए नोट कर लिया है।"
  mr: "हे अजून ज्ञान-आधारात नाही, म्हणून मी अंदाज लावणार नाही. मी प्रश्न टीमसाठी नोंदवला आहे."

# ---- THE QUESTION REWRITE (owner 2026-10-08, step 1; semantics/question_rewrite.py) -------------------------------
# SLOW PATH ONLY: when the rules do not understand a message with confidence, Qwen rewrites it into ONE standard English
# question and the rules route THAT. The model never answers; the rewrite may not add a number or an id (validated).
# The examples are deliberately NOT taken from the frozen held-out set (evals/heldout/) -- never add held-out items.
llm_rewrite:
  enabled: true
  timeout_seconds: 1.5
  min_free_ram_gb: 2.0
  num_predict: 48
  max_chars: 160
  cache_size: 1024
  log_file: evals/rewrite_log.jsonl
  instructions: |-
    You rewrite a loan field officer's chat message (English, Hindi, Hinglish, typos, indirect wording) into ONE short,
    standard English question about loans, KYC, documents, eligibility, the loan stages or the loan app.
    Rules: keep every number, amount, percentage and duration exactly as the officer said it; never add a number, a
    name, an id or a fact; never answer the question; keep the meaning; if the message asks two things, keep both,
    joined with "and"; if a previous question is given, use it only to complete a short follow-up ("and for home
    loan?"); if the message is not about loans or the app, answer NONE. Reply only with JSON {"q": "..."}.
  examples:
    - ["excel se case kaise daalu", "How do I import cases from Excel?"]
    - ["case list excel mein chahiye", "How do I download the case list?"]
    - ["itr matlab kya hai bhai", "What is ITR?"]
    - ["salary mein se kaat ke jo haath mein aata hai usko kya bolte", "What is net salary?"]
    - ["top up wala loan kya hota", "What is a top-up loan?"]
    - ["review mein pada hai iska matlab", "What does in review mean?"]
    - ["cersai kya cheez hai", "What is CERSAI?"]
    - ["8 lakh ka 9 percent pe 4 saal ki kist", "What is the EMI for 8 lakh at 9% for 4 years?"]
    - ["Previous question: what is ITR. Message: aur form 16?", "What is Form 16?"]
    - ["aaj mausam kaisa hai", "NONE"]
