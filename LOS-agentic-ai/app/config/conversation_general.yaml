# THE GENERAL LAYER (owner decisions 2026-10-08) -- read by app/agents/applicant/copilot/capabilities/general.py.
# Runs BEFORE any case logic: help / ok / frustration, role and stage (from the login), definitions and full forms
# (glossary.yaml, then the knowledge base), process steps BUILT FROM the stage gates / checklists / verification
# config, the product checklist, "whose name?", unknown terms (logged for the owner). Only a real case question
# reaches "which case?". Nothing here is invented: every fact comes from config, the knowledge base or the login.

enabled: true

phrases:
  help: [what can you help with, what can you do, how can you help, what do you do, help me, kya kar sakte ho,
         kya madad kar sakte ho, tum kya kar sakte ho, aap kya kar sakte ho, क्या मदद कर सकते हो]
  ack: ["ok", "okay", "ok thanks", "thanks", "thank you", "got it", "hmm", "accha", "acha", "theek hai", "thik hai",
        "fine", "cool", "ठीक है", "धन्यवाद", "that helps", "that helped", "thanks that helps", "thanks that helped", "great thanks", "perfect thanks", "thanks a ton", "thanks for the help", "helpful thanks",
        # A BARE YES / NO WITH NOTHING ASKED (owner directive 2026-10-12: "haan" got the out-of-scope line, "nahi" got
        # "what would you like to know about nahi?"): an acknowledgement that reads nothing. With a question PENDING
        # (general._pending) the same word answers that question, as before.
        "yes", "no", "yeah", "yep", "nope", "haan", "han", "haa", "ha", "haan ji", "ji", "ji haan", "nahi", "nahin",
        "nai", "na", "nahi ji", "हाँ", "हां", "नहीं"]
  # the thank-yous among the ack words: answered as small-talk THANKS (the rest is ACKNOWLEDGEMENT)
  # the bare NO among the ack words: the turn's conversation outcome is NEGATION (evals/copilot/conversations.py h5)
  negation: ["no", "nope", "nahi", "nahin", "nai", "na", "nahi ji", "नहीं"]
  thanks: ["thanks", "thank you", "ok thanks", "thank you so much", "thanks a lot", "shukriya", "dhanyavad", "धन्यवाद",
           "that helps", "that helped", "thanks that helps", "thanks that helped", "great thanks", "perfect thanks", "thanks a ton", "thanks for the help", "helpful thanks"]
  frustrated: [why you are not answering, why are you not answering, why you not answering, not answering me,
               you are not helping, not helpful, useless bot, bekar, kuch samajh nahi aa raha, jawab nahi de raha,
               wrong answer, galat jawab, samjha nahi, you don't understand, you dont understand,
               i don't understand, i dont understand, i do not understand, i am confused, i'm confused, im confused,
               not clear to me, this makes no sense, makes no sense, i am lost, i'm lost, kuch samajh nahi]
  # "can you handle it" -- a request to act with nothing named: one question back about the open case
  delegate: [can you handle it, can you deal with it, handle it, deal with it, sort this out, sort it out,
             take care of it, take care of this, do it for me, fix it, fix this, handle this, ye sambhal lo,
             sambhal lo, tum kar do, aap kar do, dekh lo, can you check it, check it, check this, look into it,
             look into this, can you look at it, can you see it, see to it, please check, check kar lo, dekh lijiye]
  # ELIGIBILITY IS NOT THE CHAT'S (owner, 2026-10-13): any of these -> the redirect line, before any model step
  eligibility: [eligible, eligibility, eligiblity, elegible, eligable, is he qualified for the loan,
                how much loan can he get, how much can he get, max loan, maximum loan, loan limit for him,
                max amount, maximum amount, how much can be sanctioned, how much can we sanction,
                how much loan is possible, how much can we give him, how much can we give her,
                how much loan will he get, how much loan will she get, how much loan will they get,
                how much loan would he get, how much loan would she get, how much will he get,
                how much will she get, how much loan can she get, how much loan can they get,
                loan amount possible, how much can be given]
  # ...but these are CPA readiness, not the eligibility decision
  eligibility_not: [eligible to move, eligible for cpa, eligible to go, eligible for the next stage, cpa ke liye,
                    how does eligibility, how is eligibility, what is eligibility, explain eligibility,
                    eligibility kaise, eligibility kya hai]
  # ...but a HISTORY question about the case ("what CHANGED after FOS?") is its recorded history
  after_stage_not: [changed, happened, was done, did, has been, have been, were, kya hua, kya badla, badla]
  # IS A CO-APPLICANT NEEDED? -- asked outright, or as a follow-up right after a co-applicant answer (2026-10-14)
  coapp_need: [is a co-applicant required, is co-applicant required, is a co-applicant mandatory,
               is co-applicant mandatory, do we need a co-applicant, does he need a co-applicant,
               does she need a co-applicant, need a co-applicant, co-applicant compulsory, is a co applicant required,
               is co applicant mandatory, do we need a co applicant]
  coapp_need_followup: [do we need one, need one, is one needed, is one required, is it required, is it needed,
                        is it mandatory, is that required, is that needed, should we add one, should we add,
                        do we have to add, must we add]
  # "so it's ONLY <the applicant> then?" right after a no-co-applicant answer: a confirmation (2026-10-14)
  only_applicant: [only, just, sirf, bas, alone, single applicant, one applicant]
  # right after an "after <stage>" answer, these step on to the next stage ("ok and after that?")
  after_that: [after that, then what, and then, uske baad, iske baad, phir kya, fir kya, tyanantar, nantar kay]
  # ...but "what should I DO after that?" is the case's next step, never the stage order
  after_that_not: [should i, do i, i do, we do, to do, karna, karu, karein, kare, upload, collect, karaycha, karave]
  # "what comes after credit?" / "and after cpa?" -- the next stages from stage_sequence (texts.after_stage)
  after_stage: ['\b(?:after|next to|following|post)\s+(?:the\s+)?(?P<stage>fos|cpa|credit|rcu|bops|hops|disbursement)\b',
                '\b(?P<stage>fos|cpa|credit|rcu|bops|hops)\s+(?:ke|k)\s+baad\b']
  # "is X fine?" -- whether ONE document is accepted (answered from the product checklist's `accepts`)
  acceptable: [fine, ok, okay, valid, acceptable, accepted, allowed, chalega, chalta, chal jayega, will do,
               work, works, can i use, can we use, can it be used, can be used, enough, instead, in place of,
               can he give, can she give, can they give, can the customer give, de sakta, de sakte, de sakti]
  # words that LEAD a message as an acknowledgement ("ok and salary slip is done right?") -- never "is it ok?"
  ack_lead: [ok, okay, okk, hmm, so, and, alright, right, achha, accha, acha, theek hai, thik hai]
  # "instead" / "in place of" is always an acceptability question, whatever possessive it carries
  acceptable_instead: [instead, in place of, ki jagah, ke badle, ke jagah]
  # ...but "is THE / MY passport ok?" asks about an uploaded one: its status (the case logic), never acceptability
  acceptable_not_with: [uploaded, upload kiya, submitted, verify, verified, status]
  # ...and these only DIRECTLY BEFORE the document ("is THE passport ok?", "his voter id ok?"); "he only has a
  # passport, will THAT work" asks acceptability (2026-10-14)
  acceptable_not_before: [the, my, his, her, their, our, this, that, mera, meri, uska, uski, unka, unki, iska, iski]
  # "he DOESN'T HAVE a DL, what else works?" (2026-10-14 officer set): the option is ruled out -> the others
  acceptable_lacks: ["doesnt have", "doesn't have", does not have, "dont have", "don't have", do not have,
                     "hasnt got", "hasn't got", has no, "no {doc}", without, lacks, other than, apart from,
                     except, "{doc} nahi", "{doc} nhi"]
  # the document names an acceptability question may use -> the checklist's document type
  document_names:
    VOTER_ID: [voter id, voter card, voter's id, voters id, election card, epic]
    ADDRESS_PROOF: [address proof, addr proof, address proof document, address doc]
    SIGNATURE: [signature, sign, signatures]
    PASSPORT: [passport]
    DRIVING_LICENCE: [driving licence, driving license, licence, license, dl]
    AADHAAR: [aadhaar, aadhar, adhar]
    PAN: [pan, pan card]
    UTILITY_BILL: [electricity bill, utility bill, gas bill, water bill]
    RENT_AGREEMENT: [rent agreement, rental agreement, lease agreement, leave and licence agreement]
    SALARY_SLIP: [salary slip, payslip, pay slip]
    BANK_STATEMENT: [bank statement, bank stmt, bank statements]
  # "what does the salary slip say?" -- ONE document's CONTENTS (capabilities/bare_document.py): read as
  # texts.document_contents_question (the engine quotes the recorded fields), never its verification status
  document_contents: ['^\s*what\s+does\s+(?:the\s+|his\s+|her\s+|their\s+)?(?P<doc>.+?)\s+(?:say|show|contain|mention)\s*\??\s*$',
                      '^\s*what\s+is\s+(?:written|mentioned)\s+(?:in|on)\s+(?:the\s+|his\s+|her\s+)?(?P<doc>.+?)\s*\??\s*$',
                      '^\s*(?:show|give)\s+(?:me\s+)?(?:the\s+)?(?P<doc>.+?)\s+(?:contents|fields|details)\s*\??\s*$']
  # words that may LEAD a bare document name ("and the PAN?", "what about salary slip") -- capabilities/bare_document.py
  bare_document_lead: [and, the, what about, how about, about, and what about, aur, also, then, ok, okay, so]
  role: [what is my role, my role, mera role, meri role, who am i, which role, my designation]
  login_stage: [what is my stage, my stage, mera stage, which stage am i, my login stage, mera login stage]
  name: [what is name, what is the name, name kya hai, naam kya hai, whats the name, what's the name, name batao]
  product_documents: [mandatory documents, required documents, documents required, documents needed, which documents,
                      kaunse documents, documents for, document list, checklist for, kya documents chahiye,
                      documents chahiye]
  co_applicant: [co-applicant, co applicant, coapplicant, co-applicants, co applicants]
  # a document question about a CASE's state: the case logic answers it (never the product checklist)
  case_document_state: [baaki, baki, pending, missing, uploaded, upload hua, upload hue, verify hua, verified, reject,
                        rejected, atka, atke, bacha, bache, remaining, left, abhi tak]
  # a question about ONE named document is not a request for the product checklist
  one_document: [address proof, id proof, identity proof, income proof, bank statement, salary slip, signature, aadhaar,
                 aadhar, pan, passport, voter, driving licence, driving license, photo, form 16, itr, accepted as]
  # a definition / full form: "what is X", "X meaning", "X full form", "X kya hai", "X ka matlab"
  definition: ["^(?:what is|what's|whats|what does|define)\\s+(?:a |an |the )?(?P<term>[A-Za-z][A-Za-z0-9-]{1,14})(?:\\s+(?:stage|step|desk|check))?(?:\\s+mean| stand for)?\\s*\\??$",
               "^(?P<term>[A-Za-z][A-Za-z0-9-]{1,14})\\s+(?:meaning|full form|ka matlab|matlab|kya hai|kya hota hai|means)\\s*\\??$",
               # "what is the full form of LTV" / "LTV ka full form kya hai" / "FOIR ka matlab batao" (2026-10-12)
               "^(?:what(?:'s| is) )?(?:the )?(?:full form|expansion|meaning) of (?P<term>[A-Za-z][A-Za-z0-9-]{1,14})\\s*\\??$",
               "^(?P<term>[A-Za-z][A-Za-z0-9-]{1,14})\\s+(?:ka|ki|ke)\\s+(?:full form|matlab|meaning|arth)(?:\\s+(?:kya hai|kya hota hai|kya|batao|bataiye))?\\s*\\??$"]
  # "difference between A and B" with no section comparing them: each term's own definition, side by side --
  # answered only when BOTH are defined (2026-10-12; capabilities/general._difference)
  difference: ["^(?:what(?:'s| is) the )?difference between (?:the |a |an )?(?P<a>[A-Za-z][A-Za-z0-9-]{1,14})(?: stage)? and (?:the |a |an )?(?P<b>[A-Za-z][A-Za-z0-9-]{1,14})(?: stages?)?\\s*\\??$",
               "^(?P<a>[A-Za-z][A-Za-z0-9-]{1,14}) (?:aur|and|vs|versus) (?P<b>[A-Za-z][A-Za-z0-9-]{1,14}) (?:mein|me|main) (?:kya )?(?:fark|farak|difference)(?: hai| kya hai)?\\s*\\??$"]

# PROCESS ANSWERS: numbered steps whose FACTS are filled from the live config at answer time
processes:
  move_to_cpa:
    then_stage: CPA          # "and after that?" next -> the stage after CPA (phrases.after_that)
    phrases: [how to move cpa, how to move to cpa, how do i move to cpa, move to cpa process, how to send to cpa,
              cpa kaise bheje, cpa mein kaise bheje, how to move the case to cpa, steps to move to cpa,
              how to move case to cpa, move case to cpa, case cpa mein kaise bheje, case ko cpa kaise bheje]
  complete_case:
    phrases: [steps to complete the case, how to complete the case, how to complete a case, case complete kaise kare,
              steps to complete case, process to complete the case, what are the steps]
  verify_documents:
    phrases: [process to verify documents, how are documents verified, how to verify documents, verification process,
              document verification process, verify kaise hota hai, documents kaise verify hote hai]
  what_is_cpa:
    phrases: [what is cpa, cpa kya hai, cpa meaning, what does cpa mean, what is cpa stage]

# the two buttons under a question back about the open case (confusion / "can you handle it")
case_asks: ["What is pending?", "What should I do next?"]
# the options under the no-case follow-up for a bare document name
bare_document_asks: ["Show my cases", "Is {document} required?"]

# THE LOAN STAGES IN ORDER (knowledge/fos/officer_howto.md "What are the stages of a loan?"): code -> how it is said
# ---- THE ENTITY FRAME (semantics/entities.py, 2026-10-14) ----------------------------------------------------------
# Only grammar lives here: the words that NEGATE ("he doesn't have a DL", "DL nahi hai") and the status words after
# which a negation is about the STATUS ("signature not uploaded") rather than having the document. Document names,
# stages and fields come from their own configuration.
entities:
  window_words: 3
  negation_cues: [not, no, without, "doesn't have", "doesnt have", "does not have", "don't have", "dont have",
                  "do not have", "hasn't got", "hasnt got", "has no", lacks, nahi, nhi, nahin, "nahi hai", bina,
                  "ke bina", "nahi he"]
  status_words: [uploaded, upload, verified, verify, received, submitted, done, cleared, clear, approved, hua, hui,
                 kiya, mila, aaya]

stage_sequence:
  - { code: FOS, say: "FOS (details and documents collected)" }
  - { code: CPA, say: "CPA (the file is checked for completeness)" }
  - { code: CREDIT, say: "Credit (the credit decision)" }
  - { code: RCU, say: "RCU (risk check)" }
  - { code: BOPS, say: "BOPS" }
  - { code: HOPS, say: "HOPS" }
  - { code: DISBURSEMENT, say: "Disbursement (the money is released)" }

texts:
  # a co-applicant asked about on a case that has none (fos_api, meaning party CO_APPLICANT)
  no_co_applicant:
    en: "There is no co-applicant on {case_id}, so nothing is pending for one."
    hi-Latn: "{case_id} par koi co-applicant nahi hai, isliye uska kuch pending nahi hai."
    hi: "{case_id} पर कोई co-applicant नहीं है, इसलिए उसका कुछ pending नहीं है।"
    mr: "{case_id} वर कोणताही co-applicant नाही, त्यामुळे त्याचे काहीही pending नाही."
  help:
    en: "I can help with your cases, documents, KYC and moving a case to CPA, and answer questions about the process."
    hi-Latn: "Main aapke cases, documents, KYC aur case ko CPA bhejne mein madad kar sakta hoon, aur process ke sawalon ka jawab de sakta hoon."
    hi: "मैं आपके केस, दस्तावेज़, KYC और केस को CPA भेजने में मदद कर सकता हूँ, और प्रक्रिया के सवालों के जवाब दे सकता हूँ।"
    mr: "मी तुमच्या केस, कागदपत्रे, KYC आणि केस CPA कडे पाठवण्यात मदत करू शकतो, आणि प्रक्रियेच्या प्रश्नांची उत्तरे देऊ शकतो."
  ack:
    en: ["Okay.", "Sure."]
    hi-Latn: ["Theek hai.", "Zaroor."]
    hi: ["ठीक है।"]
    mr: ["ठीक आहे."]
  ack_next: { en: "Anything else?", hi-Latn: "Aur kuch?", hi: "और कुछ?", mr: "आणखी काही?" }
  # a THANK-YOU is answered as one ("You're welcome"), never with the plain "Okay." of an acknowledgement (2026-10-14)
  thanks_reply:
    en: ["You're welcome!", "Happy to help!"]
    hi-Latn: ["Koi baat nahi!", "Khushi hui madad karke!"]
    hi: ["कोई बात नहीं!"]
    mr: ["काही हरकत नाही!"]
  delegate_case:
    en: "Sure. What should I do on this case: show what's pending, or tell you the next step?"
    hi-Latn: "Zaroor. Is case par kya karoon: kya pending hai dikhaun, ya aage ka step bataun?"
    hi: "ज़रूर। इस केस पर क्या करूँ: क्या लंबित है दिखाऊँ, या अगला कदम बताऊँ?"
    mr: "नक्की. या केसवर काय करू: काय प्रलंबित आहे ते दाखवू, की पुढची पायरी सांगू?"
  after_stage:
    en: "After {stage} comes {next}."
    hi-Latn: "{stage} ke baad {next} aata hai."
    hi: "{stage} के बाद {next} आता है।"
    mr: "{stage} नंतर {next} येते."
  after_last_stage:
    en: "{stage} is the last stage: the loan amount is released to the customer."
    hi-Latn: "{stage} aakhri stage hai: loan ki raqam customer ko di jaati hai."
    hi: "{stage} आखिरी चरण है: लोन की राशि ग्राहक को दी जाती है।"
    mr: "{stage} हा शेवटचा टप्पा आहे: कर्जाची रक्कम ग्राहकाला दिली जाते."
  # ONLY A DOCUMENT NAME, NO CASE OPEN (capabilities/bare_document.py): one follow-up question, never a guessed case
  bare_document_no_case:
    en: "Which case do you mean for the {document}? Open a case, or ask about the {document} in general."
    hi-Latn: "{document} kis case ka? Case kholiye, ya {document} ke baare mein general sawaal poochhiye."
    hi: "{document} किस केस का? केस खोलिए, या {document} के बारे में सामान्य सवाल पूछिए।"
    mr: "{document} कोणत्या केसचे? केस उघडा, किंवा {document} बद्दल सामान्य प्रश्न विचारा."
  # ONLY A DOCUMENT NAME, A CASE OPEN: read as this question (answered by the same tools)
  bare_document_question:
    en: "What is the status of the {document}?"
  # ONE RECORDED FIELD on an open case ("what is the tenure"): asked as this -- never the glossary's definition
  field_question:
    en: "what is the recorded {field}"
  # the fields whose NAME is also a glossary / knowledge term ("tenure"): only these are re-asked as field_question
  field_question_fields: [tenure_months, interest_rate_pct, employment_type, product]
  # eligibility wording -> this question, answered by the engine's redirect line (localized)
  eligibility_question:
    en: "what is the eligibility status?"
  document_contents_question:
    en: "show the {document} details"
  # with a case open: no list of everything -- one question back about THIS case
  frustrated_case:
    en: "Sorry about that, let me help. What would you like to know about this case: what's pending, or what to do next?"
    hi-Latn: "Maaf kijiye, main madad karta hoon. Is case ke baare mein kya jaanna hai: kya pending hai, ya aage kya karna hai?"
    hi: "माफ़ कीजिए, मैं मदद करता हूँ। इस केस के बारे में क्या जानना है: क्या लंबित है, या आगे क्या करना है?"
    mr: "माफ करा, मी मदत करतो. या केसबद्दल काय जाणून घ्यायचे आहे: काय प्रलंबित आहे, की पुढे काय करायचे?"
  not_accepted:
    en: "No, {document} is not accepted for this product's documents."
    hi-Latn: "Nahi, {document} is product ke documents mein nahi chalega."
    hi: "नहीं, {document} इस प्रोडक्ट के दस्तावेज़ों में मान्य नहीं है।"
    mr: "नाही, {document} या प्रॉडक्टच्या कागदपत्रांमध्ये चालत नाही."
  coapp_only:
    en: "Not for the applicant: {document} is accepted only as a co-applicant's {slot}. For the applicant, {slot} is any one of: {options}."
    hi-Latn: "Applicant ke liye nahi: {document} sirf co-applicant ke {slot} ke roop mein chalta hai. Applicant ke liye {slot}: {options} mein se koi ek."
    hi: "आवेदक के लिए नहीं: {document} केवल सह-आवेदक के {slot} के रूप में मान्य है। आवेदक के लिए {slot}: {options} में से कोई एक।"
    mr: "अर्जदारासाठी नाही: {document} फक्त सह-अर्जदाराच्या {slot} म्हणून चालते. अर्जदारासाठी {slot}: {options} पैकी कोणतेही एक."
  accepted_other:
    en: "Without {document}, {slot} can be any one of: {options}."
    hi-Latn: "{document} ke bina, {slot} inmein se koi ek ho sakta hai: {options}."
  accepted_short:
    en: "Yes, {document} is accepted as {slot}."
    hi-Latn: "Haan, {document} {slot} ke roop mein chalega."
    hi: "हाँ, {document} {slot} के रूप में मान्य है।"
    mr: "हो, {document} {slot} म्हणून चालेल."
  accepted:
    en: "Yes, {document} is accepted as {slot} (any one of: {options})."
    hi-Latn: "Haan, {document} {slot} ke roop mein chalega (inmein se koi ek: {options})."
    hi: "हाँ, {document} {slot} के रूप में मान्य है (इनमें से कोई एक: {options})।"
    mr: "हो, {document} {slot} म्हणून चालेल (यापैकी कोणतेही एक: {options})."
  frustrated:
    en: "Sorry about that. Here is what I can do for you right now:"
    hi-Latn: "Maaf kijiye. Abhi main yeh kar sakta hoon:"
    hi: "माफ़ कीजिए। अभी मैं यह कर सकता हूँ:"
