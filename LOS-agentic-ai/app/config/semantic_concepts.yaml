# ============================================================================
# SEMANTIC CONCEPTS -- the vocabulary of MEANING the Copilot understands.
#
# WHAT THIS IS. Concept CLASSES, each a set of words and short phrases that
# carry one meaning, in English, Hinglish, Hindi and Marathi. The semantic
# frame parser (app/agents/applicant/semantic_frame.py) reads a question as
# a bag of concepts and composes a frame -- task, object, qualifiers,
# referents -- from them. It never matches a whole sentence.
#
# WHAT THIS IS NOT. Not a list of questions, not answers, not routes. Adding
# a word here teaches the Copilot a way of SAYING something it already
# understands; it can never add a task, a tool or a fact. Every task and
# object the parser can produce is a closed enum in code, and every route
# from a frame to a tool is the same deterministic PLANS table as before.
#
# Most non-English words are ALSO canonicalised by languages.yaml before the
# parser runs ("kaunse" -> "which", "दस्तावेज़" -> "documents"); the native
# forms listed here are a safety net for words that lexicon does not carry.
# ============================================================================

