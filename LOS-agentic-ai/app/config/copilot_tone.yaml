# THE TONE OF A MESSAGE (2026-11-06, owner: "koi bhi gaali dene pe ... dont hardcode anything"). LEARNED, not matched:
# semantics/tone.py embeds the message (nomic-embed-text) + hashed word / char n-grams and a softmax classifier trained
# on the EXAMPLES below (scripts/train_answer_act.py --model tone -> models/tone.npz). Measured on the frozen held-out
# set evals/copilot/tone_heldout.yaml. abuse_lexicon.yaml stays for MASKING a word in what is shown; whether a message
# is abusive is this model's reading (or a lexicon hit).
#
#   ABUSIVE     an insult, slur or swearing at the assistant or a person -> the boundary reply, nothing answered
#   FRUSTRATED  annoyed / impatient / a mild exclamation -- not an insult -> answered as usual
#   NORMAL      everything else, friendly fillers ("bhai", "yaar", "boss") included
model:
  path: models/tone.npz
  # ABUSIVE blocks a turn, so it must be SURE: below this probability the message is answered as usual. 0.85 (was
  # 0.75): live, short Hinglish requests ("ek ... hai") read ABUSIVE at 0.70-0.78; real insults read 0.90+
  min_confidence: 0.85
  # without the embedding model only the n-gram half reads the message (held-out 72% vs 92% with both): it must be far
  # surer before a turn is refused ("Ye sambhal lo." -- a request to handle it -- read ABUSIVE at 0.78 on n-grams)
  min_confidence_ngram: 0.9
  hash_dims: 4096

acts:
  ABUSIVE:
    meaning: "an insult, slur or swearing aimed at the assistant or a person"
    examples:
      - "you idiot"
      - "abe chup"
      - "tu bewakoof hai"
      - "nikal yahan se"
      - "saale kaam kar"
