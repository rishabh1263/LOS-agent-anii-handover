      - "pagal bot"
      - "you are a moron"
      - "abe saale jawab de"
      - "dimag kharab hai tera"
      - "tere jaisa bekaar bot nahi dekha"
      - "stupid machine"
      - "screw you"
      - "get lost"
      - "bhaad me ja"
      - "ullu ke patthe"
      - "tu kisi kaam ka nahi saale"
      - "chal hatt"
      - "abe o pagal"
      - "kamine bot"
      - "you dumb thing"
