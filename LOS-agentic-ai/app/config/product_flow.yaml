                 hi: "कोई पहचाना हुआ कॉलम हेडर नहीं मिला (जैसे: Applicant name, Mobile, Product)।",
                 mr: "ओळखीचे कॉलम हेडर सापडले नाहीत (उदा. Applicant name, Mobile, Product)." }
    abuse: { en: "contains words that are not allowed", hi-Latn: "ismein aise shabd hain jo allowed nahi",
