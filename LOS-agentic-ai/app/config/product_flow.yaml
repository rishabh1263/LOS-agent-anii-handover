    mobile: [mobile, mobile number, phone]
    email: [email, email id]
    date_of_birth: [date of birth, dob, date_of_birth]
    address: [address]
    product: [product]
    loan_amount: [loan amount, amount, loan_amount]
    employment_type: [employment type, employment]
    tenure_months: [tenure, tenure months, tenure_months]
    interest_rate_pct: [interest rate, rate, interest_rate_pct]
    declared_monthly_income: [monthly income, income]
