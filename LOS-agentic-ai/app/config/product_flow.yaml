# ---- no case open, a CASE question ("Application status", "kya pending hai") -------------------------------------
# Never a dead end: ask which case (the officer's recent cases as Open links) and, once one is picked, answer the
# ORIGINAL question for it. A message with any of these words is a case question (never "I don't know that yet").
which_case:
  case_words: [status, pending, document, documents, doc, docs, kyc, pan, aadhaar, aadhar, loan, amount, cpa, stage,
               ready, readiness, upload, uploaded, applicant, co-applicant, coapplicant, query, queries, verify,
               verified, verification, emi, income, salary, bank, statement, address, proof, missing, baaki, baki,
               atka, atki, stuck, details, detail, summary, form, checklist, next, history, timeline, application,
               case, cases, customer, mobile, dob, signature, rejected, reupload, handoff, eligibility,
               केस, स्थिति, दस्तावेज़, लोन, कागदपत्र]
  ask:
    en: "Which case is this about? Pick one and I'll answer \"{question}\" for it."
    hi-Latn: "Yeh kis case ke baare mein hai? Ek case chuniye, main uske liye \"{question}\" ka jawab dunga."
    hi: "यह किस केस के बारे में है? एक केस चुनें, मैं उसके लिए \"{question}\" का जवाब दूँगा।"
    mr: "हे कोणत्या केसबद्दल आहे? एक केस निवडा, मी तिच्यासाठी \"{question}\" चे उत्तर देईन."

# ---- THE CASE BRIEF on open (FINAL FIX A1 / A4) -- read by answering/case_brief.py ------------------------------
# Three lines: the case (id, name, stage) / the main status or blocker WITH its reason / "Next step:". Built from
# the readiness report only. "All checks have passed" ONLY when no item of ANY group (counted or advisory) is
# pending, not run, failed or in review.
case_brief:
  max_suggestions: 2
  # the documents KYC reads, per party: when these are pending, KYC "has not run BECAUSE they are not uploaded"
  kyc_documents: [PAN, AADHAAR, AADHAR, PASSPORT, VOTER_ID, DRIVING_LICENCE, ADDRESS_PROOF]
  texts:
    head: { en: "**{case_id}** · {name} · {stage}", hi-Latn: "**{case_id}** · {name} · {stage}",
            hi: "**{case_id}** · {name} · {stage}", mr: "**{case_id}** · {name} · {stage}" }
    docs_and_kyc:
      en: "{docs} {are} not uploaded, so {who}'s KYC hasn't run yet."
      hi-Latn: "{docs} upload nahi hue, isliye {who} ka KYC abhi nahi chala."
      hi: "{docs} अपलोड नहीं हुए, इसलिए {who} का KYC अभी नहीं चला।"
      mr: "{docs} अपलोड झाले नाहीत, म्हणून {who} चे KYC अजून चालले नाही."
    docs_pending:
      en: "Pending: {docs}."
      hi-Latn: "Baaki: {docs}."
      hi: "बाकी: {docs}।"
      mr: "बाकी: {docs}."
    kyc_not_run:
      en: "{who}'s KYC hasn't run yet."
      hi-Latn: "{who} ka KYC abhi nahi chala."
      hi: "{who} का KYC अभी नहीं चला।"
      mr: "{who} चे KYC अजून चालले नाही."
    failed:
      en: "{what} did not pass: {reason}."
      hi-Latn: "{what} pass nahi hua: {reason}."
      hi: "{what} पास नहीं हुआ: {reason}।"
      mr: "{what} पास झाले नाही: {reason}."
    in_review:
      en: "{what} is in review."
      hi-Latn: "{what} review mein hai."
      hi: "{what} समीक्षा में है।"
      mr: "{what} पुनरावलोकनात आहे."
    gate_blocked:
      en: "Not ready yet: {what}."
      hi-Latn: "Abhi ready nahi: {what}."
      hi: "अभी तैयार नहीं: {what}।"
      mr: "अजून तयार नाही: {what}."
    all_clear:
      en: "All {stage} checks have passed."
      hi-Latn: "Saare {stage} checks pass ho gaye."
      hi: "सभी {stage} जाँचें पास हो गईं।"
      mr: "सर्व {stage} तपासण्या पास झाल्या."
    next_step: { en: "Next step: {step}", hi-Latn: "Next step: {step}", hi: "अगला कदम: {step}", mr: "पुढचे पाऊल: {step}" }
    next_ready: { en: "Move it to {next} when you're ready.", hi-Latn: "Taiyar hone par ise {next} mein bhejiye.",
                  hi: "तैयार होने पर इसे {next} में भेजें।", mr: "तयार झाल्यावर ती {next} कडे पाठवा." }
    are: { en: "are", hi-Latn: "", hi: "", mr: "" }
    is: { en: "is", hi-Latn: "", hi: "", mr: "" }
    and: { en: "and", hi-Latn: "aur", hi: "और", mr: "आणि" }
  # suggestion questions by state (ask: links; the first 2 that apply)
  suggestions:
    problems: { en: ["What is pending?", "What is the KYC status?"], hi-Latn: ["Kya baaki hai?", "KYC status kya hai?"],
                hi: ["क्या बाकी है?", "KYC की स्थिति क्या है?"], mr: ["काय बाकी आहे?", "KYC स्थिती काय आहे?"] }
    ready: { en: ["Is it ready for CPA?"], hi-Latn: ["Kya CPA ke liye ready hai?"], hi: ["क्या CPA के लिए तैयार है?"],
             mr: ["CPA साठी तयार आहे का?"] }

# ---- links per reply (FINAL FIX A4): less is more --------------------------------------------------------------
link_policy:
  max_items: 3                 # extra link items per reply; a "Download: Excel · Doc · PDF" line counts as ONE
  # downloads / Show in UI / workflow offers only on these answers (a portfolio or a case summary) or when asked
  case_links_on: [CASE_LIST, FULL_SUMMARY, CASE_360, CASE_SUMMARY, DOWNLOADS, CASE_CREATED]
  never_show: [switch_case]                # understood from text ("dusra case"), never a button
  # shown on EVERY reply while a case is open, outside the budget and never dropped as a repeat -- "Close" is always
  # there the way "Open" is on a list row (owner 2026-10-08)
  always_on_case: [exit_case]
  # ... but not on these replies (the case was just closed / a list is shown)
  always_on_case_not_on: [CASE_LIST, CASE_EXITED, EXIT_CASE, WORKSPACE_EXIT, CASE_CLOSED]
  no_repeat: true              # a link shown in the previous reply of the chat is not shown again
  download_label: { en: "Download:", hi-Latn: "Download:", hi: "डाउनलोड:", mr: "डाउनलोड:" }

# ---- the frontend's routes for the UI actions (FINAL FIX D): POST /api/v1/fos/action answers show_in_ui /
# show_list_in_ui / new_case with {"type": "open_ui", "route": ...} built from these
ui_routes:
  case: "/cases/{case_id}"
  list: "/cases?{query}"
  new_case: "/cases/new"