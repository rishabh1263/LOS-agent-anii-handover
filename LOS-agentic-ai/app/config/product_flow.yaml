      hi-Latn: "{total} mein se {ok} rows sahi hain. {bad} row(s) mein galti hai."
      hi: "{total} में से {ok} पंक्तियाँ सही हैं। {bad} पंक्ति(यों) में गलती है।"
      mr: "{total} पैकी {ok} ओळी बरोबर आहेत. {bad} ओळींमध्ये चूक आहे."
