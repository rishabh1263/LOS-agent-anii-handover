# ---- no case open: a named person, or a question outside the product (MASTER SPEC 2 / 5) ------------------------
# "Zoravar Khanna ka case" / "Priya's case" / "cases of Anil": looked up among the caller's OWN cases only -- found
# opens it, else the same neutral line as an unknown id (never confirming the person exists elsewhere).
name_lookup:
  patterns:
    - "^(?P<name>[A-Za-zऀ-ॿ]+(?: [A-Za-zऀ-ॿ]+){0,2}) (?:ka|ke|ki|wala|wale|wali) cases?\\b"
    - "\\b(?P<name>[A-Za-z]+(?: [A-Za-z]+)?)'s cases?\\b"
    - "\\bcases? (?:of|for) (?P<name>[A-Za-z]+(?: [A-Za-z]+)?)\\s*$"
  not_names: [mera, mere, meri, my, mine, is, iss, us, uss, iska, uska, kis, kiska, kiske, kaun, kaunsa, konsa,
              dusra, dusre, doosra, pehla, pehle, agla, agle, last, new, naya, naye, sab, saare, sare, all, this,
              that, the, a, an, kyc, pending, done, review, created, disbursal, ready, top, oldest, latest, other,
              officer, officers, applicant, customer, every, any, same, previous, next, kal, aaj, abhi, open,
              pan, aadhaar, aadhar, address, proof, bank, statement, salary, slip, document, documents, loan, cpa,
              status, stage, home, personal, co, coapplicant, form, file, query]
# a question clearly outside the product (any of these words): one polite line and the next option. Positive cues
# only -- a short Hinglish case question ("kya baaki hai?") is never treated as off-topic.
out_of_scope:
  off_topic_words: [ipl, cricket, match, score, football, weather, mausam, movie, film, song, gaana, joke, chutkula,
                    news, khabar, politics, election, prime minister, recipe, horoscope, rashifal, bitcoin, share price,
                    stock market, lottery, girlfriend, boyfriend, game, games, क्रिकेट, मौसम, फ़िल्म, चुटकुला]
  text:
    en: ["I can only help with your cases, documents, KYC and moving to CPA.",
         "That's outside what I can help with. I can help with your cases, documents, KYC and CPA."]
    hi-Latn: ["Main sirf aapke cases, documents, KYC aur CPA mein madad kar sakta hoon.",
              "Yeh mere daayre se bahar hai. Main cases, documents, KYC aur CPA mein madad kar sakta hoon."]
    hi: ["मैं सिर्फ़ आपके केस, दस्तावेज़, KYC और CPA में मदद कर सकता हूँ।"]
    mr: ["मी फक्त तुमच्या केस, कागदपत्रे, KYC आणि CPA मध्ये मदत करू शकतो."]
  next: { en: "My cases", hi-Latn: "Mere cases", hi: "मेरे केस", mr: "माझ्या केस" }
# a request to approve / reject / disburse / bypass a check: said plainly before anything else (golden rule 4).
# (Moving FOS -> CPA is NOT here: with a case open it is the workflow's proposal + Confirm, `stage_flow` below.)
stage_move:
  phrases: [stage badal, stage change, change the stage, change stage, approve the loan, approve kar, approve karo,
            disburse, reject this, reject kar, mark verified, kyc pass kar, kyc bypass, skip kyc, bypass kyc,
            stage update, update the stage]
  text:
    en: "I can't approve, reject, disburse or skip a check from chat, a person does that. Here is where it stands:"
    hi-Latn: "Main chat se approve, reject, disburse ya koi check skip nahi kar sakta, yeh ek vyakti karta hai. Abhi ki sthiti:"
    hi: "मैं चैट से मंज़ूरी, अस्वीकृति, वितरण या कोई जाँच छोड़ना नहीं कर सकता, यह एक व्यक्ति करता है। अभी की स्थिति:"
    mr: "मी चॅटमधून मंजुरी, नकार, वितरण किंवा तपासणी वगळणे करू शकत नाही, हे एक व्यक्ती करते. सध्याची स्थिती:"

# ---- THE FOS <-> CPA WORKFLOW (owner, 2026-10-08) -- read by capabilities/stage_flow.py --------------------------
# At FOS, anything wrong (KYC mismatch, rejected / missing document) -> a query to the CUSTOMER (one query listing
# every problem, shown as a message to send). All clear -> FOS moves the case to CPA. At CPA, CPA raises a query to
# FOS; FOS replies (or raises one to CPA). EVERY step is a proposal + Confirm; the gate is re-checked at the move;
# query routes are app/config/queries.yaml `routes`.
stage_flow:
  enabled: true
  # chat moves the officer may confirm (from -> to); anything else stays with the operator route
  chat_moves: { FOS: [CPA] }
  # holding ANY of these scopes allows a confirmed move from chat (owner decision: the FOS officer moves FOS -> CPA)
  move_scopes: [los.stage:write, los.write, create_application]
  phrases:
    customer_query: [collect from customer, customer se lena hai, customer se kya lena hai, kya collect karna hai,
                     customer se lo, what to collect, send query to customer, query to customer, customer ko query, customer ko query bhejo,
                     customer ko bolo, customer ko message, raise query, query raise karo, query bhejo,
                     ग्राहक को क्वेरी, ग्राहकाला क्वेरी]
    move: [move to cpa, send to cpa, cpa ko bhejo, cpa ko bhej do, cpa mein bhejo, cpa mein bhej do, cpa me bhejo,
           cpa mein move, cpa me move, move kar do, submit to cpa, aage bhejo, सीपीए को भेजो]
    query_to_stage: [query to fos, fos ko query, fos ko bolo, raise query to fos, query to cpa, cpa ko query,
                     cpa ko bolo, raise query to cpa]
    reply_query: [reply to, reply karo, jawab do, answer query, respond to]
    resolve_query: [resolve query, query resolve, query band karo, close query, resolve karo]
    # a query in the OFFICER'S words ("raise a query: address mismatch with Aadhaar") -> draft -> Confirm
    free_query: [raise a query, raise query, raise new query, new query, create a query, create query, add a query,
                 query raise karo, query raise kar do, query raise karna hai, ek query raise karo, query daalo,
                 query dalo, query bana do, query banao, customer se query bhejo, customer se query, customer se puchho,
                 customer se pucho, query bhejo, query bhej do, क्वेरी भेजो, क्वेरी बनाओ]
    # every query on the open case, with its status
    query_status: [query ka status, query status, queries ka status, status of my query, status of the query,
                   status of query, my queries, queries dikhao, query dikhao, show queries, open queries, list queries,
                   query kahan tak, query ka kya hua, queries kya hai, क्वेरी का स्टेटस]
  # the free-text query (owner 2026-10-08): to whom, which type the words point at
  free_query:
    target_type: CUSTOMER
    min_words: 2
    default_type: CLARIFICATION
    types:
      DOCUMENT_DISCREPANCY: [mismatch, does not match, doesn't match, match nahi, alag, different, wrong, galat]
      MISSING_INFORMATION: [missing, not provided, nahi diya, nahi hai, required, chahiye, pending]
      ADDITIONAL_EVIDENCE: [more proof, additional, extra document, aur document, another document]
      EXPLANATION_REQUIRED: [explain, why, kyu, reason, wajah]
  # at FOS the customer is not sent a query: the officer is told what to collect (owner 2026-10-08); "query" = the
  # old recorded customer query
  fos_customer_mode: collect
  texts:
    collect_heading:
      en: "Collect from the customer for {case_id}:"
      hi-Latn: "{case_id} ke liye customer se yeh lena hai:"
      hi: "{case_id} के लिए ग्राहक से यह लेना है:"
      mr: "{case_id} साठी ग्राहकाकडून हे घ्यायचे आहे:"
    free_draft:
      en: "Draft query on {case_id} (to: {target}, type: {query_type}). Confirm to raise it:"
      hi-Latn: "{case_id} par query ka draft (kisko: {target}, type: {query_type}). Raise karne ke liye Confirm kijiye:"
      hi: "{case_id} पर क्वेरी का ड्राफ़्ट (किसे: {target}, प्रकार: {query_type})। भेजने के लिए Confirm करें:"
      mr: "{case_id} वर क्वेरीचा मसुदा (कोणाला: {target}, प्रकार: {query_type}). पाठवण्यासाठी Confirm करा:"
    free_sent:
      en: "Query {query_id} raised ({status})."
      hi-Latn: "Query {query_id} raise ho gayi ({status})."
      hi: "क्वेरी {query_id} भेज दी गई ({status})।"
      mr: "क्वेरी {query_id} पाठवली ({status})."
    free_exists:
      en: "This query is already open as {query_id} ({status}); nothing new was raised."
      hi-Latn: "Yeh query pehle se {query_id} ke roop mein khuli hai ({status}); nayi query nahi bani."
      hi: "यह क्वेरी पहले से {query_id} के रूप में खुली है ({status}); नई क्वेरी नहीं बनी।"
      mr: "ही क्वेरी आधीच {query_id} म्हणून उघडी आहे ({status}); नवीन क्वेरी तयार झाली नाही."
