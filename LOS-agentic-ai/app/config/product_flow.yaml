      hi-Latn: "Sahi rows se {ok} case banayein? Confirm karne tak kuch save nahi hoga."
      hi: "सही पंक्तियों से {ok} केस बनाएँ? पुष्टि तक कुछ सेव नहीं होगा।"
      mr: "बरोबर ओळींमधून {ok} केस तयार करायच्या? पुष्टी करेपर्यंत काहीही सेव्ह होणार नाही."
    done: { en: "{n} case(s) created.", hi-Latn: "{n} case ban gaye.", hi: "{n} केस बन गए।", mr: "{n} केस तयार झाल्या." }
    unreadable: { en: "This file could not be read as an Excel sheet (.xlsx).",
                  hi-Latn: "Yeh file Excel sheet (.xlsx) ki tarah padhi nahi ja saki.",
