                  mr: "ही फाईल Excel शीट (.xlsx) म्हणून वाचता आली नाही." }
    too_many: { en: "The sheet has more than {max} rows. Please split it.",
                hi-Latn: "Sheet mein {max} se zyada rows hain. Kripya baant dijiye.",
                hi: "शीट में {max} से ज़्यादा पंक्तियाँ हैं। कृपया बाँट दें।",
                mr: "शीटमध्ये {max} पेक्षा जास्त ओळी आहेत. कृपया विभागून द्या." }
    no_header: { en: "No known column headers were found (for example: Applicant name, Mobile, Product).",
