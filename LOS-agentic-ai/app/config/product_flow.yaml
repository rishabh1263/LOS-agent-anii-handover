# THE APPROVED PRODUCT FLOW (MASTER SPEC section 15 / 15.5) -- one file for the officer-facing words, mappings and
# limits of: the case statuses (Created / Review / Disbursal -> Pending / Done), the home table, the chat follow-up
# ("Do you want to know about a particular case?"), the quick buttons, downloads, case creation / editing from
# chat, Excel import, chat history, the activity log and notifications.
#
# Read by app/agents/applicant/copilot/capabilities/product_flow.py (and exports.py, case_form.py, importer.py).
# Scope, confirmation before every write, and the reply contract are CODE and never configurable (section 14).
# Every text: en, hi-Latn, hi, mr. A list = variants (picked per turn).

# ---- statuses (15.5) -------------------------------------------------------------------------------------------
# The real data has stages (app/config/stage_lifecycle.yaml). Each stage maps to ONE business status; each
# status belongs to ONE group. The home table, chat lists, filters, counts and the Pending/Done follow-up all
# use this mapping. A stage not listed here maps to `default_status`.
case_status:
  by_stage:
    FOS: Created
    CPA: Review
    CREDIT: Review
    RCU: Review
    BOPS: Review
    HOPS: Review
    DISBURSEMENT: Disbursal
  default_status: Created
  groups:
    pending: [Created, Review]
    done: [Disbursal]
  labels:
    Created: { en: "Created", hi-Latn: "Created", hi: "बनाया गया", mr: "तयार केले" }
    Review: { en: "Review", hi-Latn: "Review", hi: "समीक्षा", mr: "पुनरावलोकन" }
    Disbursal: { en: "Disbursal", hi-Latn: "Disbursal", hi: "वितरण", mr: "वितरण" }
  group_labels:
    pending: { en: "Pending", hi-Latn: "Pending", hi: "लंबित", mr: "प्रलंबित" }
    done: { en: "Done", hi-Latn: "Done", hi: "पूरे", mr: "पूर्ण" }
  # chat phrases for a status / group filter (whole phrases, after the normaliser; longest first). Bare
  # "pending" / "done" count only as the answer to "Pending or Done?" (portfolio_flow), never on their own.
  phrases:
    group:
      pending: [my pending cases, pending cases, pending case, pending wale cases, pending wale, pending wala,
                baaki cases, baaki wale cases, lambit cases, लंबित केस, प्रलंबित केस]
      done: [done cases, done case, done wale cases, done wale, completed cases, complete cases, pure hue cases,
             ho gaye cases, पूरे केस, पूर्ण केस]
    status:
      Created: [created cases, created wale, naye bane cases, new created cases]
      Review: [review cases, review wale, review wale cases, review mein, review me]
      Disbursal: [disbursal cases, disbursal wale, disbursal wale cases, disbursed cases, disburse wale]

# ---- the home table (15.1 step 2): served by GET /api/v1/fos/cases --------------------------------------------
home_table:
  columns:
    - { key: case_id, label: { en: "Case ID", hi-Latn: "Case ID", hi: "केस आईडी", mr: "केस आयडी" } }
    - { key: app_id, label: { en: "App ID", hi-Latn: "App ID", hi: "ऐप आईडी", mr: "ॲप आयडी" } }
    - { key: applicant_name, label: { en: "Applicant name", hi-Latn: "Applicant ka naam", hi: "आवेदक का नाम",
                                      mr: "अर्जदाराचे नाव" } }
    - { key: stage, label: { en: "Stage", hi-Latn: "Stage", hi: "चरण", mr: "टप्पा" } }
    - { key: status, label: { en: "Status", hi-Latn: "Status", hi: "स्थिति", mr: "स्थिती" } }
    - { key: created_date, label: { en: "Created date", hi-Latn: "Bani tareekh", hi: "बनने की तारीख",
                                    mr: "तयार झाल्याची तारीख" } }
    - { key: action, label: { en: "Action", hi-Latn: "Action", hi: "कार्रवाई", mr: "कृती" } }
  action_label: { en: "Open", hi-Latn: "Kholo", hi: "खोलें", mr: "उघडा" }
  new_case_label: { en: "Create New Case", hi-Latn: "Create New Case", hi: "Create New Case", mr: "Create New Case" }
  empty: { en: "No cases yet.", hi-Latn: "Abhi koi case nahi hai.", hi: "अभी कोई केस नहीं है।",
           mr: "अजून कोणतीही केस नाही." }
  no_match: { en: "No cases match your search.", hi-Latn: "Aapki search se koi case match nahi hua.",
              hi: "आपकी खोज से कोई केस नहीं मिला।", mr: "तुमच्या शोधाशी कोणतीही केस जुळली नाही." }
  loading: { en: "Loading your cases...", hi-Latn: "Aapke cases load ho rahe hain...", hi: "आपके केस लोड हो रहे हैं...",
             mr: "तुमच्या केस लोड होत आहेत..." }
  error: { en: "We couldn't load your cases. Please try again.", hi-Latn: "Cases load nahi ho paye. Dobara try karein.",
           hi: "केस लोड नहीं हो पाए। कृपया फिर से कोशिश करें।", mr: "केस लोड झाल्या नाहीत. कृपया पुन्हा प्रयत्न करा." }
  # table sort keys -> case_list.yaml sorts
  sorts: { created_date: oldest, created_date_desc: recent, updated: recent, needs_action: needs_action }

# ---- the chat follow-up after a case-portfolio answer (15.2 step 4) --------------------------------------------
portfolio_flow:
  enabled: true
  # quoted: bare yes / no / y / n / ok are booleans in YAML
  yes_words: ["yes", "y", "haan", "ha", "han", "haa", "ji", "ji haan", "yes please", "sure", "ok", "okay", "theek hai",
              "bilkul", "हाँ", "हां", "हो", "होय"]
  no_words: ["no", "n", "nahi", "nahin", "na", "nope", "no thanks", "rehne do", "नहीं", "नाही", "नको"]
  pending_words: [pending, pending wale, pending cases, baaki, lambit, लंबित, प्रलंबित]
  done_words: [done, done wale, done cases, complete, completed, pure, ho gaye, पूरे, पूर्ण]
  texts:
    ask_particular:
      en: ["Do you want to know about a particular case?", "Would you like details of a particular case?"]
      hi-Latn: ["Kya aap kisi particular case ke baare mein jaanna chahte hain?",
                "Kisi ek case ki details chahiye?"]
      hi: ["क्या आप किसी खास केस के बारे में जानना चाहते हैं?"]
      mr: ["तुम्हाला एखाद्या विशिष्ट केसबद्दल जाणून घ्यायचे आहे का?"]
    yes_label: { en: "Yes", hi-Latn: "Haan", hi: "हाँ", mr: "हो" }
    no_label: { en: "No", hi-Latn: "Nahi", hi: "नहीं", mr: "नाही" }
    ask_group:
      en: ["Pending or Done?", "Which ones. Pending or Done?"]
      hi-Latn: ["Pending ya Done?", "Kaunse. Pending ya Done?"]
      hi: ["लंबित या पूरे?"]
      mr: ["प्रलंबित की पूर्ण?"]
    no_reply:
      en: ["Okay. Ask me anything about your cases.", "Sure. What else can I help with?"]
      hi-Latn: ["Theek hai. Apne cases ke baare mein kuch bhi poochhiye.", "Theek hai. Aur kya madad karoon?"]
      hi: ["ठीक है। अपने केस के बारे में कुछ भी पूछिए।"]
      mr: ["ठीक आहे. तुमच्या केसबद्दल काहीही विचारा."]
    pick:
      en: "Pick a case from the list (tap Open, or type its number)."
      hi-Latn: "List mein se ek case chuniye (Open dabaiye, ya number likhiye)."
      hi: "सूची में से एक केस चुनें (Open दबाएँ या नंबर लिखें)।"
      mr: "यादीतून एक केस निवडा (Open दाबा किंवा क्रमांक लिहा)."
    what_to_know:
      en: ["What do you want to know?", "What would you like to know about this case?"]
      hi-Latn: ["Aap kya jaanna chahte hain?", "Is case ke baare mein kya jaanna hai?"]
      hi: ["आप क्या जानना चाहते हैं?"]
      mr: ["तुम्हाला काय जाणून घ्यायचे आहे?"]
  # the options after a case opens from the flow (label = the question sent)
  what_options:
    en: ["What is the status?", "What is pending?", "Show the documents", "What is the KYC status?",
         "Is it ready for CPA?"]
    hi-Latn: ["Status kya hai?", "Kya pending hai?", "Documents dikhao", "KYC status kya hai?",
              "Kya CPA ke liye ready hai?"]
    hi: ["स्थिति क्या है?", "क्या बाकी है?", "दस्तावेज़ दिखाओ", "KYC की स्थिति क्या है?", "क्या CPA के लिए तैयार है?"]
    mr: ["स्थिती काय आहे?", "काय बाकी आहे?", "कागदपत्रे दाखवा", "KYC स्थिती काय आहे?", "CPA साठी तयार आहे का?"]

# ---- quick buttons, always available (15.2 step 5): GET /api/v1/fos/quick-actions -------------------------------
quick_buttons:
  - id: my_pending_cases
    label: { en: "My pending cases", hi-Latn: "Mere pending cases", hi: "मेरे लंबित केस", mr: "माझ्या प्रलंबित केस" }
    send: { en: "My pending cases", hi-Latn: "My pending cases", hi: "My pending cases", mr: "My pending cases" }
  - id: create_new_case
    label: { en: "Create New Case", hi-Latn: "Create New Case", hi: "Create New Case", mr: "Create New Case" }
    send: { en: "Create new case", hi-Latn: "Create new case", hi: "Create new case", mr: "Create new case" }
  - id: how_to_upload
    label: { en: "How to upload", hi-Latn: "Upload kaise karein", hi: "अपलोड कैसे करें", mr: "अपलोड कसे करावे" }
    send: { en: "How do I upload a document?", hi-Latn: "Document upload kaise karein?",
            hi: "दस्तावेज़ कैसे अपलोड करें?", mr: "कागदपत्र कसे अपलोड करावे?" }
  - id: faq
    label: { en: "FAQ", hi-Latn: "FAQ", hi: "FAQ", mr: "FAQ" }
    send: { en: "FAQ", hi-Latn: "FAQ", hi: "FAQ", mr: "FAQ" }

# ---- links on every case answer (15.2 steps 3 and 6) -------------------------------------------------------------
case_links:
  downloads: [xlsx, docx, pdf]       # the order of the Download buttons
  on_lists: true                     # a list answer offers the filtered list as downloads too
  # a typed download request ("excel download karo", "pdf chahiye"): the links for the open case, else for the list
  ask_words: [download, export, excel, pdf, doc file, word file, xlsx, docx, डाउनलोड, एक्सेल]
  # a typed "show in UI": the Show in UI action for the open case (else the list)
  show_words: [show in ui, open in ui, ui mein dikhao, ui me dikhao, ui par dikhao, screen par dikhao,
               main screen, show on screen, ui mein kholo, यूआई में दिखाओ]
  show_here:
    case: { en: "Open {case_id} on the main screen:", hi-Latn: "{case_id} main screen par kholiye:",
            hi: "{case_id} मुख्य स्क्रीन पर खोलें:", mr: "{case_id} मुख्य स्क्रीनवर उघडा:" }
    list: { en: "Open your cases on the main screen:", hi-Latn: "Apne cases main screen par kholiye:",
            hi: "अपने केस मुख्य स्क्रीन पर खोलें:", mr: "तुमच्या केस मुख्य स्क्रीनवर उघडा:" }
  here:
    case: { en: "Downloads for {case_id}:", hi-Latn: "{case_id} ke downloads:", hi: "{case_id} के डाउनलोड:",
            mr: "{case_id} चे डाउनलोड:" }
    list: { en: "Downloads for your cases:", hi-Latn: "Aapke cases ke downloads:", hi: "आपके केस के डाउनलोड:",
            mr: "तुमच्या केसचे डाउनलोड:" }

# ---- downloads (15.3 / 15.5): Excel, Doc, PDF -- single case and filtered lists ----------------------------------
exports:
  link_ttl_seconds: 300              # the signed download link is short-lived
  max_rows: 500                      # a list export never holds more rows than this
  rate_limit_per_minute: 10          # per user (section 17)
  file_name: "{kind}_{ref}_{date}"   # kind = case | cases
  title:
    case: { en: "Case summary", hi-Latn: "Case summary", hi: "केस सारांश", mr: "केस सारांश" }
    list: { en: "My cases", hi-Latn: "Mere cases", hi: "मेरे केस", mr: "माझ्या केस" }
  generated: { en: "Generated on {date} for {user}", hi-Latn: "{date} ko {user} ke liye banaya gaya",
               hi: "{date} को {user} के लिए बनाया गया", mr: "{date} रोजी {user} साठी तयार केले" }
  sections:
    applicant: { en: "Applicant", hi-Latn: "Applicant", hi: "आवेदक", mr: "अर्जदार" }
    application: { en: "Application", hi-Latn: "Application", hi: "आवेदन", mr: "अर्ज" }
    documents: { en: "Documents", hi-Latn: "Documents", hi: "दस्तावेज़", mr: "कागदपत्रे" }
    pending: { en: "Pending items", hi-Latn: "Pending items", hi: "बाकी काम", mr: "बाकी कामे" }
  document_columns: { en: ["Document", "Party", "Status"], hi-Latn: ["Document", "Party", "Status"],
                      hi: ["दस्तावेज़", "पक्ष", "स्थिति"], mr: ["कागदपत्र", "पक्ष", "स्थिती"] }
  field_columns: { en: ["Field", "Value"], hi-Latn: ["Field", "Value"], hi: ["फ़ील्ड", "मान"], mr: ["फील्ड", "मूल्य"] }
  nothing_pending: { en: "Nothing pending.", hi-Latn: "Kuch pending nahi.", hi: "कुछ बाकी नहीं।",
                     mr: "काहीही बाकी नाही." }
  rate_limited: { en: "Too many downloads in a minute. Please wait a moment and try again.",
                  hi-Latn: "Ek minute mein bahut downloads. Thoda ruk kar dobara try karein.",
                  hi: "एक मिनट में बहुत डाउनलोड। थोड़ा रुककर फिर कोशिश करें।",
                  mr: "एका मिनिटात खूप डाउनलोड. थोडा वेळ थांबून पुन्हा प्रयत्न करा." }

# ---- case creation and editing from chat (15.5): the SAME fields and rules as the UI form ------------------------
# The field list, types and max lengths come from the create-case request schema (CreateCaseRequest); the order,
# questions, required set and format rules below are shared by the UI create / edit routes and the chat.
case_form:
  chat_create: true                  # 15.5: chat case creation ON (env COPILOT_CHAT_CASE_CREATE overrides)
  draft_ttl_seconds: 1800            # an unconfirmed draft is dropped after this
  required: [full_name, mobile, date_of_birth, address, product, loan_amount]
  order: [full_name, mobile, date_of_birth, address, email, product, loan_amount, employment_type, tenure_months,
          interest_rate_pct, declared_monthly_income, declared_monthly_obligations, property_value]
  formats:
    mobile: { pattern: "^[6-9]\\d{9}$", strip: "[\\s+-]|^91(?=\\d{10}$)" }
    email: { pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
    date_of_birth: { date: true, min_age: 18, max_age: 80 }
    full_name: { pattern: "^[A-Za-z\\u0900-\\u097F .'-]{2,}$" }
    tenure_months: { integer: true, min: 1, max: 480 }
    interest_rate_pct: { number: true, min: 1, max: 60 }
    loan_amount: { number: true }
    declared_monthly_income: { number: true }
    declared_monthly_obligations: { number: true }
    property_value: { number: true }
  choices:
    employment_type: [SALARIED, SELF_EMPLOYED]
  labels:
    full_name: { en: "Applicant name", hi-Latn: "Applicant ka naam", hi: "आवेदक का नाम", mr: "अर्जदाराचे नाव" }
    mobile: { en: "Mobile", hi-Latn: "Mobile", hi: "मोबाइल", mr: "मोबाईल" }
    email: { en: "Email", hi-Latn: "Email", hi: "ईमेल", mr: "ईमेल" }
    date_of_birth: { en: "Date of birth", hi-Latn: "Janm tithi", hi: "जन्म तिथि", mr: "जन्मतारीख" }
    address: { en: "Address", hi-Latn: "Address", hi: "पता", mr: "पत्ता" }
    product: { en: "Product", hi-Latn: "Product", hi: "प्रोडक्ट", mr: "प्रॉडक्ट" }
    loan_amount: { en: "Loan amount (Rs)", hi-Latn: "Loan amount (Rs)", hi: "लोन राशि (रु)", mr: "कर्ज रक्कम (रु)" }
    employment_type: { en: "Employment type", hi-Latn: "Employment type", hi: "रोज़गार का प्रकार", mr: "रोजगार प्रकार" }
    tenure_months: { en: "Tenure (months)", hi-Latn: "Tenure (mahine)", hi: "अवधि (महीने)", mr: "मुदत (महिने)" }
    interest_rate_pct: { en: "Interest rate (%)", hi-Latn: "Interest rate (%)", hi: "ब्याज दर (%)", mr: "व्याज दर (%)" }
    declared_monthly_income: { en: "Monthly income (Rs)", hi-Latn: "Mahine ki income (Rs)", hi: "मासिक आय (रु)",
                               mr: "मासिक उत्पन्न (रु)" }
    declared_monthly_obligations: { en: "Monthly EMIs (Rs)", hi-Latn: "Mahine ki EMI (Rs)", hi: "मासिक ईएमआई (रु)",
                                    mr: "मासिक ईएमआय (रु)" }
    property_value: { en: "Property value (Rs)", hi-Latn: "Property value (Rs)", hi: "संपत्ति मूल्य (रु)",
                      mr: "मालमत्ता मूल्य (रु)" }
  ask:
    en: "Please enter the **{label}**{hint}."
    hi-Latn: "Kripya **{label}** batayein{hint}."
    hi: "कृपया **{label}** बताएँ{hint}।"
    mr: "कृपया **{label}** सांगा{hint}."
  hints:
    date_of_birth: { en: " (YYYY-MM-DD)", hi-Latn: " (YYYY-MM-DD)", hi: " (YYYY-MM-DD)", mr: " (YYYY-MM-DD)" }
    product: { en: " ({choices})", hi-Latn: " ({choices})", hi: " ({choices})", mr: " ({choices})" }
    employment_type: { en: " ({choices})", hi-Latn: " ({choices})", hi: " ({choices})", mr: " ({choices})" }
    loan_amount: { en: " (full amount in rupees, e.g. 500000)", hi-Latn: " (poori rakam rupaye mein, jaise 500000)",
                   hi: " (पूरी राशि रुपये में, जैसे 500000)", mr: " (पूर्ण रक्कम रुपयांत, उदा. 500000)" }
  optional_hint: { en: " (optional, type skip)", hi-Latn: " (optional, skip likhiye)", hi: " (वैकल्पिक, skip लिखें)",
                   mr: " (पर्यायी, skip लिहा)" }
  skip_words: [skip, chhodo, chodo, rehne do, na, none, -, छोड़ो, वगळा]
  cancel_words: [cancel, stop creating, band karo, rehne do case, cancel case, रद्द करो, रद्द करा]
  confirm_words: [confirm, yes confirm, haan confirm, confirm karo, create karo, theek hai banao, पुष्टि, खात्री]
  edit_words: [edit, badlo, change, बदलो, बदला]
  # while a field is asked, a message that is clearly a question / command PARKS the draft (it is answered as
  # usual, nothing is lost); "Create New Case" or a resume word continues where it stopped
  escape_first: [open, show, list, what, how, why, when, which, kya, kaise, kyu, kyun, kab, kaun, kaunsa, hi, hello,
                 namaste, help, top, aur, dusra, review, created, mere, my, isko, iska, sorry, ignore, manager, tell,
                 batao, dikhao, kholo, give, can, could, please, plz, क्या, कैसे, मेरे, दिखाओ]
  escape_any: [cases, case, kyc, faq, download, pdf, excel, status, pending]
  resume_words: [continue, continue case, resume, resume case, aage badho, jaari rakho, case continue karo]
  resume:
    en: "Let's continue the new case."
    hi-Latn: "Chaliye naya case aage badhate hain."
    hi: "चलिए नया केस आगे बढ़ाते हैं।"
    mr: "चला नवीन केस पुढे नेऊया."
  invalid:
    en: "That doesn't look right for **{label}**: {why}. Please enter it again."
    hi-Latn: "**{label}** sahi nahi lag raha: {why}. Kripya dobara likhiye."
    hi: "**{label}** सही नहीं लग रहा: {why}। कृपया फिर से लिखें।"
    mr: "**{label}** बरोबर वाटत नाही: {why}. कृपया पुन्हा लिहा."
  why:
    required: { en: "it is required", hi-Latn: "yeh zaroori hai", hi: "यह ज़रूरी है", mr: "हे आवश्यक आहे" }
    format: { en: "the format is not valid", hi-Latn: "format sahi nahi hai", hi: "फ़ॉर्मेट सही नहीं है",
              mr: "फॉरमॅट बरोबर नाही" }
    mobile: { en: "enter a 10-digit mobile number", hi-Latn: "10 digit ka mobile number likhiye",
              hi: "10 अंकों का मोबाइल नंबर लिखें", mr: "10 अंकी मोबाईल नंबर लिहा" }
