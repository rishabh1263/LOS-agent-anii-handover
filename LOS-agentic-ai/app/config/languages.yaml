# ============================================================================
# LANGUAGE UNDERSTANDING -- configuration for app/agents/applicant/language.py
#
# WHAT THIS IS. A question in any supported language is rewritten into the
# canonical ENGLISH words the Copilot's rules already understand, BEFORE
# classification. "मेरा आवेदन किस चरण में है?", "mera stage kya hai?" and
# "What is my stage?" all reach the same intent, the same tools and the same
# recorded answer. There is ONE set of business rules; a language adds words
# here, never code.
#
# WHAT THIS IS NOT. It is not translation, and it decides nothing. It never
# selects an intent, a stage, a status or an action -- it produces a message,
# classified by the same rules as anything typed in English. A word it does
# not know is left as it is, and a question it cannot map is answered exactly
# as an unrecognised English question would be.
#
# REVIEW STATUS -- HONEST. These lexicons are a SEED written for the core
# case vocabulary (stage, status, documents, pending, KYC, verification, next
# step, co-applicant, why/what/where/which). They have NOT been reviewed by
# native speakers. `review_status` says so per language, and the Copilot
# publishes it; extend and correct the words here, not in code.
#
# Environment: MULTILINGUAL_ENABLED=false turns the whole layer off (English
# and the existing Hinglish short forms in applicant_agent.yaml still work).
# ============================================================================

enabled: true

# Languages answered with a localized sentence where a template exists
# (below). Everything else is answered in English, and the response says so.
default_response_language: en

languages:
  en:  {name: English,   script: Latin,      review_status: NATIVE}
  hi:  {name: Hindi,     script: Devanagari, review_status: SEED_UNREVIEWED}
  hi-Latn: {name: Hindi (Romanized / Hinglish), script: Latin, review_status: SEED_UNREVIEWED}
  mr:  {name: Marathi,   script: Devanagari, review_status: SEED_UNREVIEWED}
  # Marathi typed in Latin letters ("KYC zala ka?"): understood with its own
  # words on top of the Hinglish lexicon, ANSWERED in Marathi (reply_as)
  mr-Latn: {name: Marathi (Romanized), script: Latin, review_status: SEED_UNREVIEWED, reply_as: mr}
  bn:  {name: Bengali,   script: Bengali,    review_status: SEED_UNREVIEWED}
  ta:  {name: Tamil,     script: Tamil,      review_status: SEED_UNREVIEWED}
  te:  {name: Telugu,    script: Telugu,     review_status: SEED_UNREVIEWED}
  gu:  {name: Gujarati,  script: Gujarati,   review_status: SEED_UNREVIEWED}
  kn:  {name: Kannada,   script: Kannada,    review_status: SEED_UNREVIEWED}
  ml:  {name: Malayalam, script: Malayalam,  review_status: SEED_UNREVIEWED}
  pa:  {name: Punjabi,   script: Gurmukhi,   review_status: SEED_UNREVIEWED}
  or:  {name: Odia,      script: Odia,       review_status: SEED_UNREVIEWED}
  as:  {name: Assamese,  script: Bengali,    review_status: SEED_UNREVIEWED}
  ur:  {name: Urdu,      script: Arabic,     review_status: SEED_UNREVIEWED}
  kok: {name: Konkani,   script: Devanagari, review_status: SEED_UNREVIEWED}
  ne:  {name: Nepali,    script: Devanagari, review_status: SEED_UNREVIEWED}
  mai: {name: Maithili,  script: Devanagari, review_status: SEED_UNREVIEWED}
  sa:  {name: Sanskrit,  script: Devanagari, review_status: SEED_UNREVIEWED}
  mni: {name: Manipuri (Meitei), script: Meetei Mayek, review_status: SEED_UNREVIEWED}

# Words that tell two languages sharing a script apart. Devanagari is Hindi
# unless Marathi or Konkani markers appear; Bengali script is Bengali unless
# an Assamese letter or marker appears.
markers:
  mr: [आहे, आहेत, माझं, माझा, माझी, माझे, माझ्या, मी, किती, सांगा, होते, केसचा, कर्ज, रक्कम, रकमेचे, मागितले,
       आणि, सह-अर्जदाराचा, सह-अर्जदाराची, सह-अर्जदाराचे,
       कोणत्या, कोणता, कोणती, कोणते, मध्ये, सध्या, काय, झाले, झालं, तुमच्या,
       लागतील, लागेल, कागदपत्रे, कागदपत्र, साठी, स्टेजसाठी, टप्प्यात, आता,
       लागतो, लागते, लागतात, जुळत, नाव, मधून, माहिती, मिळाली, पाहिजे, कागदपत्रांची, पडताळणी,
       ग्राहकाचा, ग्राहकाची, ग्राहकाचे, ग्राहकाच्या, अर्जदाराचा, अर्जदाराची, अर्जदाराचे, झाली, झाला]
  kok: [म्हजो, म्हजी, म्हजें, कितें, आसा, खंयच्या, खंय]
  # A LETTER only Marathi writes among these: "ळ" (जुळत, मिळाली, पडताळणी)
  "letters:mr": [ळ]
  # PLAINLY HINDI words: with one present the statistical detector (below)
  # never turns a question Marathi
  hi: [है, हैं, था, थी, क्या, क्यों, कैसे, कौन, कौनसा, किस, मेरा, मेरी, मेरे, आपका, आपकी, आपके,
       नहीं, चाहिए, हुआ, हुई, गया, गई, करना, बताओ, बताइए, में, और, भी, अभी, यह, वह, दस्तावेज़]
  # ROMAN MARATHI ("KYC zala ka?", "pudhe kay karaycha?", "kay baki ahe?")
  mr-Latn: [zala, zale, zali, jhala, jhale, jhali, zhala, kay, ahe, aahe, aahet, ahet, pudhe, karaycha,
            karayche, karaychi, madhun, mahiti, milali, milala, lagto, lagte, lagtat, lagel, lagtil,
            julat, jult, majhya, majha, majhi, majhe, mazya, maza, mazi, maze, kiti, karjachi, kagadpatre,
            kagadpatra, sanga, konte, konti, konta, konatya, kuthe, kevha, kashala, cha, chi, che, chya,
            tapasla, tapasle, tapasli, padtalni, zalay, zalat, naav, grahakacha, grahakachi, grahakache]
  # Nepali / Maithili / Sanskrit share many words with Hindi: they need
  # TWO of their markers (language.py), and no marker is also a Hindi word
  ne: [मेरो, छ, छन्, कति, भयो, कुन, गर्नुहोस्, हुन्छ, चरणमा, ऋणको]
  mai: [हमर, अछि, कतेक, छै, भेल, कोन, कहू]
  sa: [मम, अस्ति, सन्ति, किम्, कस्मिन्, कियत्, किमर्थम्, आवेदनं, आवेदनस्य, चरणे, पत्राणि]
  as: [ৰ, ৱ, মোৰ, আছেনে, কিয়]
  hi-Latn: [hai, hain, kya, kyu, kyun, kyon, mera, meri, mere, kis, kaha, kahan,
            hu, hoon, hun, mujhe, batao, bataiye, abhi, baaki, baki, nahi, kaunsa,
            kaunse, konsa, konse, karna, chahiye, hua, hui, hota, badla, pe, mein,
            aur, bhi, kab, tak, raha, rahi, gaya, gayi, wala, wali, namaste, namaskar,
            shukriya, dhanyavad, dhanyawad, alvida, sab, sabhi, theek, thik, sahi,
            koi, kuch, dena, dene, deni, hoga, hogi, honge, mereko, mujhko, apna,
            apni, apne, aapka, aapki, aapke, karo, kijiye, kiya, kiye, ho, hun,
            aage, abhi, kal, aaj, kab, jaldi, h, hv, kitne, kitna, kitni, mahine, mahino,
            rakkam, se, mili, mila, nikla, nikli,
            jo, kar, kardo, ke, liye, ka, ki, bhej, badh, sakta, sakte, sakti, baaki]

# ---------------------------------------------------------------------------
# LEXICONS -- language word (or phrase) -> canonical English.
#
# Longest phrase first, whole tokens only. An inflected form is listed as its
# own entry ("चरण में" -> "stage in") rather than guessed by stemming.
# ---------------------------------------------------------------------------
# A language whose lexicon builds on another's (its own entries win a clash).
lexicon_inherits:
  mr-Latn: [hi-Latn]

# THE OPTIONAL STATISTICAL DETECTOR (pip: lingua-language-detector). Used ONLY
# for Devanagari text that carries no marker word above, to tell Marathi from
# Hindi ("कागदपत्रांची पडताळणी झाली का?"); markers.hi veto it. Without the
# library, or with LANGUAGE_DETECTOR=off, the markers decide alone.
detector:
  library: lingua
  devanagari: [hi, mr]
  min_confidence: 0.75

