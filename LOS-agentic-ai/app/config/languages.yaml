# ============================================================================
# LANGUAGE UNDERSTANDING -- configuration for app/agents/applicant/language.py
#
# WHAT THIS IS. A question in any supported language is rewritten into the
# canonical ENGLISH words the Copilot's rules already understand, BEFORE
# classification. "मेरा आवेदन किस चरण में है?", "mera stage kya hai?" and
# "What is my stage?" all reach the same intent, the same tools and the same
# recorded answer. There is ONE set of business rules; a language adds words
# here, never code.
#
# WHAT THIS IS NOT. It is not translation, and it decides nothing. It never
# selects an intent, a stage, a status or an action -- it produces a message,
# classified by the same rules as anything typed in English. A word it does
# not know is left as it is, and a question it cannot map is answered exactly
# as an unrecognised English question would be.
#
# REVIEW STATUS -- HONEST. These lexicons are a SEED written for the core
# case vocabulary (stage, status, documents, pending, KYC, verification, next
# step, co-applicant, why/what/where/which). They have NOT been reviewed by
# native speakers. `review_status` says so per language, and the Copilot
# publishes it; extend and correct the words here, not in code.
#
# Environment: MULTILINGUAL_ENABLED=false turns the whole layer off (English
# and the existing Hinglish short forms in applicant_agent.yaml still work).
# ============================================================================

enabled: true

# Languages answered with a localized sentence where a template exists
# (below). Everything else is answered in English, and the response says so.
default_response_language: en

languages:
  en:  {name: English,   script: Latin,      review_status: NATIVE}
  hi:  {name: Hindi,     script: Devanagari, review_status: SEED_UNREVIEWED}
  hi-Latn: {name: Hindi (Romanized / Hinglish), script: Latin, review_status: SEED_UNREVIEWED}
  mr:  {name: Marathi,   script: Devanagari, review_status: SEED_UNREVIEWED}
  bn:  {name: Bengali,   script: Bengali,    review_status: SEED_UNREVIEWED}
  ta:  {name: Tamil,     script: Tamil,      review_status: SEED_UNREVIEWED}
