# ---------------------------------------------------------------------------
# REWRITES -- word order, applied to the canonical English words.
#
# Most Indian languages put the question word at the END ("my stage what is",
# "my application which stage in is"). These rules move it to the front so
# the English rules read the question the way they read "what is my stage".
# Structural only: each rule reorders words the user typed; none adds a fact.
# Applied in order, first match wins, only to non-English input.
# ---------------------------------------------------------------------------
