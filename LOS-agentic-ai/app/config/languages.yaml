# (answering/localize.py). Exact match only; seed, unreviewed.
fixed_sentences:
  "There is no co-applicant on this application.":
    hi: "इस आवेदन पर कोई सह-आवेदक नहीं है।"
    hi-Latn: "Is application par koi co-applicant nahi hai."
    mr: "या अर्जावर सह-अर्जदार नाही."
  "There's no co-applicant on this application, only the primary applicant is on record.":
    hi: "इस आवेदन पर कोई सह-आवेदक नहीं है, केवल मुख्य आवेदक दर्ज है।"
    hi-Latn: "Is application par koi co-applicant nahi hai, sirf primary applicant record mein hai."
    mr: "या अर्जावर सह-अर्जदार नाही, फक्त मुख्य अर्जदाराची नोंद आहे."
  "This application has only one applicant.":
    hi: "इस आवेदन पर केवल एक आवेदक है।"
    hi-Latn: "Is application par sirf ek applicant hai."
    mr: "या अर्जावर फक्त एकच अर्जदार आहे."
  # common chatbot answers (2026-10-06): fixed sentences, translated whole
  "Eligibility has not been evaluated for this case yet. It is assessed once the income evidence and the loan terms are in place.":
    hi: "इस केस की पात्रता अभी जाँची नहीं गई है। आय के दस्तावेज़ और लोन की शर्तें आने पर इसका आकलन होगा।"
    hi-Latn: "Is case ki eligibility abhi check nahi hui hai. Income documents aur loan terms aane par iska assessment hoga."
    mr: "या केसची पात्रता अजून तपासलेली नाही. उत्पन्नाची कागदपत्रे आणि कर्जाच्या अटी आल्यावर तिचे मूल्यांकन होईल."
  "No required documents are missing for this case.":
    hi: "इस केस के लिए कोई ज़रूरी दस्तावेज़ बाकी नहीं है।"
    hi-Latn: "Is case ke liye koi zaroori document baaki nahi hai."
    mr: "या केससाठी कोणतेही आवश्यक कागदपत्र बाकी नाही."
  "Nothing is pending for this case.":
    hi: "इस केस में कुछ भी बाकी नहीं है।"
    hi-Latn: "Is case mein kuch bhi baaki nahi hai."
    mr: "या केसमध्ये काहीही बाकी नाही."
  "No documents are pending.":
    hi: "कोई दस्तावेज़ बाकी नहीं है।"
    hi-Latn: "Koi document baaki nahi hai."
    mr: "कोणतेही कागदपत्र बाकी नाही."

