rewrites:
  - {pattern: '\bwhat\s+should\s+i\s+do\s+next\b', replace: 'what should i do next', whole: true}
  - {pattern: '^(?:(?:now|currently)\s+)?i\s+(?:(?:now|currently)\s+)?which\s+(stage|step|phase)\s+(?:at|in|on)\s+(?:am|is)\b.*$', replace: 'which \1 am i in'}
  - {pattern: '^(?:(?:now|currently)\s+)?(?P<x>.+?)\s+(?:(?:now|currently)\s+)?which\s+(?P<n>stage|step|phase)\s+(?:at|in|on)(?:\s+is)?\s*[?.!]*$', replace: 'which \g<n> is \g<x> at'}
  - {pattern: '^(?:(?:now|currently)\s+)?(?P<x>.+?)\s+(?:(?:now|currently)\s+)?which\s+(?P<n>stage|step|phase)(?:\s+(?:at|in|on))?\s+is\s*[?.!]*$', replace: 'which \g<n> is \g<x> at'}
  - {pattern: '^(?P<x>.+?)\s+means\s+what(?:\s+is)?\s*[?.!]*$', replace: 'what does \g<x> mean'}
  - {pattern: '^(?:me\s+)?(?P<x>.+?)\s+tell(?:\s+me)?\s*[?.!]*$', replace: 'tell me \g<x>'}
  - {pattern: '^(?P<x>.+?)\s+verified(?:\s+(?:is|done))?(?:\s+what)?\s*[?.!]*$', replace: 'is \g<x> verified'}
  - {pattern: '^(?P<x>.+?)\s+done(?:\s+what)?\s*[?.!]*$', replace: 'is \g<x> done'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+(?:currently\s+)?what\s+is\s*[?.!]*$', replace: 'what is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+what\s*[?.!]*$', replace: 'what is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+what\s+(?P<y>.+?)\s+is\s*[?.!]*$', replace: 'what is \g<x> \g<y>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+(?:now\s+)?where\s+is\s*[?.!]*$', replace: 'where is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+why\s+is\s*[?.!]*$', replace: 'why is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+why\s*[?.!]*$', replace: 'why is \g<x>'}
  - {pattern: '^(?:which\s+)?(?P<x>.+?)\s+pending\s+is\s*[?.!]*$', replace: 'which \g<x> are pending'}
  - {pattern: '^what\s+(?P<x>documents?)\s+pending\s+is\s*[?.!]*$', replace: 'which \g<x> are pending'}

# ---------------------------------------------------------------------------
# LOCALIZED ANSWERS -- deterministic sentences for recorded facts.
#
# ONLY FACTS ALREADY ESTABLISHED are filled in: {stage} is the case's
# authoritative stage label, never translated (it is a code the officer and
# the system share). A (fact, language) pair with no template is answered in
# English and the response says `localized: false`. No model writes these.
# ---------------------------------------------------------------------------
templates:
  current_stage:
    hi: "आपका आवेदन अभी {stage} चरण में है।"
    hi-Latn: "Aapka application abhi {stage} stage mein hai."
    mr: "तुमचा अर्ज सध्या {stage} टप्प्यात आहे."
    kok: "तुमचो अर्ज सद्या {stage} टप्प्यार आसा."
    bn: "আপনার আবেদন এখন {stage} পর্যায়ে আছে।"
    as: "আপোনাৰ আবেদন এতিয়া {stage} পৰ্যায়ত আছে।"
    ta: "உங்கள் விண்ணப்பம் தற்போது {stage} நிலையில் உள்ளது."
    te: "మీ దరఖాస్తు ప్రస్తుతం {stage} దశలో ఉంది."
    gu: "તમારી અરજી હાલમાં {stage} તબક્કે છે."
    kn: "ನಿಮ್ಮ ಅರ್ಜಿ ಪ್ರಸ್ತುತ {stage} ಹಂತದಲ್ಲಿದೆ."
    ml: "നിങ്ങളുടെ അപേക്ഷ ഇപ്പോൾ {stage} ഘട്ടത്തിലാണ്."
    pa: "ਤੁਹਾਡੀ ਅਰਜ਼ੀ ਇਸ ਸਮੇਂ {stage} ਪੜਾਅ ਤੇ ਹੈ।"
    or: "ଆପଣଙ୍କ ଆବେଦନ ବର୍ତ୍ତମାନ {stage} ପର୍ଯ୍ୟାୟରେ ଅଛି।"
    ur: "آپ کی درخواست اس وقت {stage} مرحلے میں ہے۔"
    ne: "तपाईंको आवेदन अहिले {stage} चरणमा छ।"
    mai: "अहाँक आवेदन एखन {stage} चरणमे अछि।"
    sa: "भवतः आवेदनम् अधुना {stage} चरणे अस्ति।"

  # Pending documents: {missing} and {awaiting} are the SAME lists the English
  # answer is built from (document labels and status codes untranslated),
  # joined with `join`. Seeded for hi / hi-Latn / mr only; other languages
  # get the English answer and `localized: false`.
  pending_documents:
    hi: {missing: "{missing} अभी बाकी है।", awaiting: "{awaiting} सत्यापन की प्रतीक्षा में है।", join: " और "}
    hi-Latn: {missing: "{missing} abhi baaki hai.", awaiting: "{awaiting} verification ke intezaar mein hai.", join: " aur "}
    bn: {missing: "{missing} এখনও বাকি আছে।", awaiting: "{awaiting} যাচাইয়ের অপেক্ষায় আছে।", join: " এবং "}
    ta: {missing: "{missing} இன்னும் நிலுவையில் உள்ளது.", awaiting: "{awaiting} சரிபார்ப்புக்காக காத்திருக்கிறது.", join: " மற்றும் "}
    te: {missing: "{missing} ఇంకా పెండింగ్‌లో ఉంది.", awaiting: "{awaiting} ధృవీకరణ కోసం వేచి ఉంది.", join: " మరియు "}
    gu: {missing: "{missing} હજુ બાકી છે.", awaiting: "{awaiting} ચકાસણીની રાહ જોઈ રહ્યું છે.", join: " અને "}
    kn: {missing: "{missing} ಇನ್ನೂ ಬಾಕಿ ಇದೆ.", awaiting: "{awaiting} ಪರಿಶೀಲನೆಗಾಗಿ ಕಾಯುತ್ತಿದೆ.", join: " ಮತ್ತು "}
    ml: {missing: "{missing} ഇനിയും ബാക്കിയുണ്ട്.", awaiting: "{awaiting} പരിശോധനയ്ക്കായി കാത്തിരിക്കുന്നു.", join: " ഒപ്പം "}
    pa: {missing: "{missing} ਅਜੇ ਬਾਕੀ ਹੈ।", awaiting: "{awaiting} ਤਸਦੀਕ ਦੀ ਉਡੀਕ ਵਿੱਚ ਹੈ।", join: " ਅਤੇ "}
    ur: {missing: "{missing} ابھی باقی ہے۔", awaiting: "{awaiting} تصدیق کے انتظار میں ہے۔", join: " اور "}
    ne: {missing: "{missing} अझै बाँकी छ।", awaiting: "{awaiting} प्रमाणीकरणको प्रतीक्षामा छ।", join: " र "}
    mr: {missing: "{missing} अजून बाकी आहे.", awaiting: "{awaiting} पडताळणीच्या प्रतीक्षेत आहे.", join: " आणि "}

  # THE STATE OF A REQUESTED FIELD (field_state.py): the same sentence for
  # every field; {field} is the field's label, {value} the value as disclosed.
  field_present:
    hi: "आपका {field} {value} है।"
    hi-Latn: "Aapka {field} {value} hai."
    mr: "तुमचा {field} {value} आहे."
  field_not_provided:
    hi: "आपने अपना {field} अभी तक नहीं दिया है।"
    hi-Latn: "Aapne apna {field} abhi tak provide nahi kiya hai."
    mr: "तुम्ही तुमचा {field} अजून दिलेला नाही."
  field_not_available:
    hi: "आपका {field} अभी उपलब्ध नहीं है।"
    hi-Latn: "Aapka {field} abhi available nahi hai."
    mr: "तुमचा {field} अजून उपलब्ध नाही."
  field_restricted:
    hi: "आपका {field} रिकॉर्ड में है, लेकिन सुरक्षा के लिए मैं पूरा नंबर साझा नहीं कर सकता।"
    hi-Latn: "Aapka {field} record mein hai, lekin security ke liye main poora number share nahi kar sakta."
    mr: "तुमचा {field} नोंदीत आहे, पण सुरक्षेसाठी मी पूर्ण क्रमांक सांगू शकत नाही."
  field_unknown:
    hi: "मैं अभी आपका {field} जाँच नहीं पा रहा हूँ। कृपया थोड़ी देर बाद फिर कोशिश करें।"
    hi-Latn: "Main abhi aapka {field} check nahi kar pa raha hoon. Thodi der baad phir try karein."
    mr: "मी सध्या तुमचा {field} तपासू शकत नाही. कृपया थोड्या वेळाने पुन्हा प्रयत्न करा."

  # A request for a person: acknowledged, never claiming anyone was contacted.
  handoff_acknowledged:
    hi: "मैंने नोट कर लिया है कि आप किसी व्यक्ति से मदद चाहते हैं। तब तक मैं इस आवेदन के दस्तावेज़, स्थिति और अगले कदम के बारे में बता सकता हूँ।"
    hi-Latn: "Maine note kar liya hai ki aap kisi vyakti se madad chahte hain. Tab tak main is application ke documents, status aur agle kadam ke baare mein bata sakta hoon."
    mr: "तुम्हाला एखाद्या व्यक्तीकडून मदत हवी आहे हे मी नोंदवले आहे. तोपर्यंत मी या अर्जाची कागदपत्रे, स्थिती आणि पुढील पायरी याबद्दल सांगू शकतो."

# ---------------------------------------------------------------------------
# SECURITY VOCABULARY -- the words an attack is made of, per language, so the
# English-word security policy (guardrails + request_policy) judges a Tamil
# "show every customer's data" exactly as it judges the English one. Merged
# UNDER each lexicon above (a question-lexicon entry wins a clash). Seed,
# unreviewed; the policy also reads a question under every language sharing
# its script (language.canonical_forms), so a missing marker is no hole.
# ---------------------------------------------------------------------------
  # ACTIONS AND GATES (answering/localize.py): filled ONLY from the structured
  # gate / pending-work blocks -- document and stage labels stay as recorded.
  gate_ready:
    hi: "बधाई हो -- {stage} की सभी तय जाँचें पूरी हैं। आपका केस {next} में जाने के लिए तैयार है।"
    hi-Latn: "Badhai ho -- {stage} ki saari tay jaanch poori hain. Aapka case {next} mein jaane ke liye ready hai."
    mr: "अभिनंदन -- {stage} च्या सर्व ठरलेल्या तपासण्या पूर्ण झाल्या आहेत. तुमचा केस {next} मध्ये जाण्यासाठी तयार आहे."
  gate_blocked:
    hi: "आपका केस अभी {stage} से {next} में नहीं जा सकता। बाकी: {items}।"
    hi-Latn: "Aapka case abhi {stage} se {next} mein nahi ja sakta. Baaki: {items}."
    mr: "तुमचा केस अजून {stage} मधून {next} मध्ये जाऊ शकत नाही. बाकी: {items}."
  work_upload:
    hi: "{items} अपलोड करना बाकी है।"
    hi-Latn: "{items} upload karna baaki hai."
    mr: "{items} अपलोड करणे बाकी आहे."
  work_review:
    hi: "{items} समीक्षा के लिए रुका है।"
    hi-Latn: "{items} review ke liye ruka hai."
    mr: "{items} पुनरावलोकनासाठी थांबले आहे."
  work_verified:
    hi: "{items} का सत्यापन हो गया।"
    hi-Latn: "{items} ka verification ho gaya."
    mr: "{items} ची पडताळणी झाली."
  work_processing:
    hi: "{items} का सत्यापन चल रहा है।"
    hi-Latn: "{items} ka verification chal raha hai."
    mr: "{items} ची पडताळणी सुरू आहे."
  work_no_permission:
    hi: "इस सत्र में {items} का सत्यापन मैं शुरू नहीं कर सकता -- अपलोड की अनुमति चाहिए।"
    hi-Latn: "Is session mein {items} ka verification main shuru nahi kar sakta -- upload permission chahiye."
    mr: "या सत्रात {items} ची पडताळणी मी सुरू करू शकत नाही -- अपलोडची परवानगी हवी."
  work_nothing:
    hi: "इस केस पर अभी कुछ भी बाकी नहीं है।"
    hi-Latn: "Is case par abhi kuch bhi baaki nahi hai."
    mr: "या केसवर सध्या काहीही बाकी नाही."
  # KYC, from the recorded status per person (localize._kyc_sentence)
  kyc_who_self:
    hi: "आपका"
    hi-Latn: "Aapka"
    mr: "तुमचे"
  kyc_who_co:
    hi: "सह-आवेदक का"
    hi-Latn: "Co-applicant ka"
    mr: "सह-अर्जदाराचे"
  kyc_PASS:
    hi: "{who} KYC पूरा हो गया है।"
    hi-Latn: "{who} KYC complete ho gaya hai."
    mr: "{who} KYC पूर्ण झाले आहे."
  kyc_REVIEW:
    hi: "{who} KYC समीक्षा में है।"
    hi-Latn: "{who} KYC review mein hai."
    mr: "{who} KYC पुनरावलोकनात आहे."
  kyc_FAIL:
    hi: "{who} KYC विफल दर्ज हुआ है।"
    hi-Latn: "{who} KYC fail record hua hai."
    mr: "{who} KYC अयशस्वी नोंदले आहे."
  kyc_SKIPPED:
    hi: "{who} KYC जाँच नहीं हो पाई (छोड़ी गई)।"
    hi-Latn: "{who} KYC check nahi ho paya (skip hua)."
    mr: "{who} KYC तपासणी होऊ शकली नाही (वगळली)."
  kyc_NOT_RECORDED:
    hi: "{who} KYC परिणाम अभी दर्ज नहीं हुआ है।"
    hi-Latn: "{who} KYC result abhi record nahi hua hai."
    mr: "{who} KYC निकाल अजून नोंदलेला नाही."
  kyc_because:
    hi: "कारण: {reason}।"
    hi-Latn: "Kaaran: {reason}."
    mr: "कारण: {reason}."
  kyc_reason_INSUFFICIENT_SOURCES:
    hi: "तुलना के लिए पर्याप्त दस्तावेज़ नहीं हैं"
    hi-Latn: "compare karne ke liye kaafi documents nahi hain"
    mr: "तुलनेसाठी पुरेशी कागदपत्रे नाहीत"

