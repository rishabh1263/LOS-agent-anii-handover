rewrites:
  # "PAN का लागतो?" -> "pan why is needed" -> "why is pan needed"
  - {pattern: '^(?P<x>.+?)\s+why\s+is\s+needed\s*[?.!]*$', replace: 'why is \g<x> needed'}
  # "नाव जुळत नाही का?" -> "name not matching" -> "why is name not matching"
  - {pattern: '^(?P<x>.+?)\s+not\s+matching\s*[?.!]*$', replace: 'why is \g<x> not matching'}
  # "bank statement madhun kay mahiti milali?" -> "what details extracted from bank statement"
  - {pattern: '^(?P<x>.+?)\s+from\s+what\s+details(?:\s+extracted)?\s*[?.!]*$', replace: 'what details extracted from \g<x>'}
  - {pattern: '\bwhat\s+should\s+i\s+do\s+next\b', replace: 'what should i do next', whole: true}
  - {pattern: '^(?:(?:now|currently)\s+)?i\s+(?:(?:now|currently)\s+)?which\s+(stage|step|phase)\s+(?:at|in|on)\s+(?:am|is)\b.*$', replace: 'which \1 am i in'}
  - {pattern: '^(?:(?:now|currently)\s+)?(?P<x>.+?)\s+(?:(?:now|currently)\s+)?which\s+(?P<n>stage|step|phase)\s+(?:at|in|on)(?:\s+is)?\s*[?.!]*$', replace: 'which \g<n> is \g<x> at'}
  - {pattern: '^(?:(?:now|currently)\s+)?(?P<x>.+?)\s+(?:(?:now|currently)\s+)?which\s+(?P<n>stage|step|phase)(?:\s+(?:at|in|on))?\s+is\s*[?.!]*$', replace: 'which \g<n> is \g<x> at'}
  - {pattern: '^(?P<x>.+?)\s+means\s+what(?:\s+is)?\s*[?.!]*$', replace: 'what does \g<x> mean'}
  - {pattern: '^(?:me\s+)?(?P<x>.+?)\s+tell(?:\s+me)?\s*[?.!]*$', replace: 'tell me \g<x>'}
  - {pattern: '^(?P<x>.+?)\s+verified(?:\s+(?:is|done))?(?:\s+what)?\s*[?.!]*$', replace: 'is \g<x> verified'}
  - {pattern: '^(?P<x>.+?)\s+done(?:\s+what)?\s*[?.!]*$', replace: 'is \g<x> done'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+(?:currently\s+)?what\s+is\s*[?.!]*$', replace: 'what is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+what\s*[?.!]*$', replace: 'what is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+what\s+(?P<y>.+?)\s+is\s*[?.!]*$', replace: 'what is \g<x> \g<y>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+(?:now\s+)?where\s+is\s*[?.!]*$', replace: 'where is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+why\s+is\s*[?.!]*$', replace: 'why is \g<x>'}
  - {pattern: '^(?:now\s+)?(?P<x>.+?)\s+why\s*[?.!]*$', replace: 'why is \g<x>'}
  - {pattern: '^(?:which\s+)?(?P<x>.+?)\s+pending\s+is\s*[?.!]*$', replace: 'which \g<x> are pending'}
  - {pattern: '^what\s+(?P<x>documents?)\s+pending\s+is\s*[?.!]*$', replace: 'which \g<x> are pending'}

# ---------------------------------------------------------------------------
# LOCALIZED ANSWERS -- deterministic sentences for recorded facts.
#
# ONLY FACTS ALREADY ESTABLISHED are filled in: {stage} is the case's
# authoritative stage label, never translated (it is a code the officer and
# the system share). A (fact, language) pair with no template is answered in
# English and the response says `localized: false`. No model writes these.
# ---------------------------------------------------------------------------
