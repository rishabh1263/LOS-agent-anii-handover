    bn: {missing: "{missing} এখনও বাকি আছে।", awaiting: "{awaiting} যাচাইয়ের অপেক্ষায় আছে।", join: " এবং "}
    ta: {missing: "{missing} இன்னும் நிலுவையில் உள்ளது.", awaiting: "{awaiting} சரிபார்ப்புக்காக காத்திருக்கிறது.", join: " மற்றும் "}
    te: {missing: "{missing} ఇంకా పెండింగ్‌లో ఉంది.", awaiting: "{awaiting} ధృవీకరణ కోసం వేచి ఉంది.", join: " మరియు "}
    gu: {missing: "{missing} હજુ બાકી છે.", awaiting: "{awaiting} ચકાસણીની રાહ જોઈ રહ્યું છે.", join: " અને "}
    kn: {missing: "{missing} ಇನ್ನೂ ಬಾಕಿ ಇದೆ.", awaiting: "{awaiting} ಪರಿಶೀಲನೆಗಾಗಿ ಕಾಯುತ್ತಿದೆ.", join: " ಮತ್ತು "}
    ml: {missing: "{missing} ഇനിയും ബാക്കിയുണ്ട്.", awaiting: "{awaiting} പരിശോധനയ്ക്കായി കാത്തിരിക്കുന്നു.", join: " ഒപ്പം "}
    pa: {missing: "{missing} ਅਜੇ ਬਾਕੀ ਹੈ।", awaiting: "{awaiting} ਤਸਦੀਕ ਦੀ ਉਡੀਕ ਵਿੱਚ ਹੈ।", join: " ਅਤੇ "}
    ur: {missing: "{missing} ابھی باقی ہے۔", awaiting: "{awaiting} تصدیق کے انتظار میں ہے۔", join: " اور "}
    ne: {missing: "{missing} अझै बाँकी छ।", awaiting: "{awaiting} प्रमाणीकरणको प्रतीक्षामा छ।", join: " र "}
    mr: {missing: "{missing} अजून बाकी आहे.", awaiting: "{awaiting} पडताळणीच्या प्रतीक्षेत आहे.", join: " आणि "}

