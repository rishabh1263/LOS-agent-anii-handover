  # A request for a person: acknowledged, never claiming anyone was contacted.
  handoff_acknowledged:
    hi: "मैंने नोट कर लिया है कि आप किसी व्यक्ति से मदद चाहते हैं। तब तक मैं इस आवेदन के दस्तावेज़, स्थिति और अगले कदम के बारे में बता सकता हूँ।"
    hi-Latn: "Maine note kar liya hai ki aap kisi vyakti se madad chahte hain. Tab tak main is application ke documents, status aur agle kadam ke baare mein bata sakta hoon."
    mr: "तुम्हाला एखाद्या व्यक्तीकडून मदत हवी आहे हे मी नोंदवले आहे. तोपर्यंत मी या अर्जाची कागदपत्रे, स्थिती आणि पुढील पायरी याबद्दल सांगू शकतो."

# ---------------------------------------------------------------------------
# SECURITY VOCABULARY -- the words an attack is made of, per language, so the
# English-word security policy (guardrails + request_policy) judges a Tamil
# "show every customer's data" exactly as it judges the English one. Merged
# UNDER each lexicon above (a question-lexicon entry wins a clash). Seed,
# unreviewed; the policy also reads a question under every language sharing
# its script (language.canonical_forms), so a missing marker is no hole.
# ---------------------------------------------------------------------------
  # ACTIONS AND GATES (answering/localize.py): filled ONLY from the structured
  # gate / pending-work blocks -- document and stage labels stay as recorded.
  gate_ready:
    hi: "{stage} की सभी तय जाँचें पूरी हैं। आपका केस {next} में जाने के लिए तैयार है।"
    hi-Latn: "{stage} ki saari tay jaanch poori hain. Aapka case {next} mein jaane ke liye ready hai."
    mr: "{stage} च्या सर्व ठरलेल्या तपासण्या पूर्ण झाल्या आहेत. तुमचा केस {next} मध्ये जाण्यासाठी तयार आहे."
  gate_blocked:
    hi: "आपका केस अभी {stage} से {next} में नहीं जा सकता। बाकी: {items}।"
    hi-Latn: "Aapka case abhi {stage} se {next} mein nahi ja sakta. Baaki: {items}."
    mr: "तुमचा केस अजून {stage} मधून {next} मध्ये जाऊ शकत नाही. बाकी: {items}."
  work_upload:
    hi: "{items} अपलोड करना बाकी है।"
    hi-Latn: "{items} upload karna baaki hai."
    mr: "{items} अपलोड करणे बाकी आहे."
  work_review:
    hi: "{items} समीक्षा के लिए रुका है।"
    hi-Latn: "{items} review ke liye ruka hai."
    mr: "{items} पुनरावलोकनासाठी थांबले आहे."
  work_verified:
    hi: "{items} का सत्यापन हो गया।"
    hi-Latn: "{items} ka verification ho gaya."
    mr: "{items} ची पडताळणी झाली."
  work_processing:
    hi: "{items} का सत्यापन चल रहा है।"
    hi-Latn: "{items} ka verification chal raha hai."
    mr: "{items} ची पडताळणी सुरू आहे."
  work_no_permission:
    hi: "इस सत्र में {items} का सत्यापन मैं शुरू नहीं कर सकता, अपलोड की अनुमति चाहिए।"
    hi-Latn: "Is session mein {items} ka verification main shuru nahi kar sakta, upload permission chahiye."
    mr: "या सत्रात {items} ची पडताळणी मी सुरू करू शकत नाही, अपलोडची परवानगी हवी."
  work_nothing:
    hi: "इस केस पर अभी कुछ भी बाकी नहीं है।"
    hi-Latn: "Is case par abhi kuch bhi baaki nahi hai."
    mr: "या केसवर सध्या काहीही बाकी नाही."
