# FIELD-OFFICER TERMS (curated 2026-10-16) -- read into the meaning bank via intent_catalogue.yaml paraphrase_files.
# How officers really type on a phone: Hinglish, short forms (docs, stmt, cust, mob, pls, h, kr), typos, Devanagari
# and Marathi. Each line is an example of its intent's MEANING, not a keyword rule: the embedding bank + classifier
# generalise from them, and Qwen still decides anything unclear.
#
# PAIRS THAT GET CONFUSED are written side by side on purpose (pending vs uploaded, status vs stage, why-stuck vs
# next-step, this case vs the how-to, one document's status vs its fields).
#
# RULES: never copy a sentence from evals/copilot/meaning_heldout_*.yaml (measured only); after editing, retrain
# (python scripts/train_meaning_classifier.py) and measure (python -m evals.copilot.routing_eval).
