# ---- THE TEN RULES: short name, simple explanation (on screen), why it matters, and their reasons
rules:
  R1:
    name: "Owner Details Match"
    explain: "Does the owner on the Sale Deed, as the agency reports it, match the property-owner details recorded in the application?"
    why: "The person offering the property may not be its owner on record."
    pass: "Every owner in the application is the buyer on the Sale Deed."
    pass_folded: "The owners match after ignoring titles, spacing and initials."
    fail: "The owner the agency reports on the Sale Deed differs from the application: {names}."
    review_no_deed: "The agency has not reported the owner on the Sale Deed yet."
    review_no_app: "The application records no property owner."
    owner: "Owner {n}"
  R2:
    name: "Sale Deed Looks Consistent"
    explain: "Is the document readable and complete? Are there suspicious changes, missing pages or inconsistent details that need checking?"
    why: "Signals on the file are a reason to check the original -- never proof that it is fake."
    pass: "The Sale Deed file opens, its details are consistent and nothing about the file needs a look."
    review: "Worth a look: {signals}."
    fail_not_deed: "The uploaded file is not a sale deed: it reads as a {subtype}."
    no_deed: "No Sale Deed uploaded yet."
    producer: "File made with"
    file: "File"
    pages: "{n} page(s)"
    signals:
      unreadable: "the file could not be opened"
      no_details: "the Sale Deed details are not entered yet"
      editing_tool: "an editing tool ({tool}) is named in the file's details"
      modified_late: "the file was changed {days} day(s) after it was created"
      dates_order: "the dates on the deed are out of order"
      other_instrument: "the instrument reads as a {subtype}, not a sale"
      no_registration: "no registration number or date could be read"
  R3:
    name: "Property Address Matches"
    explain: "Does the property location the agency reports from the Sale Deed match the address recorded in the application?"
    why: "The deed may describe a different property from the one offered as collateral."
    pass: "The district and state the agency reports match the application."
    fail: "The agency reports a different {fields} from the application."
    review: "The location could not be compared: {missing}."
    review_no_report: "The agency has not reported the property location yet."
    pin: "PIN code"
    address: "Address"
  R4:
    name: "Ownership History"
    explain: "Do the available documents show how ownership passed from previous owners to the current owner, without unexplained gaps?"
    why: "A break in the chain means someone in between may still have a claim."
    pass: "The chain runs from {first} to the current owner over {years} year(s), without gaps."
    review_none: "No ownership history has been provided yet."
    review_text_only: "The history is described in words only; list the transfers so the chain can be checked."
    fail_agency: "The agency reports that the title was not traced adequately or the chain of title is not maintained."
    pass_agency: "The agency confirms the title was traced and the chain of title is maintained and up to date."
    fail_break: "The chain breaks: {broken}."
    fail_last: "The chain does not end with the current owner on the Sale Deed."
    review_gap: "A gap of {years} year(s) between {a} and {b} is not explained."
    review_short: "The chain covers {years} year(s); the title search period is {need} year(s)."
    link: "Transfer {n}"
  R5:
    name: "Registration Details"
    explain: "Has the agency reported the Sale Deed number, registration date and Sub-Registrar office, and are they valid?"
    why: "Wrong registration details may point to a different, or unregistered, document."
    pass: "The agency reports the Sale Deed number, a valid registration date and the Sub-Registrar office."
    fail: "Not valid in the agency report: {fields}."
    review: "Not reported by the agency yet: {fields}."
    review_no_report: "The agency has not reported the registration details yet."
  R6:
    name: "Loan, Mortgage and Other Claims"
    explain: "Does the available search evidence identify any existing mortgage, legal claim, lien or other encumbrance on the property?"
    why: "An existing charge ranks before the bank's mortgage."
    pass: "The Encumbrance Certificate / search report for {years} year(s) is verified, CERSAI shows no active charge, and no charge is reported."
    fail: "An encumbrance is reported on the property: {details}."
    review_no_ec: "The Encumbrance Certificate / search report is not verified; missing search evidence is not proof that there is no charge."
    review_short: "The Encumbrance Certificate covers {years} year(s); {need} year(s) are required."
    review_no_report: "The agency has not reported on encumbrances yet."
    fail_cersai: "An active charge is registered on CERSAI: {details}."
    review_no_cersai: "No CERSAI search has been reported, so the central charge registry is not checked yet."
    cersai: "CERSAI charge"
    cersai_searches: "CERSAI searches"
    searches_n: "{n} search(es) performed"
  R7:
    name: "Required Documents and Search Period"
    explain: "Are the required historical property documents and title-search records available for the configured period?"
    why: "Without them the title cannot be traced for the full period."
    pass: "All {n} required documents are on file and the title documents were checked for the last {years} years."
    review_docs: "Missing: {docs}."
    not_uploaded: "Not uploaded"
    review_period: "The title search covers {years} year(s); {need} year(s) are required."
    review_no_period: "The agency has not said whether the title documents were checked for the last {need} years."
    review_not_checked: "The agency says the title documents were not checked for the last {need} years."
    review_years: "The property documents cover {years} year(s); {need} years are required."
  R8:
    name: "Property-Specific Legal Checks"
    explain: "Have the legal checks applicable to this property type been completed, based on the configured requirements and available evidence?"
    why: "Each property type has its own approvals; a missing one can make the property hard to enforce on."
    pass: "All {n} legal checks for this property type ({type}) are done."
    fail: "Adverse: {checks}."
    review: "Not done yet: {checks}."
    no_type: "The property type is not known, so its checks cannot be chosen."
  R9:
    name: "Agency Report Cross-Check"
    explain: "Did the agency report the correct owner, property details, documents and findings when compared against the original evidence?"
    why: "The agency's opinion is relied on; it must agree with the documents."
    pass: "The agency's report agrees with the application and the other checks."
    fail: "The agency reported something different for: {fields}."
    fail_opinion: "The agency says the title is clear, but {n} check(s) found a problem."
    review: "Could not compare: {fields}."
    no_report: "The agency has not submitted its report yet."
    opinion: "Title opinion"
    opinion_note: "{n} check(s) found a problem"
  R10:
    name: "Overall Risk and Next Action"
    explain: "Looking at all checks together, what needs attention, what evidence is missing, and what should the CPA do next?"
    why: "The recommendation explains; the CPA decides."
    reason: "{failed} mismatch(es), {review} item(s) to review, {passed} check(s) passed."

# ---- the AI summary
ai_summary:
  instructions: |
    You rewrite a legal property verification result for a credit officer (CPA) as short plain-English bullet points.
    You get numbered lines. Return exactly the same number of lines, in the same order, one bullet per line, each
    starting with "- ". Keep every number and name exactly. Do not add any fact, check, document or reason.
    Do not say the title is clear, safe, approved or rejected. Never call something passed unless its line says so.
  banned_words: [approve, approved, reject, rejected, safe, guaranteed, fraud, fake, forged, clear title, title is clear]
  labels:
    ai: "AI summary"
    rules: "Summary"
    note_ai: "Written by AI from the rule results and checked against them."
    note_rules: "Written from the rule results."
  lines:
    critical: "Critical: {name} — {reason}"
    fail: "Mismatch: {name} — {reason}"
    review: "Needs review: {name} — {reason}"
    missing: "Missing evidence: {items}"
    conflict: "Agency vs documents: {reason}"
    passed: "Passed: {names}"
    next: "Next action: {action}"

