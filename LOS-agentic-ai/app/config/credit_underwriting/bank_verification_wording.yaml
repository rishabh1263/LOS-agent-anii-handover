  colours: { PASS: "#17663a", FAIL: "#b42318", REVIEW_REQUIRED: "#b54708", NOT_APPLICABLE: "#555555",
             POSITIVE: "#17663a", NEGATIVE: "#b42318", default: "#555555" }

# ---- the summary in easy words (services/summary_service.py) ---------------------------------------------------------
ai_summary:
  label_ai: "AI summary"
  label_rules: "Summary"
  note_ai: "Written by the local AI from the rule results. It explains; it does not decide."
  note_rules: "Written from the rule results."
  pending: "The AI summary is being written; this one is from the rule results."
  source:
    AA_SUCCESS: "Account Aggregator data and the bank statement"
    AA_FAILURE: "the bank statement and details entered by hand"
  # one difference inside a check, with its values (handed to the model and used by the rules-written summary)
  difference: "{label}: {left} vs {right_label} {right}{note}"
  statement:
    COMPLETE: "read fully"
    PARTIAL: "read in part"
    UNREADABLE: "could not be read"
    INVALID: "not a bank statement"
    NONE: "not on file"
  instructions: |
    You explain a bank account verification result to a loan officer in plain, simple English.
    You get the case facts as JSON. "counts" says exactly how many checks passed, found a problem, or need a
    person: use those numbers, never guess. "problems_found" lists each failed check with "what_differs": the exact
    values that did not match (what was entered vs what the statement or Account Aggregator shows).
    "needs_a_person" lists each check that could not be confirmed, with why and what is missing.
    Write 2 to 5 short sentences, no lists, no headings. Start directly with the result:
    1. the result: "<passed> of <checks_run> checks passed for <applicant>", then how many found a problem and how
       many need a person (skip a count that is 0). Use the numbers in "counts" exactly;
    2. for EACH problem, one short sentence saying what differs with the given values, for example "Transaction <n>
       was entered as Credit but the statement shows Debit." Never write only "some details did not match";
    3. the items that need a person and why, in one sentence (group them when the reason is the same).
    Do NOT list the checks in "passed" and do NOT write a next step: the screen already shows both.
    If there is no "problems_found", say no check found a problem and never invent one; the same for
    "needs_a_person". Use only the facts given. Do not add any number, date or amount that is not in the facts;
    copy values exactly as given, in plain words (write "entered as X but the statement shows Y").
    Never say the loan or account is approved, rejected, safe, fake or fraud; the checks do not decide that.
    Do not mention JSON, rule codes like R1, or field names with underscores.
  # a summary containing any of these is refused (the rules-written one is shown instead)
  banned_words: [approved, approve, rejected, reject, fraud, fraudulent, fake, forged, guaranteed, definitely, safe to lend]
  # the rules-written summary: headline by the overall result + the open items + the next step
  fallback:
    PASS: "Every check that could run has passed for {applicant}."
    FAIL: "Some checks for {applicant} did not match and need attention."
    REVIEW_REQUIRED: "Nothing for {applicant} has failed, but some items still need a person before a final result."
    NOT_APPLICABLE: "There is not enough data yet to check {applicant}'s bank account."
    counted: "{passed} of {total} checks passed."
    problem: "{check}: {what}."
    open: "Needs a person: {items}."
    next: "Next step: {action}"
    final: "The agency has recorded the final result: {status}."

# every rule in easy words, by its status -- the screen's simple checklist (always shown, covers all eight)
plain:
  status: { PASS: "OK", FAIL: "Problem", REVIEW_REQUIRED: "Needs a person", NOT_APPLICABLE: "Not needed" }
  rules:
    R1:
      name: "Bank details"
      PASS: "Bank name, account number and account type match the statement."
      FAIL: "The bank details typed in the form do not match the statement."
      REVIEW_REQUIRED: "Some bank details could not be confirmed from the statement."
      NOT_APPLICABLE: "Bank details were not checked."
    R2:
      name: "Last 3 transactions"
      PASS: "The last 3 transactions in the form match the statement."
      FAIL: "One or more of the last transactions in the form do not match the statement."
      REVIEW_REQUIRED: "Some transactions are missing or could not be read, so they could not be confirmed."
      NOT_APPLICABLE: "Transactions were not checked."
    R3:
      name: "Statement looks genuine"
      PASS: "The statement file is readable and nothing suggests it was edited."
      FAIL: "The uploaded file is not a proper bank statement."
      REVIEW_REQUIRED: "The statement could not be fully read, or something about the file needs a closer look."
      NOT_APPLICABLE: "No statement file to check."
    R4:
      name: "Account belongs to customer"
      PASS: "The bank branch confirmed the account belongs to the customer."
      FAIL: "The bank branch said the account does not belong to the customer."
      REVIEW_REQUIRED: "Waiting for the bank branch to confirm the account belongs to the customer."
      NOT_APPLICABLE: "Ownership was not checked."
    R5:
      name: "Balances add up"
      PASS: "Opening balance, money in, money out and closing balance all add up."
      FAIL: "The balances on the statement do not add up."
      REVIEW_REQUIRED: "Balances could only be partly checked."
      NOT_APPLICABLE: "There were no balances to check."
    R6:
      name: "AA data vs statement"
      PASS: "The Account Aggregator data and the statement say the same thing."
      FAIL: "The Account Aggregator data and the statement do not agree."
      REVIEW_REQUIRED: "AA data and the statement agree where both could be read."
      NOT_APPLICABLE: "Only one source was available, so there was nothing to compare."
    R7:
      name: "Statement not reused elsewhere"
      PASS: "This statement has not been used in any other case."
      FAIL: "This statement has been used before."
      REVIEW_REQUIRED: "The same or a very similar statement is already in another case; please check why."
      NOT_APPLICABLE: "No statement file to compare."
    R8:
      name: "Overall"
      PASS: "Everything that could be checked is fine."
      FAIL: "Some checks found problems."
      REVIEW_REQUIRED: "Some items still need a person before a final result."
      NOT_APPLICABLE: "Nothing could be checked yet."
