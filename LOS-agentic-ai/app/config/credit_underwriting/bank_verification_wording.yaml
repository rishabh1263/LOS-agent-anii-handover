# =====================================================================================================================
# BANK VERIFICATION -- EVERY WORD THE USER READS, every rule name and every flag severity.
# The code holds only logic: change a sentence, a label or a severity here; no code change, no restart of the logic.
# {placeholders} are filled by the rule; keep them when rewording.
# STATUS: DEMO_DUMMY / UNCONFIRMED wording.
# =====================================================================================================================

common:
  statement: "Statement"
  aa_data: "AA data"
  not_in_source: "not in the {source}"
  form: "Application form"
  not_entered: "not entered on the form"
  not_on_statement: "not printed / not readable on the statement"
  not_confirmed: "read from the statement, not yet checked by the CPA"
  confirmed: "read from the statement and checked by the CPA"
  no_statement_missing: "Readable bank statement"
  date_format: "%d-%m-%Y"
  no_date: "no date"
  no_amount: "no amount"
  no_side: "no side"
  sides: { CREDIT: "Credit", DEBIT: "Debit" }
  join: ", "

# case statuses as the screens show them; `after_run` maps the R8 status of a run to the case status
case_status:
  after_run: { PASS: READY_FOR_FINALIZATION, FAIL: REVIEW_REQUIRED, REVIEW_REQUIRED: REVIEW_REQUIRED,
               NOT_APPLICABLE: REVIEW_REQUIRED }
  seeded: PENDING_VERIFICATION
  final: [POSITIVE, NEGATIVE, WAIVED]
  labels:
    PENDING_VERIFICATION: "Pending verification"
    READING: "Reading statement"
    READY_FOR_FINALIZATION: "Ready for agency finalization"
    REVIEW_REQUIRED: "Review required"
    POSITIVE: "Positive"
    NEGATIVE: "Negative"
    WAIVED: "Waived"

rules:
  R1:
    name: "Bank Details Matching"
    fields: { bank_name: "Bank name", account_number: "Account number", account_type: "Account type" }
    no_statement: "No readable bank statement, so the bank details could not be checked against it."
    pass: "Bank name, account number and account type match the statement."
    fail_one: "The {fields} on the form differs from the statement."
    fail_many: "The {fields} on the form differ from the statement."
    review: "Could not confirm the {fields}: missing on the form or not readable on the statement."
    masked_match: "the statement prints only the last {digits} digits; they match"
    masked_differ: "the visible digits on the statement differ"
    numbers_differ: "the account numbers differ"
    evidence: ["Application form", "Bank statement header"]
    flags:
      BANK_DETAILS_MISMATCH: { severity: MEDIUM }
      ACCOUNT_NUMBER_MISMATCH: { severity: HIGH }
  R2:
    name: "Latest Three Transactions Matching"
    row: "Transaction {n}"
    no_statement: "No readable bank statement, so the latest transactions could not be checked."
    no_rows: "No transactions could be read from the statement; they need manual entry and agency checking."
    no_rows_missing: "Statement transactions"
    only_n: "the statement has only {n} transaction(s)"
    incomplete: "incomplete: date, amount and debit / credit are all needed"
    pass: "All {n} entered transactions match the statement's latest transactions."
    fail: "{rows} not found among the statement's latest {n} transactions."
    review: "Some transaction rows are blank or incomplete, so they could not be confirmed."
    end_not_read: "the end of the statement was not read, so its latest transactions are not certain"
    review_end: "The end of the statement could not be read, so the latest transactions cannot be confirmed."
    end_not_read_missing: "The statement's last page (its latest transactions)"
    recent_unread: "a recent statement row could not be read, so the latest transactions are not certain"
    review_recent_unread: "A recent row of the statement could not be read, so the latest transactions cannot be confirmed."
    recent_unread_missing: "The statement's latest rows, typed from the statement and checked"
    not_found: "no transaction with this date and amount among the statement's latest {n}"
    differs_one: "the {parts} differs"
    differs_many: "the {parts} differ"
    parts: { date: "date", amount: "amount", direction: "debit / credit" }
    evidence: ["Application form", "Statement transactions (latest by date)"]
    flags:
      LATEST_TRANSACTION_MISMATCH: { severity: MEDIUM }
  R3:
    name: "Statement Integrity and Tampering Detection"
    no_file: "No statement file was provided, so its integrity is unknown."
    aa_only: "No statement uploaded: the account data came from the Account Aggregator (bank-sourced), so there is no file to check. Upload the statement to have it checked and compared with the AA data."
    no_file_missing: "Bank statement file"
    invalid: "The file is not a readable bank statement: {notes}"
    unreadable: "The statement could not be read: {notes}"
    unreadable_missing: "Readable bank statement (or manual entry checked by the agency)"
    readable: "Readable: {with_text} of {pages} page(s) carry text."
    producer: "Metadata: producer '{producer}'."
    in_period: "Every transaction falls inside the printed statement period."
    reader_note: "{note}"
    pass: "The statement is readable and nothing about the file looks edited."
    review: "Integrity signals need a person to check: {signals}"
    file_evidence: "{kind} file, {pages} page(s), {with_text} with text"
    flags:
      NOT_A_STATEMENT: { severity: MEDIUM, text: "The uploaded file is not a statement." }
      INCOMPLETE_EXTRACTION: { severity: LOW, text: "Only part of the statement could be read; the rest needs manual entry." }
      READ_FROM_SCAN: { severity: LOW, text: "The statement is a scan read by OCR; confirm the figures with the original." }
      EDITING_TOOL_IN_METADATA: { severity: MEDIUM, text: "The PDF metadata names an editing / conversion tool ({tool}). This is not proof of tampering; confirm the statement with the bank." }
      MODIFIED_AFTER_CREATION: { severity: MEDIUM, text: "The PDF was modified {days} day(s) after it was created." }
      TRANSACTION_OUTSIDE_PERIOD: { severity: MEDIUM, text: "{n} transaction(s) are dated outside the printed statement period." }
  R4:
    name: "Customer Account Ownership Verification"
    applicant: "Applicant"
    holder: "Holder on statement / AA"
    supporting_note: "supporting evidence only -- a printed name does not prove ownership"
    pass: "The agency's branch verification confirmed the applicant owns the account."
    fail: "The agency's branch verification did NOT confirm ownership."
    review: "Ownership is pending the agency's branch confirmation; the statement alone cannot prove it."
    review_missing: "Branch confirmation of account ownership"
    evidence: "Agency branch verification: {status}"
    flags:
      HOLDER_NAME_DIFFERS: { severity: MEDIUM, text: "The account holder name on the statement differs from the applicant's name." }
      OWNERSHIP_NOT_CONFIRMED: { severity: HIGH, text: "The branch did not confirm that the applicant owns this account." }
  R5:
    name: "Transaction Continuity and Balance Validation"
    source_statement: "statement"
    source_aa: "AA data"
    no_rows: "No transactions were available from the statement or AA, so balances could not be checked."
    no_rows_missing: "Statement transactions with balances"
    computed: "Opening + credits - debits"
    printed_closing: "Printed closing balance"
    off_by: "off by {amount}"
    running: "Running balances"
    printed: "{n} printed"
    breaks: "Breaks in the chain"
    break_row: "{date} {side} {amount}: balance {balance}, expected {expected}"
    nothing: "The {source} has no opening / closing balance and no running balances, so continuity cannot be checked."
    nothing_missing: "Opening and closing balance, or running balances"
    fail: "The {source}'s balances do not add up: {problems}"
    fail_closing: "opening + credits - debits {computed} vs printed closing balance {closing}"
    fail_running: "{n} running-balance break(s)"
    partial: "The running balances are consistent, but the {source} has no opening / closing balance to check the totals against."
    partial_missing: "Opening and closing balance"
    pass: "Opening + credits - debits equals the closing balance{running} ({source})."
    pass_running: " and every running balance follows"
    evidence: "Arithmetic over {n} transaction(s) from the {source}"
    flags:
      BALANCE_INCONSISTENT: { severity: HIGH }
  R6:
    name: "AA vs. Uploaded Statement Cross-Verification"
    fields: { bank_name: "Bank name", account_number: "Account number", account_type: "Account type", ifsc: "IFSC",
              account_holder: "Account holder", opening_balance: "Opening balance", closing_balance: "Closing balance",
              transactions: "Transactions" }
    aa_suffix: " (AA)"
    only: "Only {have} is available; the cross-check needs both AA data and a readable statement."
    have_aa: "AA data"
    have_statement: "the statement"
    have_none: "neither source"
    missing_or_masked: "missing or masked in one source"
    in_period: "{n} in common period"
    only_in_aa: "only in AA: {rows}"
    only_in_statement: "only in statement: {rows}"
    pass: "The AA data and the statement agree on the account details and every transaction in their common period."
    fail: "AA data and the statement differ on: {fields}."
    review: "AA data and the statement agree where both can be read; some fields are missing or masked in one source."
    evidence: ["Account Aggregator data", "Bank statement"]
    flags:
      SOURCE_MISMATCH: { severity: HIGH }
  R7:
    name: "Duplicate Statement and Document Reuse Detection"
    no_file: "No statement file, so there is nothing to compare for reuse."
    exact: "The identical file is already on file in {cases}."
    exact_tail: " This is a reason to check, not proof of fraud."
    similar: "A statement for the same account with the same transactions (different file) is on file in {cases}."
    similar_tail: " It may be a re-download or a reused document."
    pass: "No other case holds this statement (checked {n} statement(s) on file)."
    hash_evidence: "File fingerprint checked"
    fingerprint_evidence: "Content fingerprint: account + transactions"
    flags:
      EXACT_DUPLICATE_DOCUMENT: { severity: HIGH }
      SIMILAR_DOCUMENT: { severity: MEDIUM }
  R8:
    name: "Automated Risk Assessment and Explainable Reporting"
    nothing: "No rule could run: there is no data to verify yet."
    failed: "{n} check(s) failed: {rules}."
    review: "{n} check(s) need a person: {rules}."
    pass: "Every applicable check passed."
    counted: "{passed} of {applicable} applicable checks passed."
    next: "Next: {action}"
    mismatch: "{label}: {left} vs {right}"
    score_note: "checks_passed / checks_applicable counts rules; it is not a probability of fraud or ownership."

