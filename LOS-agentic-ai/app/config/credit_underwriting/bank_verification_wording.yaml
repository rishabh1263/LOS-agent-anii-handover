              flags: "Risk flags", missing: "Missing evidence", actions: "Human actions still required",
              decision: "Ownership and final decision", history: "Case history" }
  columns: { rule: "Rule", name: "Name", status: "Status", explanation: "Explanation", when: "When (UTC)",
             who: "Who", what: "What" }
  none: "None"
