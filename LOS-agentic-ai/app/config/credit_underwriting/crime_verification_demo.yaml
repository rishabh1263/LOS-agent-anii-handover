# ---- what the mock provider covers (the categories of a CrimeCheck-style legal risk report; years are illustrative)
coverage:
  - group: GENERAL_COURTS
    items:
      - { code: SUPREME_COURT, name: "Supreme Court", since: 1950 }
      - { code: HIGH_COURTS, name: "All High Courts", since: 1960 }
      - { code: CIVIL_COURTS, name: "Civil Courts (Junior, Senior, District)", since: 2005 }
      - { code: CRIMINAL_COURTS, name: "Criminal Courts (Magistrate and Sessions)", since: 2005 }
  - group: TRIBUNALS
    items:
      - { code: CONSUMER, name: "Consumer Courts", since: 1995 }
      - { code: CESTAT, name: "Customs, Excise and Service Tax Appellate Tribunal", since: 2000 }
      - { code: DRT, name: "Debt Recovery Tribunal", since: 2000 }
      - { code: DRAT, name: "Debt Recovery Appellate Tribunal", since: 2000 }
      - { code: ITAT, name: "Income Tax Appellate Tribunal", since: 2000 }
      - { code: NCLT, name: "National Company Law Tribunal", since: 2016 }
      - { code: SAT, name: "Securities Appellate Tribunal", since: 2000 }
      - { code: NGT, name: "National Green Tribunal", since: 2010 }
      - { code: NCLAT, name: "National Company Law Appellate Tribunal", since: 2016 }
      - { code: OTHER_TRIBUNALS, name: "Other Tribunals", since: 2005 }
  - group: DEFAULTER_LISTS
    items:
      - { code: CIBIL_DEFAULTERS, name: "Credit Bureau Defaulter List (A)", since: 2005 }
      - { code: CRIF_DEFAULTERS, name: "Credit Bureau Defaulter List (B)", since: 2010 }
      - { code: EPF_DEFAULTERS, name: "EPF Defaulter List", since: 2010 }
      - { code: EQUIFAX_DEFAULTERS, name: "Credit Bureau Defaulter List (C)", since: 2010 }
      - { code: MCA_DEFAULTERS, name: "MCA Defaulter List", since: 2010 }
  - group: OTHERS
    items:
      - { code: FIR, name: "First Information Report (FIR)", since: 2015 }

# ---- the mock provider's answer per scenario. findings: {coverage code: count}; clusters: {cluster: count}
#      outcome COMPLETED | PENDING | FAILED. fail_attempts: attempts that fail before the retry succeeds with `then`.
#      pending_polls: refreshes that stay pending before `then` (null = stays pending).
scenarios:
  NO_RISK:
    label: "No Risk"
    outcome: COMPLETED
    risk: NO_RISK
    findings: {}
    clusters: {}
  LOW_RISK:
    label: "Low Risk"
    outcome: COMPLETED
    risk: LOW_RISK
    findings: { CIVIL_COURTS: 1 }
    clusters: { CIVIL: 1 }
  AVERAGE_RISK:
    label: "Average Risk"
    outcome: COMPLETED
    risk: AVERAGE_RISK
    findings: { CIVIL_COURTS: 1, CONSUMER: 1, CRIMINAL_COURTS: 1 }
    clusters: { CIVIL: 1, FINANCIAL: 1, OTHER: 1 }
  HIGH_RISK:
    label: "High Risk"
    outcome: COMPLETED
    risk: HIGH_RISK
    findings: { CRIMINAL_COURTS: 2, DRT: 1, CIBIL_DEFAULTERS: 1 }
    clusters: { FINANCIAL: 2, STATUTORY: 1, OTHER: 1 }
  MULTIPLE_FINDINGS:
    label: "Multiple Findings"
    outcome: COMPLETED
    risk: HIGH_RISK
    findings: { HIGH_COURTS: 1, CIVIL_COURTS: 2, CRIMINAL_COURTS: 1, DRT: 1, NCLT: 1, EPF_DEFAULTERS: 1, FIR: 1 }
    clusters: { CIVIL: 2, FINANCIAL: 3, STATUTORY: 1, OTHER: 2 }
  VENDOR_FAILURE:
    label: "Vendor Failure"
    outcome: FAILED
    error: PROVIDER_UNAVAILABLE
    fail_attempts: 1          # the first attempt fails; a retry gets `then`
    then: NO_RISK
  PENDING:
    label: "Pending"
    outcome: PENDING
    pending_polls: null       # stays in progress
    then: NO_RISK

