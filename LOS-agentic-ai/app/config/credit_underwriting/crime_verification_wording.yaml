ai_summary:
  instructions: |
    You explain a crime record verification result to a credit officer in plain English.
    You get JSON: one entry per person: role, status, risk, total_cases_found (that person's total),
    sources_with_findings (how many sources), largest_sources (only the biggest few, not all), matter_types.
    Write at most {sentences} short sentences, no lists, no headings. Name every person in the JSON.
    Say each person's result separately, naming the role (Applicant, Co-Applicant) in every sentence; never merge them
    into one risk and never give one person's numbers to the other.
    A total is always total_cases_found; never add up largest_sources.
    Use only the numbers and words given. Never invent a case, a court, a number or a reason.
    A person with no matches: say no matches were found in the covered sources; never say the person has no record.
    Only an entry that has "result" instead of "risk" is failed or pending: for that person alone say the result
    is not available yet. Every entry with a "risk" HAS its result -- never call it pending or not available.
    Do not decide or recommend approval or rejection; the credit officer decides.
  # ONE person's point (config ai_summary.per_person): short, so each parallel call reads little (CPU prompt time)
  person_instructions: |
    Explain ONE person's crime record verification result to a credit officer in one short plain-English sentence.
    Start with the role exactly as given. Use only the numbers and words in the JSON; total_cases_found is the total.
    Never invent a case, court, number or reason. Do not approve, reject or recommend.
  # words that say a result is missing: refused in a sentence about a person whose result is in
  pending_words: [not available, not yet available, pending, awaiting, still in progress, not yet received]
  banned_words: [approved, approve, rejected, reject, guilty, convicted, criminal record, clean record, fraud,
                 fraudster, safe, trustworthy, innocent, recommend]
  labels:
    ai: "AI summary"
    rules: "Summary"
    pending: "Writing the AI summary…"
    ai_note: "Written by AI from the results and checked against them. It explains; the credit officer decides."
    rules_note: "Written from the results."
    clean: "Clean result"
    review: "Needs review"
  rules:
    person: "{role}: {status}{risk}."
    risk: " — {risk}, {cases} case(s) found{sources}"
    sources: " ({sources})"
    no_match: " — no matches in the covered sources"

