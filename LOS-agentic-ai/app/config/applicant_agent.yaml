# =============================================================================
# Applicant Agent — FOS copilot configuration
#
# BUSINESS POLICY LIVES HERE, NOT IN A PROMPT. The readiness gate, the
# document checklist and the downstream routing table are all decisions a
# lender makes and changes; putting them in the system prompt would make them
# invisible to review and unenforceable when the model paraphrases.
#
# Every value is read at request time through app/agents/applicant/config.py,
# so editing this file takes effect on the next request.
# =============================================================================

agent:
  name: "Applicant Agent"
  enabled: true

  # The summary sentence only. Every fact it states comes from a tool result.
  #
  # OFF BY DEFAULT on the current CPU deployment (a product decision taken on
  # measurement): with qwen2.5:3b, knowledge phrasing took ~1.9 s P50 against
  # ~28 ms deterministic, 7 of 16 calls hit the 2.5 s budget, only 4 of 16
  # outputs were used, and content inspection found invented attributes and
  # changed meanings (all caught by the fidelity checks, at the cost of the
  # latency). The capability stays pluggable: APPLICANT_AGENT_LLM_ENABLED=true
  # turns it on for hardware/models that measure better. Live-state answers are
  # never phrased by the model either way (model_routing.never below).
  llm_enabled: false
  temperature: 0.1

  # Deterministic answers skip the model entirely. A single-fact question --
  # "is PAN verified?" -- is answered from the tool result, because sending it
  # to a model adds a second of latency and a chance of paraphrasing the fact.
  llm_for_simple_intents: false

  # MODEL POLICY (acceptance pass): the one-sentence case summary on a FOS
  # answer is the computed text; the model does not phrase it. Measured on
  # qwen2.5:3b it cost ~1 s per deterministic case answer for the same facts.
  llm_for_case_summary: false

# -----------------------------------------------------------------------------
# WORKFLOW
#
# The FOS-stage states. Configurable because not every lender uses these four,
# and an organisation that adds one should not have to edit Python.
# -----------------------------------------------------------------------------
workflow:
  states:
    - APPLICATION_CREATED
    - DOCUMENT_COLLECTION
    - BASIC_DOCUMENT_VERIFICATION
    - READY_FOR_CPA

# -----------------------------------------------------------------------------
# DOCUMENT CHECKLIST
#
# What each product requires before the case may leave the FOS stage. The
# checklist is per product, with `default` used when no product is set yet.
#
# `any_of` groups alternatives: one satisfies the slot. Address proof is the
# usual case -- a licence and a passport are equally good evidence of address.
# -----------------------------------------------------------------------------
# A slot is either `required` (blocks the CPA handoff) or `optional` (tracked
# and reported, never blocking). ADDING A TYPE DOES NOT MAKE IT MANDATORY:
# a new slot is only required if it is listed under `required`, so the
# taxonomy can grow ahead of the policy.
#
# `accepts` names the document types the LOS pipeline may classify a file as
# to satisfy the slot. Several types in one slot means any of them will do --
# a licence and a passport are equally good evidence of address.
documents:
  # Used when no product is set yet, so a case still has something to be
  # measured against rather than appearing complete by accident.
  default:
    required:
      - slot: PAN
        accepts: [PAN]
        reason: >-
          PAN is the applicant's identity proof at the FOS stage: it establishes
          who is applying, and its name, date of birth and PAN number are what the
          other documents are matched against in the KYC check.
      - slot: ADDRESS_PROOF
        accepts: [DRIVING_LICENCE, PASSPORT, VOTER_ID]
        reason: >-
          An officially valid document evidencing the applicant's address. Any
          one of the accepted types satisfies the requirement.

  # PERSONAL_LOAN IS RESOLVED FROM config/policies/personal_loan.yaml.
  #
  # That file is the authority: it carries the amount bands, the conditional
  # rules and the version a case is pinned to, none of which can be
  # expressed here. This entry is the FALLBACK used only if the policy file
  # is missing or will not parse, and it is deliberately identical to that
  # file's BASE requirements -- two files describing the same product will
  # drift, and when they did, /config advertised one checklist while real
  # cases were measured against another.
  #
  # Do not add an amount-dependent slot here. It cannot be conditional in
  # this file, so it would be imposed on every application.
  PERSONAL_LOAN:
    required:
      - slot: PAN
        accepts: [PAN]
        reason: >-
          PAN is the applicant's identity proof at the FOS stage: it establishes
          who is applying, and its name, date of birth and PAN number are what the
          other documents are matched against in the KYC check.
      - slot: ADDRESS_PROOF
        accepts: [DRIVING_LICENCE, PASSPORT, VOTER_ID]
        reason: >-
          An officially valid document evidencing the applicant's address. Any
          one of the accepted types satisfies the requirement.
      - slot: BANK_STATEMENT
        accepts: [BANK_STATEMENT]
        reason: >-
          A bank statement evidences the applicant's banking relationship and
          is passed to the credit stage for assessment.
      - slot: SIGNATURE
        accepts: [SIGNATURE]
        reason: >-
          Mandatory for every product (owner 2026-10-09). A photo of the applicant's signature for the application record. It is
          checked by the signature service; without a reference specimen it is
          REVIEW, never PASS.
    optional: []

  # `reason` is what the Copilot says when asked WHY a document is needed --
  # what the document is used for in this process, never a lending rule.
  HOME_LOAN:
    required:
      - slot: PAN
        accepts: [PAN]
        reason: >-
          PAN is the applicant's identity proof at the FOS stage: it establishes
          who is applying, and its name, date of birth and PAN number are what the
          other documents are matched against in the KYC check.
      - slot: BANK_STATEMENT
        accepts: [BANK_STATEMENT]
        reason: >-
          A bank statement evidences the applicant's banking relationship and
          is passed to the credit stage for assessment.
      - slot: ADDRESS_PROOF
        accepts: [DRIVING_LICENCE, PASSPORT, VOTER_ID]
        reason: >-
          An officially valid document evidencing the applicant's address. Any
          one of the accepted types satisfies the requirement.
      # Mandatory for every product (owner 2026-10-09), as for Personal Loan; verified on its own by the
      # signature service (REVIEW without a specimen), never matched against the other documents
      - slot: SIGNATURE
        accepts: [SIGNATURE]
        reason: >-
          Mandatory for every product. A photo of the applicant's signature for the application record. It is
          checked by the signature service; without a reference specimen it is REVIEW, never PASS.
    optional:
      - slot: ITR
        accepts: [ITR]
        reason: Income tax returns evidence declared income for the credit stage.
      - slot: SALARY_SLIP
        accepts: [SALARY_SLIP]
        reason: Salary slips evidence current salaried income for the credit stage.
      - slot: EMPLOYMENT_PROOF
        accepts: [EMPLOYMENT_PROOF]
        reason: Employment proof evidences the applicant's current employer.

# The FOS-stage taxonomy. Naming a type here makes it selectable on upload and
# renderable in a dropdown; it does NOT make it required anywhere. A product
# becomes subject to a type only by listing a slot that accepts it above.
document_types:
  - PAN
  - AADHAAR
  - DRIVING_LICENCE
  - PASSPORT
  - VOTER_ID
  - BANK_STATEMENT
  - SALARY_SLIP
  - ITR
  - FORM_16
  - EMPLOYMENT_PROOF
  # PHOTO removed: the signature photo (SIGNATURE, verified by the signature
  # service) takes its place on the checklists.
  - SIGNATURE

# -----------------------------------------------------------------------------
# READINESS GATE
#
# "Is this complete enough to hand to CPA?" -- NOT "will the loan be approved?".
# Each rule can be switched off, and switching one off is reported in the
# response rather than silently changing the verdict.
# -----------------------------------------------------------------------------
readiness:
  require_applicant_fields: true
  require_application_fields: true
  require_all_documents: true
  require_documents_verified: true

  # A document sitting in REVIEW blocks the handoff. Set false where a lender
  # lets CPA adjudicate reviews instead of the FOS.
  block_on_review: true

  # CO-APPLICANT MANDATORY DOCUMENTS (Phase 3 step 5b). Enforced ONLY while
  # LOS_COAPP_MANDATORY_DOCS=true (default off). One slot each; ANY ONE accepted
  # type satisfies it, matched against the co-applicant's own documents and
  # verified by the existing OCR + verification + KYC flow. Confirmed 2026-10-07:
  # ONLY PAN, address proof and employment proof -- no bank statement.
  #   accepts_self_employed: added to `accepts` (the application's employment
  #   type is the applicant's, so it cannot choose for the co-applicant).
  # NOTE: UTILITY_BILL, EMPLOYMENT_LETTER, OFFER_LETTER, EMPLOYEE_ID,
  # BUSINESS_REGISTRATION and GST_CERTIFICATE are not yet classifiable types.
  co_applicant_documents:
    - slot: PAN
      accepts: [PAN]
    - slot: ADDRESS_PROOF
      accepts: [AADHAAR, PASSPORT, DRIVING_LICENCE, VOTER_ID, UTILITY_BILL]
    - slot: EMPLOYMENT_PROOF
      accepts: [SALARY_SLIP, EMPLOYMENT_LETTER, OFFER_LETTER, EMPLOYEE_ID]
      accepts_self_employed: [BUSINESS_REGISTRATION, GST_CERTIFICATE, ITR]

  # MANDATORY SIGNATURE (Phase 3 step 5c). Enforced ONLY while
  # LOS_SIGNATURE_MANDATORY=true (default off), for the applicant and every
  # co-applicant: a signature whose PRESENCE check (blank / handwritten, never
  # matched against another signature) is VERIFIED. REJECTED or REVIEW blocks.
  # GRANDFATHERED: applies only to cases CREATED at or after activation_date
  # (ISO date or datetime; no timezone = UTC). Set it on the day the flag is
  # turned on. Older cases are listed by scripts/report_signature_gaps.py
  # instead of being blocked. Flag on with no valid date FAILS CLOSED: every
  # case reports SIGNATURE_RULE_MISCONFIGURED until the date is set.
  signature_mandatory:
    activation_date: "2026-10-08"   # LOS_SIGNATURE_MANDATORY turned on this day

# -----------------------------------------------------------------------------
# PERMISSIONS
#
# Scope names checked against the JWT's `scope` / `scp` claim. Enforced in the
# tool layer, outside the model, so no prompt can grant one.
# -----------------------------------------------------------------------------
permissions:
  enforce: true

  # A token carrying this scope satisfies every read below. Convenience for
  # service accounts; it grants no write.
  read_all_scope: "los.read"

  # The service scope that may read and write ANY applicant's case. Every
  # other caller reaches only the applicants and cases its own subject
  # created (app/security/access.py).
  write_all_scope: "los.write"

  read:
    applicant: "read_applicant"
    application: "read_application"
    documents: "read_documents"
    verification: "read_verification"
    pending_items: "read_pending_items"
    next_action: "read_next_action"

  write:
    create_applicant: "create_applicant"
    update_applicant: "update_applicant"
    create_application: "create_application"
    upload_document: "upload_document"

  # Never served by this agent whatever scope a token carries. Listed so the
  # denial is a configured decision rather than an accident of omission.
  denied:
    - credit_decision
    - risk_analysis
    - kyc_decision
    - rcu_analysis

# -----------------------------------------------------------------------------
# OUT-OF-SCOPE ROUTING
#
# Where a question belongs when it is not the FOS stage's to answer. The agent
# names the destination and answers nothing on its behalf.
# -----------------------------------------------------------------------------
routing:
  CREDIT_SCORE:      { route_to: CREDIT_AGENT,   message: "Credit and bureau information is handled by the downstream Credit process.",
                       suggestions: ["What is still pending on my case?", "What stage is my application at?"] }
  RISK:              { route_to: RISK_AGENT,     message: "Risk scoring is handled by the downstream Risk process.",
                       suggestions: ["What is still pending on my case?", "What stage is my application at?"] }
  KYC_DECISION:      { route_to: KYC_AGENT,      message: "The full KYC decision is handled by the downstream KYC process.",
                       suggestions: ["What is still pending on my case?", "What stage is my application at?"] }
  RCU_FRAUD:         { route_to: RCU_AGENT,      message: "RCU and fraud investigation is handled by the downstream RCU process.",
                       suggestions: ["What is still pending on my case?", "What stage is my application at?"] }
  FINANCIAL_ANALYSIS: { route_to: CREDIT_AGENT,   message: "Bank statement and income analysis is handled by the downstream Credit process.",
                       suggestions: ["What is still pending on my case?", "What stage is my application at?"] }
  LOAN_DECISION:     { route_to: DECISION_AGENT, message: "The lending decision is made downstream, after CPA.",
                       suggestions: ["What is still pending on my case?", "Is my case ready for CPA?"] }
  # DOMAIN-ADJACENT (scope policy): a reason, a redirect, and what to ask instead.
  ELIGIBILITY_AMOUNT: { route_to: CREDIT_AGENT,  message: "How much you can borrow, and when it is disbursed, are worked out by the credit team after CPA, not at this stage.",
                        suggestions: ["What loan amount did I apply for?", "What is still pending on my case?"] }
  LOAN_TERMS:        { route_to: CREDIT_AGENT,   message: "Interest rate, EMI and fees are set when the loan is sanctioned after the credit assessment, so I can't quote or change them here. Your relationship manager can discuss terms.",
                       suggestions: ["What is my loan amount and tenure?", "What is still pending on my case?"] }
  INVESTMENT_ADVICE: { route_to: NONE,           message: "I can't give investment or financial advice. I'm set up only for your loan application.",
                       suggestions: ["What stage is my application at?", "Which documents are pending?"] }
  PRODUCT_ADVICE:    { route_to: NONE,           message: "I can't recommend which loan to choose, your relationship manager can help with that. I can tell you what each product needs.",
                       suggestions: ["What documents do I need for a personal loan?", "What documents do I need for a home loan?"] }

# -----------------------------------------------------------------------------
# MCP RUNTIME -- how the Copilot reaches its case tools (app/mcp/runtime.py)
# -----------------------------------------------------------------------------
# mode:
#   in_process -- await the capability coroutines directly (no MCP messages).
#                 The safe local default: nothing to start.
#   protocol   -- real MCP: JSON-RPC initialize / tools/call against the case
#                 MCP server (app/mcp/case_server.py), which re-checks the
#                 caller's scopes and case ownership itself.
# transport (protocol mode only):
#   memory -- the server in this process, over MCP in-memory streams
#   stdio  -- the server as a child process (python -m app.mcp.case_server)
#   http   -- a separately deployed server at server_url (streamable HTTP)
# fallback: what protocol mode does when the MCP server cannot be reached.
#   fail       -- the tool call fails (the answer names the gap). Production.
#   in_process -- run the capability directly; the trace says so.
# Environment overrides: LOS_MCP_MODE, LOS_MCP_TRANSPORT, LOS_MCP_SERVER_URL,
# LOS_MCP_FALLBACK, LOS_MCP_MAX_RESULT_BYTES, LOS_MCP_ALLOWED_TOOLS.
#
# IDENTITY: every protocol call carries the caller's own signed JWT in
# `_meta.authorization`; the server re-validates it (JWKS, issuer, audience,
# expiry) and re-authorises scope and ownership itself. No identity the
# client asserts is trusted. The server needs the same JWT_JWKS_URL,
# JWT_ISSUER and JWT_AUDIENCE as the API.
#
# PRODUCTION PROFILE (set in the deployment environment, not here, so a
# local checkout needs nothing running):
#   LOS_MCP_MODE=protocol
#   LOS_MCP_TRANSPORT=http          # server: python -m app.mcp.case_server --http
#   LOS_MCP_SERVER_URL=https://<case-mcp-host>/mcp
#   LOS_MCP_FALLBACK=fail           # never silently bypass the boundary
# /ready reports the MCP path and returns 503 when protocol mode is
# MISCONFIGURED or UNAVAILABLE without an explicit in_process fallback.
mcp:
  mode: in_process
  transport: memory
  server_url: "http://127.0.0.1:8030/mcp"
  call_timeout_seconds: 5.0
  connect_timeout_seconds: 20.0
  fallback: fail
  # The largest tool result carried either way; larger is refused.
  max_result_bytes: 262144
  # Narrow the server's tools (never widen past the read contracts).
  # Empty: every read contract.
  allowed_tools: []

# -----------------------------------------------------------------------------
# TIMEOUTS
# -----------------------------------------------------------------------------
timeouts:
  tool_seconds: 5.0

  # THE COPILOT'S OWN BUDGET, and deliberately not the LOS summary's 1.5 s.
  #
  # These are different surfaces. The LOS summary is one sentence appended to
  # a document-processing response, where a model that cannot finish inside
  # 1.5 s is not worth waiting for. This is an interactive question a field
  # officer asked and is waiting on, and where the whole request does nothing
  # else.
  #
  # Measured on the reference host, the same copilot prompt at four different
  # output caps (4 generations each):
  #
  #     max_tokens   median    max     within 1.5 s
  #      48          2525 ms  2911 ms     0/4
  #      64          2293 ms  2619 ms     0/4
  #      96          2356 ms  2504 ms     0/4
  #     160          2213 ms  2515 ms     0/4
  #
  # Cost is flat across the caps, so it is prompt processing rather than
  # output length: 1.5 s could not be met by shortening the answer. 3 s clears
  # the measured maximum with room, and overrunning it still costs only the
  # phrasing -- the deterministic answer is already computed.
  llm_seconds: 3.0

  total_seconds: 30.0

# -----------------------------------------------------------------------------
# UNIVERSAL COPILOT
#
# How the conversational layer understands, composes and checks an answer.
# Every key below is read at request time by app/agents/applicant/config.py
# (`chatbot()` and the typed accessors beside it); nothing here is decorative.
#
# THE ORDER OF AUTHORITY IS FIXED IN CODE, NOT HERE: case records, then tool
# results, then specialist-agent results, then knowledge. The model only ever
# phrases facts already established -- it cannot change a status, a decision
# or a verdict, and the validator below rejects any answer that tries.
# -----------------------------------------------------------------------------
chatbot:
  # SCORES IN THE CHAT TEXT. Off: an answer says "KYC needs review because the
  # name differs", never "the recorded score is 13" or "(score 100, confidence
  # 90)" -- internal numbers read as backend output to the person chatting
  # (bug report 2026-10-05). The numbers stay in the structured response
  # fields (kyc.score, verification.documents_processed[].score) for a
  # frontend that chooses to show them. APPLICANT_AGENT_SHOW_SCORES overrides.
  show_scores: false

  llm:
    # provider/model are resolved by app/llm/provider.py (OLLAMA_* env);
    # named here so the configuration says what it runs against.
    provider: ollama
    model: qwen2.5:3b
    # Override agent.temperature and timeouts.llm_seconds when set.
    temperature: 0.1
    # 2-3 s RESPONSE TARGET: the handbook-phrasing call gets at most 2.5 s;
    # when the model cannot finish in time the retrieved passage is published.
    timeout_seconds: 2.5
    max_output_tokens: 180

  # Phase 3: WHO PHRASES A CASE ANSWER when retrieval added nothing.
  # case_answers: true -- Qwen phrases the structured answer from the
  #   evidence packet, ONCE per question (the agent then skips its own model
  #   call), and `check_composed` validates it; a rejected or late phrasing
  #   falls back to the structured answer. Recorded values that are quoted
  #   (review reasons, names) are never handed to the model.
  # timeout_seconds -- measured on this deployment's qwen2.5:3b via Ollama:
  #   ~4.8 s cold, 1.6-2.0 s warm. 6.0 covers a cold start.
  compose:
    # false -- MODEL POLICY (acceptance pass): a case / status / stage /
    #   profile answer is a recorded fact and is published as built, with no
    #   model call; the model phrases knowledge answers only. Measured with
    #   case_answers: true on qwen2.5:3b: p50 860 ms, p95 2.5 s, and the
    #   accepted phrasing was the structured sentence in every sampled case.
    case_answers: false
    # 2-3 s RESPONSE TARGET (measured on qwen2.5:3b, CPU: a NEW prompt costs
    # ~8.5 ms/token to evaluate and generation runs ~18 tokens/s). The model
    # is used when it can finish inside the budget; otherwise the recorded
    # (deterministic) answer is published. Ollama aborts an abandoned call,
    # so a timeout never queues the next request.
    timeout_seconds: 2.5
    request_budget_seconds: 2.8
    # What a knowledge (handbook) phrasing call is shown -- smaller prompt,
    # faster answer.
    knowledge_passages: 2
    knowledge_context_chars: 700

  response:
    # Phase 3: at most TWO sentences by default. The character ceiling is a
    # guard, not a target -- the prompts ask for ~350 -- because a hard
    # count must never cost a required fact.
    max_sentences: 2
    max_characters: 500

  grounding:
    expose_internal_ids: false
    expose_internal_reason_codes: false

  validation:
    enabled: true
    reject_hallucination: true          # unsupported numbers / statuses / names
    reject_missing_required_facts: true # the reason, the names, the pending document
    reject_internal_id_leak: true
    reject_status_change: true          # a hold the record states must be stated
    # One constrained retry after a rejection, told what was wrong. Off by
    # default: each attempt costs a model call on an interactive request.
    regenerate_attempts: 0

  fallback:
    # What replaces a model answer that failed or was rejected. Only
    # `structured_answer` is supported: the deterministic answer built from
    # the records is always computed first.
    llm_failure: structured_answer
    validation_failure: structured_answer
    rag_failure: case_or_structured_answer

  # The display name of each LOS stage, in answers. A stage added to the
  # stage registry and named here needs no chatbot change.
  stages:
    labels:
      FOS: FOS
      CPA: CPA
      CREDIT: Credit
      RCU: RCU
      BOPS: BOPS
      HOPS: HOPS
      DISBURSEMENT: Disbursement

    # WHAT EACH STAGE CAN ANSWER. Read by app/agents/los/stage_registry.py
    # on every request. A capability is honoured only if this build has a
    # provider for it (stage_registry.PROVIDERS); any other name is ignored
    # and logged, so configuration can switch a capability off but can never
    # claim one that does not exist. `not_available` names stage-specific
    # information nothing produces yet -- the Copilot says so plainly.
    # `enabled: false` withdraws every capability from a stage.
    capabilities:
      FOS:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge, eligibility,
                       case_facts, checklist, readiness]
      CPA:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge]
        not_available: [CPA assessment details]
      CREDIT:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge, eligibility]
        not_available: [credit decision details]
      RCU:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge]
        not_available: [RCU investigation findings]
      BOPS:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge]
        not_available: [BOPS processing details]
      HOPS:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge]
        not_available: [HOPS approval details]
      DISBURSEMENT:
        enabled: true
        capabilities: [stage_status, stage_history, document_requirements,
                       pending_items, next_action, document_status,
                       case_history, process_knowledge]
        not_available: [disbursement details]

    # Which capability each case question needs. A question whose
    # capability the current stage lacks is answered with the stage and a
    # plain "not available for this stage" -- never with another stage's
    # answer. Intents not listed need no stage capability.
    intent_capabilities:
      READINESS: readiness
      COMPLETENESS: readiness
      ELIGIBILITY: eligibility
      DOCUMENTS_REQUIRED: document_requirements
      DOCUMENTS_MISSING: pending_items
      DOCUMENTS_PENDING: pending_items
      PENDING_ITEMS: pending_items
      NEXT_ACTION: next_action
      CASE_HISTORY: case_history

  # Short forms, abbreviations, common misspellings and Hinglish, rewritten to
  # full words BEFORE classification. Whole words only, longest first. A word
  # that is not here but is close to a vocabulary word (or to a configured
  # document type or checklist slot) is corrected by similarity -- see
  # app/agents/applicant/normalize.py.
  normalization:
    enabled: true
    fuzzy: true
    synonyms:
      dis: this
      intrest: interest
      intrst: interest
      scor: score
      dat: that
      abt: about
      wat: what
      wht: what
      docs: documents
      doc: document
      dox: documents
      documnts: documents
      app: application
      # THE CO-APPLICANT, however it is shortened. Longer than "app", so it
      # is rewritten first and "co-app" never becomes "co-application".
      co-app: co-applicant
      co app: co-applicant
      coapp: co-applicant
      coapplicant: co-applicant
      co-apps: co-applicants
      appln: application
      applicaton: application
      stmt: statement
      stmnt: statement
      statemnt: statement
      bank stmt: bank statement
      acct: account
      a/c: account
      addr: address
      add proof: address proof
      address doc: address proof
      pan card: pan
      aadhar card: aadhaar
      aadhaar card: aadhaar
      aadhar: aadhaar
      dl: driving licence
      driving license: driving licence
      sal slip: salary slip
      salary slips: salary slip
      payslip: salary slip
      pay slip: salary slip
      verfied: verified
      varified: verified
      r: are
      u: you
      ur: your
      pls: please
      plz: please
      wat: what
      wats: what is
      whats: what is
      what's: what is
      hows: how is
      where's: where is
      y: why
      stg: stage
      shw: show
      sho: show
      al: all
      custmer: customer
      custmers: customers
      costumer: customer
      costumers: customers
      stge: stage
      stgae: stage
      satge: stage
