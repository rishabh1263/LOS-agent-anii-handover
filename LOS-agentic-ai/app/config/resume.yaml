# ---- qualifications (moved from code 2026-10-16) -------------------------------------------------------------------
# checked in this order; the first level whose pattern matches a line is that line's level (regex, upper-case text)
qualification_levels:
  - {level: phd, pattern: '\b(?:PH\.?\s?D|DOCTORATE|DOCTOR OF PHILOSOPHY)\b'}
  - {level: post_graduation, pattern: '\b(?:M\.?\s?TECH|M\.?\s?E\b|MBA|MCA|M\.?\s?SC|M\.?\s?COM|M\.?\s?A\b|PGDM|PGDBA|MASTER(?:S|''S)?|POST[\s-]?GRADUAT\w*|LL\.?\s?M|M\.?\s?PHARM|CHARTERED ACCOUNTANT|PG DIPLOMA|P\.?G\.?D\.?B\.?M)'}
  - {level: graduation, pattern: '\b(?:B\.?\s?TECH|B\.?\s?E\b|B\.?\s?SC|B\.?\s?COM|BCA|BBA|BMS|BBM|B\.?\s?A\b|BACHELOR\w*|UNDERGRADUATE DEGREE|LL\.?\s?B|B\.?\s?PHARM|B\.?\s?ED|MBBS|B\.?\s?ARCH|B\.?\s?DES|GRADUATION|GRADUATE)'}
  - {level: diploma, pattern: '\b(?:DIPLOMA|POLYTECHNIC|ITI)\b'}
  - {level: 12th, pattern: '\b(?:12\s?TH|XII|HSC|H\.S\.C|HIGHER SECONDARY|INTERMEDIATE|SENIOR SECONDARY|CLASS 12|STD\.? 12|PUC|PRE[\s-]?UNIVERSITY|10\s?\+\s?2)\b'}
  - {level: 10th, pattern: '\b(?:10\s?TH|SSC|S\.S\.C|MATRICULATION|MATRIC|SECONDARY SCHOOL|CLASS 10|STD\.? 10|HIGH SCHOOL|X\b(?=\s*(?:STD|STANDARD|CLASS|\(|,|\|)))'}
# "Graduation: 2026" / "Year of Graduation 2015" is a LABEL for the year of the degree named nearby, never a degree of
# its own (a real resume, 2026-10-19: "B.Sc. Information Technology" + "SIA College | CGPA 9.7 | Graduation: 2026" read
# as two graduations, the first without its year)
graduation_label: '\b(?:YEAR\s+OF\s+)?GRADUATION\s*(?:YEAR|DATE)?\s*[:\-]?\s*(?:[A-Z]{3,9}\.?\s*|\d{1,2}\s*[/.-]\s*)?(?:19|20)\d{2}\b'
# (2026-10-19: "Graduation 12/2020" is the DATE of a degree named on another line, never a bachelor's of its own)
not_a_qualification: '^\W*(?:RELEVANT\s+)?(?:COURSE\s?WORK|COURSES?|SUBJECTS?|THESIS|DISSERTATION|PUBLICATIONS?|RESEARCH|PAPER|PROJECTS?)\b|COURSEWORK:|^\W*GRADUATION\s*(?:DATE|YEAR|ON)?\s*[:\-]?\s*(?:(?:\d{1,2}\s*[/.-]\s*)?(?:19|20)\d{2}|[A-Z]{3,9}\.?\s*(?:19|20)\d{2})\W*$'
institution_words: [university, college, institute, school, board, vidyalaya, academy, polytechnic, iit, nit, vidyapeeth,
                    mahavidyalaya, cbse, icse, state board, kendriya]
pursuing_words: [pursuing, expected, appearing, ongoing, currently studying, final year, persuing]
# roles that are not a full-time job: beside a job they are not an overlap; excluded from total experience
not_full_time_words: [intern, internship, interned, volunteer, volunteering, part time, part-time, freelance, freelancer,
                      consultant, contract, contractual, tutor, tutoring, teaching assistant, research assistant,
                      graduate assistant, student, board member, member, peer, ambassador, fellow, fellowship,
                      apprentice, apprenticeship, trainee, club, society, nss, ncc, adjunct, visiting]
# a short line naming its section ("Relevant Experience", "Additional Experience")
heading_keywords: {experience: experience, employment: experience, education: education, academic: education,
                   qualification: education, skill: skills, certification: certifications, project: projects,
                   language: languages, personal: personal}

# ---- limits ------------------------------------------------------------------------------------------------------------
# a photo / scanned page is read by OCR: 1-2 s on an idle laptop, 7-10 s on a busy one (measured 2026-10-19) -- past
# this the call answers 504 PROCESSING_TIMEOUT. Env RESUME_TIMEOUT_SECONDS overrides.
limits:
  timeout_seconds: 60
