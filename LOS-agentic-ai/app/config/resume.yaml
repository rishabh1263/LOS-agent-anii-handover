designation_words: [officer, manager, executive, engineer, analyst, associate, assistant, intern, developer, consultant,
                    lead, head, director, sales, relationship, clerk, accountant, supervisor, agent, advisor, adviser,
                    representative, trainee, specialist, coordinator, co-ordinator, teller, cashier, operator,
                    technician, administrator, admin, architect, designer, tester, programmer, president, vp,
                    founder, partner, auditor, inspector, collector, collection, recovery, underwriter, processor,
                    telecaller, tele caller, caller, team leader, tl, incharge, in-charge, controller, secretary,
                    receptionist, teacher, lecturer, professor, faculty, trainer, nurse, doctor, pharmacist, chemist,
                    driver, field, credit, loan, branch, territory, area, zonal, regional, cluster, deputy, senior,
                    junior, chief, principal, staff, member, apprentice, fellow, scientist, researcher, writer,
                    editor, marketing, business development, bde, bdm, rm, sm, asm, dsa, cro, fos]
# joins between designation and employer on one line ("Sales Officer at HDFC Bank")
role_employer_joins: [at, with, in, for, '@']

# ---- CTC ---------------------------------------------------------------------------------------------------------
ctc:
  lakh_words: [lpa, lakhs per annum, lakh per annum, lakhs, lakh, lacs, lac, l, lpa.]
  crore_words: [cr, crore, crores]
  thousand_words: [k, thousand]
  monthly_words: [per month, p.m, pm, monthly, /month, / month, a month, month]
  annual_words: [per annum, p.a, pa, annually, /annum, per year, yearly, a year, annual]
  not_a_number: [negotiable, as per company norms, as per industry standards, as per company standards,
                 as per norms, best in industry, open, not disclosed, confidential]

# ---- notice period ------------------------------------------------------------------------------------------------
notice:
  immediate_words: [immediate, immediately, immediate joiner, available immediately, can join immediately, none, nil,
                    no notice, 0 days, zero]
  serving_words: [serving, serving notice, currently serving]

# ---- employment gaps ------------------------------------------------------------------------------------------------
gaps:
  report_months: 6              # a gap of at least this many months between two full-time jobs is reported
  review_months: null           # a gap this long sends the resume to MANUAL_REVIEW; null = reported only

