# RESUME READING CONFIG (2026-10-16) -- read by app/agents/resume/parse.py and reader.py. Every word list the resume
# parser uses lives here, never in code: add a heading, a label spelling, a city or a job-title word here.
#
# Matching is case-insensitive and ignores spacing / punctuation inside a label ("D.O.B", "Date of Birth",
# "DateOfBirth" are one label). A value is taken ONLY from its own label or its own shape: nothing is guessed.

# ---- what the API returns (owner 2026-10-21: the resume API gives ONLY the candidate's name) ------------------------
# the keys of `fields` the API sends back; every other read value stays inside the service (the checks still use them)
api_fields: [name]
# fields only with VERIFIED; any other status sends "fields": null (a failed verification extracts nothing)
extract_only_when_verified: true

# ---- what is NEVER returned (data minimisation, owner 2026-10-16: father's name and gender skipped) -----------------
# lines carrying these labels are dropped from every returned free text (job / education text, address)
never_return_labels: [father, "father's name", fathers name, "father name", mother, "mother's name", husband, spouse,
                      gender, sex, marital status, religion, caste, category, nationality, blood group, height, weight,
                      pan, pan no, pan number, aadhaar, aadhar, aadhaar no, uid, passport, passport no, passport number,
                      bank account, account no, account number, ifsc]
# identity numbers masked wherever they appear in returned text
mask_patterns:
  pan: '\b[A-Z]{5}[0-9]{4}[A-Z]\b'
  aadhaar: '\b[2-9][0-9]{3}\s?[0-9]{4}\s?[0-9]{4}\b'
  passport: '\b[A-PR-WY][1-9][0-9]\s?[0-9]{4}[1-9]\b'

# ---- labels (a label then ":" / "-" / spaces then the value, on its line or the next) -----------------------------
labels:
  date_of_birth: [date of birth, dob, d.o.b, birth date, birthdate, born on, born, janm tithi, date of birth (dd/mm/yyyy)]
  age: [age]
  current_location: [current location, present location, location, current city, city, based in, residing at,
                     residing in, currently residing at, currently based at, current residence]
  address: [address, current address, present address, residential address, permanent address, correspondence address,
            postal address, communication address, local address, home address]
  pin_code: [pin, pin code, pincode, postal code, zip, zip code]
  current_ctc: [current ctc, present ctc, ctc, current salary, present salary, current package, current annual ctc,
                annual ctc, salary drawn, last drawn salary, last drawn ctc, existing ctc, current compensation,
                current pay, gross salary]
  expected_ctc: [expected ctc, expected salary, salary expected, expected package, salary expectation,
                 expected compensation, desired salary, ectc]
  notice_period: [notice period, notice, notice period required, joining time, availability to join, can join within,
                  available to join, joining period]
  languages: [languages known, languages, language known, language proficiency, linguistic proficiency,
              languages spoken, known languages]
  employer: [company, organisation, organization, employer, company name, organisation name, organization name,
             name of the company, name of organisation, name of organization, firm, current employer,
             current organisation, current organization, current company]
  designation: [designation, role, position, job title, title, post, profile, current designation, current role]

# the declaration footer's "Place: Pune" is the candidate's city only when nothing better is printed
weak_location_labels: [place]
# "preferred location: Pune" is where they WANT to work, never where they are
not_current_location_labels: [preferred location, preferred job location, preferred work location, job location,
                              desired location, location preference]

# ---- section headings (exact, after removing spaces / punctuation) ---------------------------------------------------
headings:
  education: [education, educational qualification, educational qualifications, academic qualification,
              academic qualifications, academics, academic details, academic background, qualification, qualifications,
              education details, educational background, academic profile, educational details, scholastic profile,
              education and training, academic record, academic credentials]
  experience: [experience, work experience, professional experience, employment history, employment, work history,
               career history, employment details, internship, internships, professional background, job history,
               experience summary, work profile, career profile, organisational experience, organizational experience,
               relevant experience, employment record, professional journey, work details]
  skills: [skills, technical skills, key skills, core competencies, skill set, it skills, computer skills, soft skills,
           areas of expertise, technical proficiency, competencies, skills summary, software skills, computer proficiency,
           strengths, key strengths]
  summary: [summary, profile, objective, career objective, professional summary, about me, profile summary,
            career summary, executive summary, professional profile, objective statement]
  projects: [projects, academic projects, key projects, project details, project undertaken, projects undertaken]
  certifications: [certifications, certificates, certification, courses, trainings, training, certification courses,
                   professional certifications, licenses and certifications]
  achievements: [achievements, awards, accomplishments, extra curricular activities, extracurricular activities,
                 honors and awards, awards and achievements, co curricular activities]
  personal: [personal details, personal information, personal profile, personal data, personal particulars,
             personal dossier, other details, personal info, bio data, biodata]
  languages: [languages, languages known, language known, language proficiency, linguistic proficiency]
  hobbies: [hobbies, interests, hobbies and interests, hobbies & interests, extra interests]
  declaration: [declaration, self declaration]
  references: [references, referees, reference]
  contact: [contact, contact details, contact information, contact info]
  # ends the experience block (2026-10-19, a real resume: a mission period under "ADDITIONAL INFORMATION" became a job)
  additional: [additional information, additional details, other information, miscellaneous, extra information,
               additional info]

# ---- employer / designation ------------------------------------------------------------------------------------------
