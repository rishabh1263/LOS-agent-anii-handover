company_markers: [ltd, ltd., limited, pvt, pvt., private, llp, inc, inc., corp, corporation, company, co., bank, finance,
                  financial, finserv, fincorp, capital, services, solutions, technologies, technology, tech, systems,
                  software, consultancy, consultants, consulting, industries, enterprises, group, holdings, ventures,
                  infotech, infosystems, global, international, india, motors, pharma, pharmaceuticals, healthcare,
                  hospital, insurance, securities, broking, exports, traders, trading, agency, associates, logistics,
                  retail, mart, labs, studio, foundation, trust, nbfc, microfinance, housing, telecom, communications,
                  airways, airlines, steel, cement, power, energy, automobiles, auto, foods, textiles, chemicals]
# well-known employers that carry no marker word
known_employers: [infosys, wipro, tcs, accenture, capgemini, cognizant, deloitte, amazon, flipkart, google, microsoft,
                  ibm, oracle, hcl, genpact, concentrix, teleperformance, swiggy, zomato, paytm, phonepe, byjus,
                  reliance, airtel, jio, vodafone, idea, bajaj, tata, mahindra, godrej, hdfc, icici, axis, kotak, sbi,
                  yes bank, indusind, muthoot, manappuram, shriram, aditya birla, l&t, larsen & toubro, ey, kpmg, pwc]
