# THE ANSWER ACT (2026-11-04, owner: "kuch bhi puch, samajh jaye aur mast ans de -- not hardcoded, use ML / DL /
# agentic"). The intent says WHAT the question is about (readiness, a document, the stage); the ACT says what KIND of
# answer it wants -- a yes / no, a because, a when, a list, a count. "After doing all this, can it move to CPA?" and
# "what is pending?" share the readiness facts but want different answers ("Yes, once ..." vs the list).
#
# LEARNED, NOT MATCHED: semantics/answer_act.py embeds the message (nomic-embed-text, the meaning layer's model) plus
# word / char n-gram features and a softmax classifier trained on the EXAMPLES below (scripts/train_answer_act.py ->
# models/answer_act.npz). No rule reads these words; a new phrasing is taught by adding an example and retraining.
# Measured on the frozen held-out set evals/copilot/answer_act_heldout.yaml (never trained on).
#
# Examples mix topics on purpose (documents, KYC, stage, eligibility, loan, co-applicant), so the model learns the
# SHAPE of the question, not its subject.
model:
  path: models/answer_act.npz
  # below this probability the act is UNSURE: the answer keeps its default shape (the facts / list), nothing guessed
  min_confidence: 0.55
  # features: the sentence embedding + hashed word 1-2 grams + char 2-4 grams (typos, Hinglish, Devanagari)
  hash_dims: 4096
  embedding_weight: 1.0
  ngram_weight: 0.6

