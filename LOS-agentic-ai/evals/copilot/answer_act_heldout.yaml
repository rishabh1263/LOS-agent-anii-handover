# ANSWER-ACT HELD-OUT SET (written 2026-11-04 BEFORE the answer-act model and its training bank existed).
# NEVER train or tune on it: scripts/train_answer_act.py drops any training row equal to a sentence here, and a miss
# is fixed only by adding OTHER examples of that kind to app/config/copilot_answer_acts.yaml, then re-measured.
#
# act = what KIND of answer the officer wants, independent of the topic:
#   STATUS       tell me the state / show / details                    ("PAN ka status batao")
#   YES_NO       is it / has it / can it, right now                     ("is the PAN verified?")
#   CONDITIONAL  once / after / if X is done, will / can Y              ("after uploading these can it go to CPA?")
#   WHY          why is it the way it is / why did it happen            ("why is the KYC on hold?")
#   WHY_NOT      why can't / why isn't / what is stopping it            ("why can't this go to CPA?")
#   WHEN         when will / how long / by when                         ("when will it reach credit?")
#   HOW          how do I / what are the steps / process                ("how do I upload the bank statement?")
#   NEXT         what should I do now / next step                       ("ab kya karna hai?")
#   LIST         which ones / what all                                  ("which documents are missing?")
#   COUNT        how many                                               ("how many documents are left?")
#   DEFINE       what is X / meaning of a term                          ("what does FOIR mean?")
#   PREFACE      announces a question / asks to ask, nothing asked yet  ("i have one more query to ask?")
#                (added 2026-11-04 with the PREFACE act, written before its training examples)
# style: en | hinglish | broken | typo | devanagari
