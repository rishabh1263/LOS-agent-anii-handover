# SEMANTIC TASK HELD-OUT SET B (Phase 2, written 2026-10-12 AFTER the set-A baseline was looked at and BEFORE any
# Phase 2 fix was switched on). Its baseline is measured with the Phase 2 task layer OFF; it is NOT looked at again
# until the final measurement. Set A (task_heldout.yaml) was viewed at baseline, so set B is the clean
# generalisation number. Same format as task_heldout.yaml.
