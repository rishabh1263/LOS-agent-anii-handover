# SEMANTIC TASK HELD-OUT SET C (hardening phase 3, written 2026-10-12 BEFORE any of its fixes). Its baseline is run
# once and ONLY its totals are read; per-item results are not inspected until the final measurement. None of these
# sentences is in the catalogue, the paraphrase bank, the dev sets or the directive. Same format as task_heldout.yaml.
items:
  # portfolio list / filter / eligibility
  - { id: cP1, cat: portfolio_list, style: en, ctx: none, q: "which borrowers of mine haven't sent their papers yet?", expect: { scope: portfolio, op: list } }
  - { id: cP2, cat: portfolio_list, style: en, ctx: none, q: "which of my files are eligible to move to CPA?", expect: { scope: portfolio, op: list, filter: ready_for_cpa } }
  - { id: cP3, cat: portfolio_list, style: typo, ctx: none, q: "list my stuk files", expect: { scope: portfolio, op: list, filter: stuck } }
  - { id: cP4, cat: portfolio_list, style: hinglish, ctx: none, q: "mere kaunse customers ke documents abhi baaki hain", expect: { scope: portfolio, op: list } }
  - { id: cP5, cat: portfolio_list, style: typo, ctx: none, q: "show my latst cases", expect: { scope: portfolio, op: list } }
  - { id: cP6, cat: portfolio_list, style: en, ctx: none, q: "which loans of mine have identity check problems?", expect: { scope: portfolio, op: list, filter: kyc_issue } }
  - { id: cP7, cat: portfolio_list, style: en, ctx: open, q: "which other applications of mine are ready to be sent to CPA?", expect: { scope: portfolio, op: list, filter: ready_for_cpa } }
  # counts / aggregates
  - { id: cC1, cat: count, style: en, ctx: none, q: "how many of my files still don't have a PAN uploaded?", expect: { scope: portfolio, op: count } }
  - { id: cC2, cat: count, style: hinglish, ctx: none, q: "kitne cases mein signature nahi aaya hai", expect: { scope: portfolio, op: count } }
  - { id: cC3, cat: count, style: en, ctx: none, q: "how many of my applications are waiting on KYC?", expect: { scope: portfolio, op: count, filter: kyc_issue } }
  - { id: cC4, cat: count, style: typo, ctx: none, q: "how many applicatons are redy for CPA", expect: { scope: portfolio, op: count, filter: ready_for_cpa } }
  # single case must stay single
  - { id: cS1, cat: single_case, style: en, ctx: open, q: "does this customer still owe me any documents?", expect: { scope: one_case, op: retrieve } }
  - { id: cS2, cat: single_case, style: en, ctx: open, q: "can this application go to CPA now?", expect: { scope: one_case, op: retrieve } }
  - { id: cS3, cat: single_case, style: hinglish, ctx: open, q: "is customer ka PAN upload hua?", expect: { scope: one_case, op: retrieve } }
  - { id: cS4, cat: single_case, style: en, ctx: none, q: "is this file ready for CPA?", expect: { scope: one_case, op: which_case } }
  # follow-ups after a list
  - { id: cF1, cat: followup, style: en, ctx: listed, before: ["show the stuck cases"], q: "and what about the KYC ones?", expect: { scope: portfolio, op: list, filter: kyc_issue } }
  - { id: cF2, cat: followup, style: en, ctx: listed, before: ["show the cases with KYC issues"], q: "only those that are ready for CPA", expect: { scope: portfolio, op: list, filter: ready_for_cpa } }
  - { id: cF3, cat: followup, style: en, ctx: listed, q: "next page please", expect: { scope: portfolio, op: page } }
  - { id: cF4, cat: followup, style: en, ctx: listed, q: "open the third one", expect: { scope: one_case, op: retrieve, ref: ordinal, rows: [3] } }
  - { id: cF5, cat: followup, style: en, ctx: listed, q: "what is the KYC status of the first one?", expect: { scope: one_case, op: retrieve, ref: ordinal, rows: [1] } }
  - { id: cF6, cat: followup, style: hinglish, ctx: none, before: ["how many cases are ready for CPA?"], q: "aur stuck wale?", expect: { scope: portfolio, op: count, filter: stuck } }
  - { id: cF7, cat: followup, style: en, ctx: open, before: ["what is pending"], q: "why?", expect: { scope: one_case, op: retrieve } }
  # greetings / farewells / small talk
  - { id: cG1, cat: greeting, style: hinglish, ctx: none, q: "namaskar sir", expect: { scope: conversation, op: greet } }
  - { id: cG2, cat: greeting, style: typo, ctx: none, q: "hii goood morning", expect: { scope: conversation, op: greet } }
  - { id: cG3, cat: greeting, style: hinglish, ctx: open, q: "sat sri akal ji", expect: { scope: conversation, op: greet } }
  - { id: cG4, cat: greeting, style: typo, ctx: none, q: "hellow", expect: { scope: conversation, op: greet } }
  - { id: cA1, cat: ack, style: en, ctx: open, before: ["what is pending"], q: "got it, appreciate it", expect: { scope: conversation, op: ack } }
  - { id: cA2, cat: ack, style: hinglish, ctx: none, q: "thik hai ji", expect: { scope: conversation, op: ack } }
  # action requests vs farewell
  - { id: cU1, cat: ambiguous, style: en, ctx: open, q: "sort this out for me", expect: { scope: none, op: clarify } }
  - { id: cU2, cat: ambiguous, style: hinglish, ctx: open, q: "ye sambhal lo", expect: { scope: none, op: clarify } }
  - { id: cU3, cat: ambiguous, style: en, ctx: none, q: "book a cab for me", expect: { scope: none, op: refuse } }
  - { id: cU4, cat: ambiguous, style: en, ctx: open, q: "reject this file", expect: { scope: none, op: refuse } }
  # handbook / workflow knowledge
  - { id: cH1, cat: handbook, style: en, ctx: open, q: "who reviews the file once it reaches CPA?", expect: { scope: knowledge, op: explain } }
  - { id: cH2, cat: handbook, style: en, ctx: none, q: "what is the next stage after FOS?", expect: { scope: knowledge, op: explain } }
  - { id: cH3, cat: handbook, style: en, ctx: none, q: "is a rent agreement valid as address proof?", expect: { scope: knowledge, op: explain } }
  - { id: cH4, cat: handbook, style: en, ctx: none, q: "which papers are needed for a home loan?", expect: { scope: knowledge, op: explain } }
  - { id: cH5, cat: handbook, style: hinglish, ctx: none, q: "LTV ka matlab kya hota hai", expect: { scope: knowledge, op: explain } }
  - { id: cH6, cat: handbook, style: en, ctx: none, q: "what is the maximum tenure for a personal loan?", expect: { scope: knowledge, op: explain } }
  # document status on one case
  - { id: cD1, cat: document_status, style: en, ctx: open, q: "was the address proof accepted?", expect: { scope: one_case, op: retrieve } }
  - { id: cD2, cat: document_status, style: en, ctx: none, q: "how many of my applications are missing the signature?", expect: { scope: portfolio, op: count } }
  # negation / correction
  - { id: cN1, cat: negation, style: en, ctx: open, before: ["what is pending"], q: "no not now", expect: { scope: conversation, op: negate } }
  - { id: cR1, cat: correction, style: en, ctx: listed, before: ["open the first one"], q: "sorry, I meant the third one", expect: { scope: one_case, op: retrieve, ref: ordinal, rows: [3] } }
