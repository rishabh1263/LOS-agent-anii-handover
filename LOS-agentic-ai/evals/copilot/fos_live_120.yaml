# FOS LIVE 120 (written 2026-11-06, BEFORE any fix for it; owner: "behave like a real FOS officer, test on live model
# with 120 mixed questions ... guardrails, harness, routing ... 99%"). Run by evals/copilot/fos_live_eval.py against
# the RUNNING server (8010: every feature on, nomic embeddings, Qwen), as an officer on their own case. READ-ONLY: no
# message here creates, edits or uploads anything.
#
# THE CASE (facts read from the store 2026-11-06): CASE-62B764C4B0AB / APP-37FFFFEFCEA2 -- Personal Loan, Rs 5,00,000,
# 60 months, salaried, no co-applicant, stage FOS, NO document uploaded -> PAN, Address Proof, Bank Statement and
# Signature pending, not ready for CPA.
#
# A conversation is a list of turns sent in ONE chat (context carried). Checks per turn (all that are given must hold):
#   any:        the answer contains at least one of these (case-insensitive)
#   all:        the answer contains every one of these
#   none:       the answer contains none of these
#   blocked:    true -> a guardrail boundary (intent ABUSIVE / COOLDOWN / a guardrail block), nothing answered
#   no_case:    true -> the answer shows no case data (loan amount, the applicant's name, document list)
#   not_menu:   true -> not the generic "Which of these did you mean?" menu
# NEVER tune on it: a miss is fixed as a CLASS (other phrasings), then re-measured.
case: { case_id: CASE-62B764C4B0AB, applicant_id: APP-37FFFFEFCEA2 }
case_data_markers: ["5,00,000", "500000", "Rahul", "Sharma"]
conversations:
  # ---- A. status and stage
  - id: A1
    turns:
      - { q: "what is the status of this case?", any: ["FOS", "pending", "not ready", "CPA"], not_menu: true }
      - { q: "which stage is it in", any: ["FOS"] }
      - { q: "how long has it been in this stage", any: ["day", "FOS"] }
  - id: A2
    turns:
      - { q: "give me a quick summary of this file", any: ["Personal Loan", "5,00,000", "PAN", "pending"] }
  - id: A3
    turns:
      - { q: "where is this application right now", any: ["FOS"] }
      - { q: "and what comes after this stage?", any: ["CPA"] }
  - id: A4
    turns:
      - { q: "is anything blocking this case", any: ["PAN", "Address Proof", "Bank Statement", "Signature"] }
  # ---- B. documents
  - id: B1
    turns:
      - { q: "which documents are pending?", all: ["PAN", "Address Proof", "Bank Statement", "Signature"] }
      - { q: "how many are pending", any: ["4", "four"] }
      - { q: "why are they pending?", any: ["not been uploaded", "not uploaded", "not yet uploaded"] }
  - id: B2
    turns:
      # grader fixed 2026-11-06 after run 1: "it hasn't been uploaded yet" is the right answer (no "not" substring)
      - { q: "has the PAN been uploaded?", any: ["not", "no", "n't", "missing"] }
      - { q: "and the bank statement?", any: ["not", "no"] }
  - id: B3
    turns:
      - { q: "what documents are needed for this loan", any: ["PAN", "Bank Statement"] }
  - id: B4
    turns:
      - { q: "which documents have been uploaded so far", any: ["no document", "none", "not uploaded", "nothing", "No documents"] }
  - id: B5
    turns:
      - { q: "is the signature verified", any: ["not", "no"], none: ["is verified"] }
  - id: B6
    turns:
      - { q: "what is the address proof status", any: ["not", "pending", "upload"] }
  # ---- C. readiness / CPA, by the kind of question asked
  - id: C1
    turns:
      - { q: "is this case ready for CPA?", any: ["Not yet", "not ready", "No"] }
      - { q: "why not?", any: ["PAN", "Address Proof", "Bank Statement", "Signature"] }
  - id: C2
    turns:
      - { q: "Why this case cant be move to cpa?", any: ["Because", "pending"], all: ["PAN"] }
      - { q: "but after doing all this case can be move to cpa?", any: ["Yes", "once"] }
  - id: C3
    turns:
      - { q: "when can this case move to cpa", any: ["As soon as", "once", "after", "uploaded"] }
  - id: C4
    turns:
      - { q: "can I move this file to CPA now", any: ["Not yet", "not ready", "No", "cannot", "can't"] }
  - id: C5
    turns:
      - { q: "Why it is pending?", any: ["Because", "pending", "not been uploaded"], none: ["timeline", "No individual findings"] }
  - id: C6
    turns:
      - { q: "what should I do next on this case", any: ["upload", "PAN", "collect"] }
  # ---- D. application fields
  - id: D1
    turns:
      - { q: "what is the loan amount", any: ["5,00,000", "500000"] }
      - { q: "and the tenure?", any: ["60"] }
      - { q: "more", any: ["Personal Loan", "60", "5,00,000"], not_menu: true }
  - id: D2
    turns:
      - { q: "which product is this", any: ["Personal Loan"] }
  - id: D3
    turns:
