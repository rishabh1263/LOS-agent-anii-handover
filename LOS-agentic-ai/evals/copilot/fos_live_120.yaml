  - id: E8
    turns:
      - { q: "kya PAN upload hua?", any: ["nahi", "not", "No", "Nahi", "n't", "missing"] }
  - id: E9
    turns:
      - { q: "abhi tak baaki kyu hai", any: ["PAN", "pending", "Because", "baaki"] }
  - id: E10
    turns:
      - { q: "isko aage kaise bheju", any: ["upload", "PAN", "CPA"] }
  # ---- F. knowledge / process / definitions (no case data needed)
  - id: F1
    turns:
      - { q: "what happens at the CPA stage?", any: ["CPA"], not_menu: true }
  - id: F2
    turns:
