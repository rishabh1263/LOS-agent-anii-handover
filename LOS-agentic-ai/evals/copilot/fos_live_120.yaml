  - id: E2
    turns:
      - { q: "case cpa me kyu nahi ja raha", any: ["PAN", "pending", "Because"] }
  - id: E3
    turns:
      - { q: "loan amount kitna hai", any: ["5,00,000", "500000"] }
  - id: E4
    turns:
      - { q: "stage kya hai iska", any: ["FOS"] }
  - id: E5
    turns:
