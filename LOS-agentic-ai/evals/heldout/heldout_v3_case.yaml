# HELD-OUT v3 -- ENGLISH officer questions on an open case. FROZEN 2026-10-09, written BEFORE the v2 failures were
# analysed or fixed (owner: "fix the wrong answers" -- v2 stops being unseen once its failures are studied, so this set
# is the honest after-number). Wording deliberately not taken from app/config/intent_catalogue.yaml or v2.
# NEVER tune on it.
#
# Every item is asked in its own chat with THIS case open (fixture `kyc_failed`, tests/integration/test_master_6_kyc_ab.py):
