# HELD-OUT v2 -- CASE & DOCUMENT questions (Smart Bot plan section 9). FROZEN 2026-10-08, written before any tuning of the
# meaning layer on it; wording deliberately NOT taken from app/config/intent_catalogue.yaml. NEVER tune on it.
#
# Every item is asked in its own chat with THIS case open (fixture `kyc_failed`, tests/integration/test_master_6_kyc_ab.py):
#   Rahul Sharma, Personal Loan, loan amount 5,00,000, mobile 9876543210, born 1990-04-12, 12 MG Road, Pune, stage FOS;
#   PAN, Driving Licence, Bank Statement uploaded and VERIFIED; KYC FAILED: name on the Bank Statement "ROHIT VERMA"
#   differs from the form / PAN / DL; Signature not uploaded; no co-applicant; no queries.
# expect: answer (must = all of / must_any = one of, case-insensitive) | case | clarify | not_available | decline | list

frozen: true
version: 2
fixture: kyc_failed
