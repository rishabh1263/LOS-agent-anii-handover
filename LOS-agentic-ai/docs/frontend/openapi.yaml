  /api/v1/fos/cases:
    get:
      tags:
      - FOS
      summary: 'The home table: the caller''s own cases, searched / filtered / sorted
        / paged on the server'
      description: 'MASTER SPEC 3 + 15.1: the SAME query as the chat list -- only
        the caller''s cases (live grants, each row

        re-checked by the ownership rule). Columns: Case ID, App ID, Applicant name,
        Stage, Status (Created / Review /

        Disbursal, mapped from the stage in config), Created date, Action. `group`
        = pending / done. Clicking a row:

        GET /cases/{case_id}/form (the filled form) -- or post {"action": "OPEN_CASE"}
