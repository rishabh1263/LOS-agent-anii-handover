          - type: 'null'
          title: Co Applicant Relationship
          description: '**CO-APPLICANT** relationship to the applicant (e.g. SPOUSE).
            Stored with LOS_COAPP_IDENTITY on.'
          examples:
          - ''
      type: object
      title: Body_process_api_v1_los_process_post
    Body_process_document_api_api_v1_document_agent_post:
