        applicant_father_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Father Name
        applicant_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Address
        co_applicant_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Co Applicant Name
          description: '**CO-APPLICANT** declared name, matched against **their**
            documents only.'
        co_applicant_dob:
          anyOf:
          - type: string
          - type: 'null'
          title: Co Applicant Dob
        co_applicant_pan:
          anyOf:
          - type: string
          - type: 'null'
          title: Co Applicant Pan
        co_applicant_father_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Co Applicant Father Name
        co_applicant_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Co Applicant Address
        co_applicant_relationship:
          anyOf:
