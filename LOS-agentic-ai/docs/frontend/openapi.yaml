        '403':
          description: Authenticated, but the scope, stage or case ownership does
            not permit this. A case you cannot access and a case that does not exist
            answer the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request failed validation, or a document could not be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/fos/tools:
    get:
      tags:
      - FOS
      summary: The MCP tool catalogue
      description: 'Every tool the copilot can call, with its JSON Schema, the scope
        required to call it, and whether it writes. Published so the boundary is reviewable
        rather than inferred from source.


        The scope shown is the one the permission layer enforces; a test checks the
        two agree.


        *Supporting endpoint — not part of the two-endpoint integration surface.*'
      operationId: fos_tools_api_v1_fos_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: No token, or a token that is expired, malformed, for another
            audience, or signed by an unknown key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the scope, stage or case ownership does
            not permit this. A case you cannot access and a case that does not exist
            answer the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request failed validation, or a document could not be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/tts:
    post:
      tags:
      - Speech
      summary: Speak a chat response (backend TTS, one voice per language)
      operationId: speak_api_v1_tts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
        required: true
      responses:
        '200':
          description: Audio bytes.
          content:
            application/json:
              schema: {}
            audio/wav: {}
        '401':
          description: No token, or a token that is expired, malformed, for another
            audience, or signed by an unknown key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the scope, stage or case ownership does
            not permit this. A case you cannot access and a case that does not exist
            answer the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request failed validation, or a document could not be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /ready:
    get:
      tags:
      - Ops
      summary: Readiness probe
      description: 'Ready to serve traffic.


        Returns 503 if the agent configuration or the risk policy cannot be

        loaded, so an orchestrator will not route traffic to a process that would

        fail every request.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Ready Get
components:
  schemas:
    AddressInput:
      properties:
        raw:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw
        house:
          anyOf:
          - type: string
          - type: 'null'
          title: House
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
        locality:
          anyOf:
          - type: string
          - type: 'null'
          title: Locality
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        pincode:
          anyOf:
          - type: string
          - type: 'null'
          title: Pincode
      additionalProperties: false
      type: object
      title: AddressInput
      description: 'An address, ideally already split into components.


        `raw` is accepted for callers that only hold the printed line. It is parsed

        into components before comparison, because comparing raw address strings

        fails almost every genuine applicant: documents abbreviate, reorder and

        punctuate differently.'
    AgentAction:
      properties:
        action_id:
          type: string
          title: Action Id
        type:
