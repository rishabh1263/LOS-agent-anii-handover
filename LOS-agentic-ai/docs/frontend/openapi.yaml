    Body_process_api_v1_los_process_post:
      properties:
        files:
          anyOf:
          - items:
              type: string
              contentMediaType: application/octet-stream
              format: binary
            type: array
          - type: 'null'
          title: Files
          description: '**PRIMARY APPLICANT** documents. Positionally matched to `expected_types`.


            Optional **only** in the sense that a request may instead carry `co_applicant_files`
            alone: the two parties are processed independently, and a co-applicant''s
            documents must not wait on the primary''s. At least one party must send
            something.'
        operation:
          type: string
          enum:
          - PROCESS
          - EXTRACT
          - VERIFY
          title: Operation
          description: 'PROCESS runs the whole application: classify, verify, extract
            behind the verification gate, route specialist evidence, cross-check with
            KYC, then decide. EXTRACT and VERIFY are the Document Agent''s own modes,
            kept for existing callers -- VERIFY never releases extracted fields.'
          default: PROCESS
        applicant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Id
        case_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Case Id
          description: The case this upload belongs to. Omit to start a new case for
            the applicant; supply one to add documents to an existing case. One applicant
            may have several cases, and they stay separate.
        expected_types:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Expected Types
          description: '**PRIMARY APPLICANT** — one expected document type per file
            in `files`, in order. Repeat the field once per file (`expected_types=PAN&expected_types=BANK_STATEMENT`).
            Use `AUTO` to let classification decide for that file. A single comma-separated
            string is still accepted.'
          examples:
          - - PAN
            - DRIVING_LICENCE
        document_types:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Document Types
          description: Alias of `expected_types` -- the name the FOS upload route
            uses. Sending both with different values is refused.
        co_applicant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Co Applicant Id
          description: '**CO-APPLICANT** identifier. Required whenever `co_applicant_files`
            is sent, and must differ from `applicant_id`. Omit it entirely for a single-applicant
            case.'
          examples:
          - ''
        co_applicant_files:
          anyOf:
          - items:
              type: string
              contentMediaType: application/octet-stream
              format: binary
            type: array
          - type: 'null'
          title: Co Applicant Files
          description: '**CO-APPLICANT** documents — a different person from `files`.
            Positionally matched to `co_applicant_expected_types`.'
        reference_signature:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
            format: binary
          - type: string
          - type: 'null'
          title: Reference Signature
          description: '**PRIMARY APPLICANT** known-good specimen signature (an image).
            Used ONLY to compare this applicant''s SIGNATURE uploads in this request;
            without it a signature is REVIEW (no reference), never PASS.'
        co_applicant_reference_signature:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
            format: binary
          - type: string
          - type: 'null'
          title: Co Applicant Reference Signature
          description: '**CO-APPLICANT** known-good specimen signature, for their
            SIGNATURE uploads.'
        co_applicant_expected_types:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Co Applicant Expected Types
          description: '**CO-APPLICANT** — one expected document type per file in
            `co_applicant_files`, in order. Same rules as `expected_types`.'
          examples:
          - - PAN
        applicant_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Name
          description: '**PRIMARY APPLICANT** declared name, matched against their
            own documents.'
        applicant_dob:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Dob
          description: '**PRIMARY APPLICANT** declared date of birth (any common format;
            normalised before comparison).'
        applicant_pan:
          anyOf:
          - type: string
          - type: 'null'
          title: Applicant Pan
          description: '**PRIMARY APPLICANT** declared PAN. Compared exactly after
