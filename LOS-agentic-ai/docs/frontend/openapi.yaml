      summary: The applicant record
      description: Who this applicant is, as the store holds them.
      operationId: get_applicant_api_v1_fos_applicants__applicant_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: applicant_id
        in: path
        required: true
        schema:
          type: string
          title: Applicant Id
      - name: case_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Case Id
      responses:
        '200':
