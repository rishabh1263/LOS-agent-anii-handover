          - UPDATE_APPLICANT
        tool:
          type: string
          title: Tool
        arguments:
          additionalProperties: true
          type: object
          title: Arguments
        requires_confirmation:
          type: boolean
          title: Requires Confirmation
          default: true
        summary:
          type: string
          title: Summary
      type: object
      required:
      - action_id
      - type
      - tool
      - summary
      title: AgentAction
      description: A change the agent is offering to make. Never already applied.
    AgentDescriptor:
      properties:
        agent_id:
          type: string
          title: Agent Id
        agent_name:
          type: string
          title: Agent Name
        stage:
          type: string
          title: Stage
        enabled:
          type: boolean
          title: Enabled
        registered:
          type: boolean
          title: Registered
        routable:
          type: boolean
          title: Routable
        model:
          type: string
          title: Model
        version:
          type: string
          title: Version
      type: object
      required:
      - agent_id
      - agent_name
      - stage
      - enabled
      - registered
      - routable
      - model
      - version
      title: AgentDescriptor
      description: Public description of a configured agent.
    AgentErrorInfo:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: AgentErrorInfo
    AgentExecutionRequest:
      properties:
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
          description: Explicit agent to run, e.g. 'fraud_risk_agent'.
        stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Stage
          description: 'Alternative to agent_id: resolve the agent by stage, e.g.
            ''risk_assessment''.'
        payload:
          additionalProperties: true
          type: object
          title: Payload
          description: Agent-specific input payload.
      additionalProperties: false
      type: object
      title: AgentExecutionRequest
      description: "Request from the .NET LOS.\n\nSupply either:\n    - agent_id\n\
        \    - stage\n\nAt least one is required."
    AgentExecutionResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        agent_id:
          type: string
          title: Agent Id
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        status:
          type: string
          title: Status
        approval_required:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Approval Required
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
        used_fallback:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Used Fallback
        fallback_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Fallback From
        attempts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attempts
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
        trace:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Trace
      type: object
      required:
      - request_id
      - agent_id
      - status
      title: AgentExecutionResponse
      description: "Envelope returned to the .NET LOS.\n\nDiagnostics are omitted\
        \ from healthy responses unless:\n    ?detail=true\n\nor the execution failed\
        \ / used fallback."
    ApplicantCreateRequest:
      properties:
        full_name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Full Name
          examples:
          - Rahul Sharma
        mobile:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Mobile
          examples:
          - '9876543210'
        email:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Email
        date_of_birth:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Date Of Birth
          examples:
          - '1990-04-12'
        address:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Address
        applicant_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Applicant Id
          description: Optional. Generated when omitted.
      type: object
      title: ApplicantCreateRequest
    ApplicantDetails:
      properties:
        full_name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Full Name
          examples:
          - Rahul Sharma
        mobile:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Mobile
          examples:
          - '9876543210'
        email:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Email
          examples:
          - rahul.sharma@example.com
        date_of_birth:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Date Of Birth
          examples:
          - '1990-04-12'
        address:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Address
          examples:
          - Mumbai, Maharashtra
      type: object
      title: ApplicantDetails
    ApplicationCreateRequest:
      properties:
        applicant_id:
          type: string
          maxLength: 128
          title: Applicant Id
        product:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Product
          examples:
          - PERSONAL_LOAN
        loan_amount:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Loan Amount
          examples:
          - '500000'
        case_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Case Id
          description: Optional. Generated when omitted.
      type: object
      required:
      - applicant_id
      title: ApplicationCreateRequest
    ApplicationDetails:
      properties:
        product:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Product
          description: Decides the document checklist. See GET /api/v1/fos/config.
          examples:
          - PERSONAL_LOAN
        loan_amount:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Loan Amount
          description: Drives the amount-based document rules. Omit it and those rules
            are reported as unevaluated in `policy.unevaluated_rules` rather than
            guessed at, so the checklist is the base one and is known to be provisional.
          examples:
          - 500000
        employment_type:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Employment Type
          description: 'An applicant attribute the document policy may key on. Not
            defaulted: a rule that depends on it is reported as unevaluated when it
            is absent.'
          examples:
          - SALARIED
          - SELF_EMPLOYED
        tenure_months:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Tenure Months
          description: Repayment period in months. Without it no instalment can be
            computed and eligibility reports EMI_INPUTS_MISSING.
          examples:
          - 36
        interest_rate_pct:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Interest Rate Pct
          description: Annual interest rate. Without it no instalment can be computed
            and eligibility reports EMI_INPUTS_MISSING.
          examples:
          - 12.5
        declared_monthly_obligations:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Declared Monthly Obligations
          description: 'What the applicant says they already repay each month. DECLARED,
            and recorded as declared: whether a declared figure may be used in an
            affordability calculation is a policy decision, set in eligibility_policy.yaml,
            and it is not accepted by default.'
          examples:
          - 8000
        declared_monthly_income:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Declared Monthly Income
          description: 'What the applicant says they earn each month. DECLARED, and
            recorded as declared: it is never used as verified income. Optional; credit
            underwriting reports its comparison with the documented income as unavailable
            when it is absent.'
          examples:
          - 65000
        property_value:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Property Value
          description: The property's value, for a secured product such as HOME_LOAN,
            where eligibility computes LTV. Recorded as DECLARED. Ignored for an unsecured
            product, where LTV is NOT_APPLICABLE.
          examples:
          - 8000000
      type: object
      title: ApplicationDetails
    ApplicationOverview:
      properties:
        status:
          type: string
          title: Status
          examples:
          - SUCCESS
          - PARTIAL
          - REVIEW
        decision:
          type: string
          title: Decision
          examples:
          - PASS
          - REVIEW
          - REJECT
        next_action:
          type: string
          title: Next Action
          examples:
          - MANUAL_REVIEW
          - CONTINUE
        issues:
          items:
            $ref: '#/components/schemas/PartyIssue'
          type: array
          title: Issues
          description: Every party's issues in one list, each tagged with whose.
        missing:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Missing
          description: '**Always empty.** This endpoint has no checklist: required-document
            policy lives in the applicant agent and is never computed here. The key
            is present because its absence would read as "nothing is missing", which
            is a claim this endpoint cannot make.'
        summary:
          type: string
          title: Summary
          description: Why the application stands where it does, one party at a time.
            DETERMINISTIC and separate from the top-level `summary`, which a model
            may write.
          examples:
          - Primary applicant verification passed. Co-applicant verification requires
            review due to NAME_MISMATCH.
        processing_summary:
          $ref: '#/components/schemas/ProcessingSummary'
      type: object
      required:
      - status
      - decision
      - next_action
      - summary
      - processing_summary
      title: ApplicationOverview
      description: 'The application in one object: what happened, and whose problem
        it is.


        PURELY A REGROUPING. `status`, `decision` and `next_action` are the

        very values published at top level, produced by the existing rules;

        the issues are each party''s own recorded reason codes, tagged with

        whose they are. Nothing here ranks or re-derives any of it.'
