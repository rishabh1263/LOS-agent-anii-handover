openapi: 3.1.0
info:
  title: LOS Agentic AI
  description: Deterministic document extraction and risk assessment, orchestrated
    through LangGraph. Language models write summaries; they never decide.
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Get an access + refresh token
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke a refresh token
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Exchange a refresh token for a new pair
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/copilot/query:
    post:
      tags:
      - Copilot
      summary: Ask the Universal LOS Copilot about a case
      description: 'Natural-language questions about one case, answered from stored
        records.


        **Case history** — *"why is this case in review?"* — is answered from the
        findings the LOS pipeline recorded at the time, with the reason codes it wrote
        down. Nothing is inferred: when no findings were recorded, the answer says
        so rather than offering a plausible explanation.


        Requires `case_id`, and the caller must own it. Credit, risk and underwriting
        decisions are out of scope and are never generated here — recorded ones are
        reported as recorded.'
      operationId: query_api_v1_copilot_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotQueryRequest'
        required: true
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotQueryResponse'
        '401':
          description: No token, or a token that is expired, malformed, for another
            audience, or signed by an unknown key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the scope, stage or case ownership does
            not permit this. A case you cannot access and a case that does not exist
            answer the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request failed validation, or a document could not be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/fos/actions:
    get:
      tags:
      - FOS
      summary: The action list, for rendering the dropdown
      description: 'Values and labels for the copilot''s `action` field. A frontend
        renders its dropdown from this rather than hardcoding it, so adding an action
        does not require a frontend release.


        *Supporting endpoint — not part of the two-endpoint integration surface.*'
      operationId: actions_api_v1_fos_actions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: No token, or a token that is expired, malformed, for another
            audience, or signed by an unknown key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the scope, stage or case ownership does
            not permit this. A case you cannot access and a case that does not exist
            answer the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request failed validation, or a document could not be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/fos/applicants:
    post:
      tags:
      - FOS
      summary: 'Open a case: create the applicant and their application'
      description: 'One call creates the applicant, generates `applicant_id` and `case_id`,
        creates the application, initialises the FOS stage and returns the opened
        case -- including the document checklist the chosen product requires.


        **Scopes:** `create_applicant` and, when an application is included, `create_application`.'
      operationId: create_case_route_api_v1_fos_applicants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
        required: true
      responses:
        '201':
          description: The opened case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FosResponse'
        '401':
          description: No token, or a token that is expired, malformed, for another
            audience, or signed by an unknown key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated, but the scope, stage or case ownership does
            not permit this. A case you cannot access and a case that does not exist
            answer the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request failed validation, or a document could not be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
