  - { from: tests/agents/test_eligibility_leviosa_fields.py, to: eligibility/tests/test_eligibility_leviosa_fields.py }
  - { from: tests/agents/test_eligibility_numbers.py, to: eligibility/tests/test_eligibility_numbers.py }
  - { from: tests/agents/test_eligibility_workbook.py, to: eligibility/tests/test_eligibility_workbook.py }
