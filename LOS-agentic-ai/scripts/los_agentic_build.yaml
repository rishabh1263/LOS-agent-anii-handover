# =====================================================================================================================
# THE HANDOVER PROJECT (scripts/build_los_agentic.py), owner 2026-11-02: "ek major folder credit_underwriting, usme
# saare agents folder-wise, clean structure". Everything the builder moves, renames or edits is here -- the script
# holds no names. `from` is relative to this repository, `to` to the project folder.
#
#   credit_underwriting/
#     main.py  conftest.py  README.md  requirements.txt  .env.example  pytest.ini
#     eligibility/ docs_policy/ dedupe/ bank_verification/ crime_verification/ legal_verification/
#         each: the agent's code, api.py, conf/ (its rules seed and settings), tests/, README.md
#     underwriting/  the parent agent: the credit underwriting assessment over the agents' recorded results
#     shared/      what every agent uses: db (los_agentic, rules, audit, logs), security, store, api, llm, ...
#     scripts/  docs/
#
# A path a file builds from its own place (Path(__file__).parents[N]) is corrected by the builder for the new depth;
# only the lines listed under `edits` are written by hand.
# =====================================================================================================================
name: credit_underwriting
out: ../../../credit_underwriting_build          # relative to the repository root; --out overrides
# the repository modules the agents really ran (their tests + the service's start-up), recorded with a pytest plugin;
# a package marked only_used gets just those files
used_modules: scripts/los_agentic_modules.txt
# each agent folder's README.md
agent_readmes: scripts/los_agentic_docs/agents.yaml

# ---------------------------------------------------------------------------------------------------- code
packages:
  # ---- the six agents
  - { from: app/agents/eligibility, to: eligibility }
  - { from: app/api/routes/eligibility_api.py, to: eligibility/api.py }
  - { from: app/agents/docs_verify_credit_agent, to: docs_policy }
  - { from: app/agents/dedupe, to: dedupe }
  - { from: app/api/routes/dedupe_api.py, to: dedupe/api.py }
  - { from: app/agents/credit/bank_verification, to: bank_verification, exclude: [dist] }
  - { from: app/agents/credit/crime_verification, to: crime_verification, exclude: [dist] }
  - { from: app/agents/credit/legal_verification, to: legal_verification, exclude: [dist] }
  # ---- shared: the platform
  - { from: app/agent_db, to: shared/db }
  - { from: app/security, to: shared/security, only_used: true }
  - { from: app/store, to: shared/store, only_used: true, exclude: [ocr_queue.py] }
  - { from: app/core, to: shared/core, only_used: true }
  - { from: app/llm, to: shared/llm, only_used: true }
  - { from: app/observability, to: shared/observability, only_used: true }
  - { from: app/mcp, to: shared/mcp, only_used: true }
  - { from: app/api/__init__.py, to: shared/api/__init__.py }
  - { from: app/api/contract.py, to: shared/api/contract.py }
  - { from: app/api/dependencies.py, to: shared/api/dependencies.py }
  - { from: app/api/errors.py, to: shared/api/errors.py }
  # ---- shared: the LOS parts the agents use
  # ---- the parent agent: credit underwriting itself (assessment, planner, graph, memo), on the agent runtime
  - { from: app/agents/credit, to: underwriting,
      exclude: [bank_verification, crime_verification, legal_verification] }
  - { from: app/agents/runtime, to: shared/runtime }
  - { from: app/orchestration, to: shared/orchestration, only_used: true }
  - { from: app/services, to: shared/services, only_used: true }
  - { from: app/agents/los, to: shared/los, only_used: true, exclude: [flow.py, mapping.py, kyc_gate.py] }
  - { from: app/agents/policy, to: shared/policy, only_used: true }
  - { from: app/agents/fraud_risk, to: shared/fraud_risk, only_used: true }
  - { from: app/agents/bank_statement, to: shared/bank_statement, only_used: true }
  - { from: app/agents/document_agent, to: shared/document_agent, only_used: true, exclude: [workflow.py] }
  - { from: app/agents/verification, to: shared/verification, only_used: true }
  # the applicant agent: its permission / audit / config parts only (its package loads the copilot lazily)
  - { from: app/agents/applicant/__init__.py, to: shared/applicant/__init__.py }
  - { from: app/agents/applicant/config.py, to: shared/applicant/config.py }
  - { from: app/agents/applicant/permissions.py, to: shared/applicant/permissions.py }
  - { from: app/agents/applicant/audit.py, to: shared/applicant/audit.py }
  - { from: app/agents/applicant/case_memory_facts.py, to: shared/applicant/case_memory_facts.py }
  - { from: app/agents/applicant/ledger.py, to: shared/applicant/ledger.py }
  - { from: app/agents/applicant/provenance.py, to: shared/applicant/provenance.py }
  - { from: app/agents/applicant/chat_store.py, to: shared/applicant/chat_store.py }
  - { from: app/agents/applicant/copilot/__init__.py, to: shared/applicant/copilot/__init__.py }
  - { from: app/agents/applicant/copilot/semantics/__init__.py, to: shared/applicant/copilot/semantics/__init__.py }
  - { from: app/agents/applicant/copilot/semantics/intents.py, to: shared/applicant/copilot/semantics/intents.py }
  - { from: app/agents/applicant/copilot/semantics/entities.py, to: shared/applicant/copilot/semantics/entities.py }
  - { from: app/agents/applicant/copilot/semantics/meaning.py, to: shared/applicant/copilot/semantics/meaning.py }
  # ---- the service and its scripts
  - { from: scripts/los_agentic_main.py, to: main.py }
  - { from: scripts/__init__.py, to: scripts/__init__.py }
  - { from: scripts/setup_agent_databases.py, to: scripts/setup_agent_databases.py }
  - { from: scripts/configure_agent_databases.py, to: scripts/configure_agent_databases.py }
  - { from: scripts/demo_activity.py, to: scripts/demo_activity.py }
  - { from: scripts/rules.py, to: scripts/rules.py }
  - { from: scripts/preflight_production.py, to: scripts/preflight_production.py }
  - { from: scripts/move_agents_to_los_agentic.py, to: scripts/move_agents_to_los_agentic.py }
  - { from: scripts/copy_local_data_to_agent_databases.py, to: scripts/copy_local_data_to_agent_databases.py }
  - { from: scripts/make_demo_bank_reports.py, to: scripts/make_demo_bank_reports.py }

# ---------------------------------------------------------------------------------------------------- non-code files
files:
  - { from: app/config, to: shared/config,
      exclude: [eligibility_config.yaml, dedupe_policy.yaml, customer_history_policy.yaml, leviosa_lms.yaml, mifin.yaml,
                mifin_demo.yaml, "bank_verification*.yaml", "crime_verification*.yaml", "legal_verification*.yaml"] }
  - { from: app/static/eligibility_ui.html, to: eligibility/static/eligibility_ui.html }
  - { from: app/config/eligibility_config.yaml, to: eligibility/conf/eligibility_config.yaml }
  - { from: app/config/dedupe_policy.yaml, to: dedupe/conf/dedupe_policy.yaml }
  - { from: app/config/customer_history_policy.yaml, to: dedupe/conf/customer_history_policy.yaml }
  - { from: app/config/leviosa_lms.yaml, to: dedupe/conf/leviosa_lms.yaml }
  - { from: app/config/mifin.yaml, to: dedupe/conf/mifin.yaml }
  - { from: app/config/demo/mifin_demo.yaml, to: dedupe/conf/mifin_demo.yaml }
  - { from: app/config/credit_underwriting/bank_verification.yaml, to: bank_verification/conf/bank_verification.yaml }
  - { from: app/config/credit_underwriting/bank_verification_wording.yaml, to: bank_verification/conf/bank_verification_wording.yaml }
  - { from: app/config/credit_underwriting/bank_verification_demo.yaml, to: bank_verification/conf/bank_verification_demo.yaml }
  - { from: app/config/credit_underwriting/crime_verification.yaml, to: crime_verification/conf/crime_verification.yaml }
  - { from: app/config/credit_underwriting/crime_verification_wording.yaml, to: crime_verification/conf/crime_verification_wording.yaml }
  - { from: app/config/credit_underwriting/crime_verification_demo.yaml, to: crime_verification/conf/crime_verification_demo.yaml }
  - { from: app/config/credit_underwriting/legal_verification.yaml, to: legal_verification/conf/legal_verification.yaml }
  - { from: app/config/credit_underwriting/legal_verification_wording.yaml, to: legal_verification/conf/legal_verification_wording.yaml }
  - { from: app/config/credit_underwriting/legal_verification_demo.yaml, to: legal_verification/conf/legal_verification_demo.yaml }
  - { from: requirements.txt, to: requirements.txt }
  - { from: scripts/los_agentic_docs/README.md, to: README.md }
  - { from: .env.example, to: .env.example }

