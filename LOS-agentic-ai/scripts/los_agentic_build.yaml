# repository names that are not a moved package (a moved package is renamed by its entry above). Longest first, whole
# names only, dotted and slashed forms both. A one-word name (`app`) is never rewritten.
renames:
  app.config.eligibility_config: eligibility.conf.eligibility_config
  app.config.dedupe_policy: dedupe.conf.dedupe_policy
  app.config.customer_history_policy: dedupe.conf.customer_history_policy
  app.config.credit_underwriting.bank_verification: bank_verification.conf.bank_verification
  app.config.credit_underwriting.crime_verification: crime_verification.conf.crime_verification
  app.config.credit_underwriting.legal_verification: legal_verification.conf.legal_verification
  app.config: shared.config
  app.static: shared.static
  tests.integration.test_customer_history: dedupe.tests.test_customer_history
  bank_verification_fixtures: bank_verification.tests.bank_verification_fixtures
  test_credit_slice2_graph: underwriting.tests.test_credit_slice2_graph
  test_credit_repayment: underwriting.tests.test_credit_repayment

# lines written against the repository's own layout -- matched on the REPOSITORY's text, before the renames
edits:
  bank_verification/config.py:
    - { old: 'DIR = ROOT / "app" / "config" / "credit_underwriting"', new: 'DIR = Path(__file__).resolve().parent / "conf"' }
  crime_verification/config.py:
    - { old: 'DIR = ROOT / "app" / "config" / "credit_underwriting"', new: 'DIR = Path(__file__).resolve().parent / "conf"' }
  legal_verification/config.py:
    - { old: 'DIR = ROOT / "app" / "config" / "credit_underwriting"', new: 'DIR = Path(__file__).resolve().parent / "conf"' }
  eligibility/config.py:
    - { old: 'return Path(override) if override else Path(CONFIG_DIR) / DEFAULT_FILENAME',
        new: 'return Path(override) if override else Path(__file__).resolve().parent / "conf" / DEFAULT_FILENAME' }
  dedupe/config.py:
    - { old: 'DEFAULT_PATH = Path(__file__).resolve().parents[2] / "config" / "dedupe_policy.yaml"',
        new: 'DEFAULT_PATH = Path(__file__).resolve().parent / "conf" / "dedupe_policy.yaml"' }
  dedupe/history_policy.py:
    - { old: 'PATH = Path(__file__).resolve().parents[2] / "config" / "customer_history_policy.yaml"',
        new: 'PATH = Path(__file__).resolve().parent / "conf" / "customer_history_policy.yaml"' }
  dedupe/leviosa.py:
    - { old: '_PATH = Path(__file__).resolve().parents[2] / "config" / "leviosa_lms.yaml"',
        new: '_PATH = Path(__file__).resolve().parent / "conf" / "leviosa_lms.yaml"' }
  dedupe/mifin.py:
    - { old: 'CONFIG_PATH = Path(__file__).resolve().parents[2] / "config" / "mifin.yaml"',
        new: 'CONFIG_PATH = Path(__file__).resolve().parent / "conf" / "mifin.yaml"' }
  dedupe/demo_sources.py:
    - { old: 'PATH = Path(__file__).resolve().parents[2] / "config" / "demo" / "mifin_demo.yaml"',
        new: 'PATH = Path(__file__).resolve().parent / "conf" / "mifin_demo.yaml"' }
  shared/core/constants.py:
    - { old: 'CONFIG_DIR = PROJECT_ROOT / "app" / "config"', new: 'CONFIG_DIR = PROJECT_ROOT / "shared" / "config"' }
  shared/db/core.py:
    - { old: 'CONFIG = ROOT / "app" / "config" / "agent_databases.yaml"', new: 'CONFIG = ROOT / "shared" / "config" / "agent_databases.yaml"' }
  conftest.py:
    - old: |2
            from app.agents.applicant.copilot import agent as _agent
            from app.agents.applicant.copilot.semantics import llm_router as _router

            _router.clear_cache()
            _agent.KNOWLEDGE_ANSWERS.clear()
      new: |2
            # (the copilot's own caches are cleared here in the LOS repository; the copilot is not in this project)
  underwriting/repayment/config.py:
    - { old: 'DIR = Path(__file__).resolve().parents[3] / "config" / "credit_underwriting"',
        new: 'DIR = Path(__file__).resolve().parent.parent.parent / "shared" / "config" / "credit_underwriting"' }
  scripts/preflight_production.py:
    - { old: 'CONFIG = ROOT / "app" / "config" / "preflight.yaml"', new: 'CONFIG = ROOT / "shared" / "config" / "preflight.yaml"' }
  shared/applicant/copilot/semantics/meaning.py:
    - { old: 'path = _ROOT / "app" / "config" / name', new: 'path = _ROOT / "shared" / "config" / name' }
  scripts/demo_activity.py:
    - { old: 'CONFIG = ROOT / "app" / "config" / "agent_databases_demo.yaml"',
        new: 'CONFIG = ROOT / "shared" / "config" / "agent_databases_demo.yaml"' }
  dedupe/tests/test_dedupe_agent.py:
    - old: 'async def test_the_los_flow_hands_released_pans_to_the_dedupe_and_survives_its_failure(repo, monkeypatch):'
      new: |-
        @pytest.mark.skip(reason="the LOS pipeline (los/flow.py) lives in the LOS repository, not in this project")
        async def test_the_los_flow_hands_released_pans_to_the_dedupe_and_survives_its_failure(repo, monkeypatch):
  docs_policy/tests/test_docs_verify_credit_agent.py:
    - { old: 'root = Path(__file__).resolve().parents[2] / "app" / "agents" / "docs_verify_credit_agent"',
        new: 'root = Path(__file__).resolve().parents[2] / "docs_policy"' }

# written into the project (not in the repository)
new_files:
  - to: pytest.ini
    content: |
      [pytest]
      asyncio_mode = auto
      markers =
          ocr: runs real OCR against sample documents (slow; excluded with -m "not ocr")
          slow: takes more than a few seconds
          live_llm: composes with the REAL local model; skipped unless LOS_LIVE_LLM_TESTS=1 and Ollama is reachable
          live_pg: runs the repository contract on a REAL PostgreSQL; skipped unless LOS_TEST_PG_DSN is set
          live_jev: calls the REAL JEV provider; skipped unless JEV_LIVE_TESTS=1
      # every agent keeps its tests in its own folder
      testpaths = eligibility/tests docs_policy/tests dedupe/tests bank_verification/tests crime_verification/tests legal_verification/tests shared/tests
      python_files = test_*.py
      addopts = --strict-markers

# folders that hold data, not Python
not_packages: [conf, static, policies, frontend, config]

keep_out:
  - "__pycache__"
  - "dist"
  - "*.pyc"
  - "*.sqlite3"
  - "*.log"
  - ".env"
  - "*.bak"
  - "node_modules"
  - "runtime"
  - "Screenshot*"
  - "*.jsonl"
