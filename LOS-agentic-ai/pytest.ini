[pytest]
# Async tests run without needing @pytest.mark.asyncio on every one of them.
asyncio_mode = auto

# Registering markers turns "Unknown pytest.mark.ocr" warnings into real
# behaviour: an unregistered marker silently does nothing, so a typo would
# have quietly run OCR tests in every suite instead of excluding them.
markers =
    ocr: runs real OCR against sample documents (slow; excluded with -m "not ocr")
    slow: takes more than a few seconds

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail on an unregistered marker rather than warning, so this cannot drift
# again.
addopts = --strict-markers
